schema_version: '2'
maturity: planned
requirements:
  openspec:code-review-portable-reviewer-bootstrap:review-portable-bootstrap:explicit-correspondence-resolves-source-basename-ambiguity:
    rationale: The immutable reviewer requires unambiguous explicit correspondence rather than an unrelated-test waiver.
    stakeholder_refs: [nold-ai/specfact-cli-modules#460]
    touchpoints:
    - id: explicit-test-correspondence
      kind: config_file
      locator: openspec/changes/code-review-portable-reviewer-bootstrap/specs/review-portable-bootstrap/spec.md
    verification_cases:
    - case_id: reviewer-bootstrap-1
      scenario_id: explicit-correspondence-resolves-source-basename-ambiguity
      method: test
      intent: Preserve order-independent explicit matches and reject absent or unrelated matches.
      observable: Failing regression evidence precedes the selection change; no test failure is promoted to PASS.
  openspec:code-review-portable-reviewer-bootstrap:review-portable-bootstrap:similarity-hash-caching-preserves-upstream-review-results:
    rationale: Reuse immutable upstream windows while preserving findings and all execution guards.
    stakeholder_refs: [nold-ai/specfact-cli-modules#460]
    touchpoints:
    - id: bounded-upstream-hashes
      kind: config_file
      locator: openspec/changes/code-review-portable-reviewer-bootstrap/specs/review-portable-bootstrap/spec.md
    verification_cases:
    - case_id: reviewer-bootstrap-2
      scenario_id: similarity-hash-caching-preserves-upstream-review-results
      method: test
      intent: Compare actual same-object duplicate results and restore/clear on all exits.
      observable: Missing cache regressions fail before implementation; upstream parity, eviction and teardown are required. Full sealed #498 timing remains a separate promotion check.
  openspec:code-review-portable-reviewer-bootstrap:review-portable-bootstrap:reviewer-installation-and-host-proofs-retain-ordinary-context:
    rationale: Actual hosted CI cannot install retired 0.50.1; reuse the owner-approved proof context separation without waiving assertions.
    stakeholder_refs: [nold-ai/specfact-cli-modules#460]
    touchpoints:
    - id: reviewer-installation
      kind: config_file
      locator: openspec/changes/code-review-portable-reviewer-bootstrap/specs/review-portable-bootstrap/spec.md
    verification_cases:
    - case_id: reviewer-bootstrap-3
      scenario_id: reviewer-installation-and-host-proofs-retain-ordinary-context
      method: test
      intent: Validate available reviewer installation and mandatory ordinary-host failure propagation.
      observable: Retired pin fails hosted installation; explicit host proof retains all old assertions, target selection omits its proof-only filename and failure remains blocking.
    - case_id: reviewer-bootstrap-4
      scenario_id: reviewer-installation-and-host-proofs-retain-ordinary-context
      method: test
      intent: Verify undecorated preparation JSON, prepared base/head descriptors and bounded preparation/kernel failure observations.
      observable: Missing descriptors, stale audit records, rotation and failed captures cannot establish preparation or attribute a denial; only fixed statuses and booleans are public, with all failing exits and kernel gates retained.
    - case_id: reviewer-bootstrap-7
      scenario_id: reviewer-installation-and-host-proofs-retain-ordinary-context
      method: test
      intent: Preserve oversized-report failure and unavailable assurance while projecting complete bounded root-header observations.
      observable: Seven meaningful regressions precede code; Unicode, nested spoofing, duplicate keys and malformed/incomplete headers retain privacy. Hosted observations and cause remain unverified.
  openspec:code-review-portable-reviewer-bootstrap:review-portable-bootstrap:sealed-timeout-diagnosis-retains-execution-guards:
    rationale: User approved bounded diagnosis of the verified sealed CrossHair timeout without changing analysis guards.
    stakeholder_refs: [nold-ai/specfact-cli-modules#460]
    touchpoints:
    - id: temporary-crosshair-sampling
      kind: config_file
      locator: openspec/changes/code-review-portable-reviewer-bootstrap/specs/review-portable-bootstrap/spec.md
    verification_cases:
    - case_id: reviewer-bootstrap-5
      scenario_id: sealed-timeout-diagnosis-retains-execution-guards
      method: test
      intent: Preserve command and deadlines, arm before attachment, cancel on every exit, and suppress private stack tokens.
      observable: Temporary sampler/privacy regressions precede diagnosis. The combined setup correction passes hosted candidate commit review; five production policy regressions precede sampler removal. Production hosted validation remains required.
  openspec:code-review-portable-reviewer-bootstrap:review-portable-bootstrap:invalid-pytest-requests-avoid-response-only-setup:
    rationale: Decode malformed requests before installed coverage planning and defer unused response imports without reducing contract coverage.
    stakeholder_refs: [nold-ai/specfact-cli-modules#460]
    touchpoints:
    - id: request-first-portable-pytest
      kind: config_file
      locator: openspec/changes/code-review-portable-reviewer-bootstrap/specs/review-portable-bootstrap/spec.md
    verification_cases:
    - case_id: reviewer-bootstrap-6
      scenario_id: invalid-pytest-requests-avoid-response-only-setup
      method: test
      intent: Preserve valid request fields, coverage findings, setup-error handling and uncaught import errors while avoiding unused setup.
      observable: Three setup-order regressions fail before code; valid request parity and response coverage pass. The combined correction passes hosted candidate commit review; removal of sampling requires fresh production evidence.
