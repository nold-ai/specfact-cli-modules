schema_version: '2'
requirements:
  openspec:ci-03-quality-fixture-identities:quality-fixture-identities:full-suite-selects-the-declared-core-baseline:
    rationale: Select the input identity required by the existing quality check without changing runtime or policy.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#518
    touchpoints:
    - id: quality-workflow
      kind: workflow
      locator: .github/workflows/pr-orchestrator.yml
    verification_cases:
    - case_id: CI-03-1-1
      scenario_id: full-suite-selects-the-declared-core-baseline
      method: test
      selector:
        runner: pytest
        node_id: tests/unit/workflows/test_paired_core_ref_trust.py::test_quality_full_suite_selects_only_declared_baseline
      intent: Full suite overrides the paired default.
      observable: The full suite retains hatch run test with a baseline-only environment override after candidate
        gates.
      implementation_task: '2.1'
