  openspec:ci-03-quality-fixture-identities:quality-fixture-identities:approved-orchestrator-candidates-retain-guarded-local-deferral:
    rationale: Align approved local eligibility with the existing blocking workflow trigger without weakening review.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#518
    touchpoints:
    - id: local-review-deferral
      kind: code
      locator: scripts/pre-commit-quality-checks.sh
    verification_cases:
    - case_id: CI-03-3-1
      scenario_id: approved-orchestrator-candidates-retain-guarded-local-deferral
      method: test
      selector:
        runner: pytest
        node_id: tests/host/proof_capsule_deferred_review_ci.py::test_narrow_local_deferral_retains_block2_and_cannot_run_in_ci[orchestrator-only]
      intent: Eligible candidate defers only local review and retains Block 2 checks.
      observable: The real shell hook checks the staged Git candidate and returns the required status and diagnostic.
      implementation_task: '4.3'
