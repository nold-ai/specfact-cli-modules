  openspec:code-review-independent-timeout-diagnostic:independent-review-diagnostic:preserve-failure-through-optional-observation-transport:
    rationale: Verify candidate-only bounded observations without changing review authority.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#510
