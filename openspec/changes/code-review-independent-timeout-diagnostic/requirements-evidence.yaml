      method: test
      intent: Exercise test_linux23_semgrep_whole_utf8_budget_omits_observations.
      observable: Named owner test asserts finite metadata, preserved failure and no invented authority.
    - case_id: linux23-model-compatibility
      scenario_id: capture-bounded-candidate-native-diagnostics
      method: test
      intent: Exercise test_linux23_diagnostic_old_absent_and_strict_roundtrip.
      observable: Named owner test asserts finite metadata, preserved failure and no invented authority.
    - case_id: linux24-complete-output-compatibility
      scenario_id: capture-bounded-candidate-native-diagnostics
      method: test
      intent: Exercise literal complete legacy output, real nested reports and populated diagnostic round trips.
      observable: Only absent native_diagnostic is omitted; all legacy nullable fields and serializer selections survive unchanged.
  openspec:code-review-independent-timeout-diagnostic:independent-review-diagnostic:capture-pytest-failures-at-operation-owners:
