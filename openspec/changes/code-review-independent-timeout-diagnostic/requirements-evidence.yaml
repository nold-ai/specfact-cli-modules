      locator: openspec/changes/code-review-independent-timeout-diagnostic/specs/independent-review-diagnostic/spec.md
    verification_cases:
    - case_id: linux23-semgrep-owner
      scenario_id: capture-bounded-candidate-native-diagnostics
      method: test
      intent: Exercise test_linux23_semgrep_native_identity_survives_loss_boundary.
      observable: Named owner test asserts finite metadata, preserved failure and no invented authority.
    - case_id: linux23-semgrep-bounds
      scenario_id: capture-bounded-candidate-native-diagnostics
      method: test
      intent: Exercise test_linux23_semgrep_nested_observation_bounds.
      observable: Named owner test asserts finite metadata, preserved failure and no invented authority.
    - case_id: linux23-semgrep-paths
