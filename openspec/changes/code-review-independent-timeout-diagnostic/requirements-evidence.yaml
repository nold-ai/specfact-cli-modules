  openspec:code-review-independent-timeout-diagnostic:independent-review-diagnostic:bind-public-native-diagnostics-to-admitted-side-evidence:
    rationale: Verify candidate-only bounded observations without changing review authority.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#510
    touchpoints:
    - id: bind-public-native-diagnostics-to-admitted-side-evidence
      kind: config_file
      locator: openspec/changes/code-review-independent-timeout-diagnostic/specs/independent-review-diagnostic/spec.md
    verification_cases:
    - case_id: linux23-canonical-host
