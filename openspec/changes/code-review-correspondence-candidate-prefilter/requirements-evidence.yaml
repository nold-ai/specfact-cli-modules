schema_version: '2'
requirements:
  openspec:code-review-correspondence-candidate-prefilter:review-run-command:necessary-condition-candidate-pruning:
    rationale: Reject impossible unchanged search candidates while preserving complete public and consumer output.
    touchpoints:
      - id: candidate-search
        kind: source_file
        locator: packages/specfact-code-review/src/specfact_code_review/run/differential.py
    verification_cases:
      - case_id: PREFILTER-001
        scenario_id: necessary-condition-candidate-pruning
        method: test
        intent: Assert four forbidden and two shared builds through public classification.
        observable: Four unchanged findings and complete evidence match original output.
        selector:
          runner: pytest
          node_id: tests/unit/specfact_code_review/run/test_correspondence_candidate_prefilter.py::test_unique_candidates_build_only_four_forbidden_matrices
      - case_id: PREFILTER-002
        scenario_id: necessary-condition-candidate-pruning
        method: test
        intent: Compare every output field in 107 frozen original cases including order and digest.
        observable: Complete public classification equals literal original output for every case.
        selector:
          runner: pytest
          node_id: tests/unit/specfact_code_review/run/test_correspondence_candidate_prefilter.py::test_complete_original_classification
      - case_id: PREFILTER-003
        scenario_id: necessary-condition-candidate-pruning
        method: test
        intent: Run the actual range-member consumer against seven original projections.
        observable: Consumer evidence and all serialized findings equal original literals.
        selector:
          runner: pytest
          node_id: tests/unit/specfact_code_review/run/test_correspondence_candidate_prefilter.py::test_actual_range_member_matches_original
      - case_id: PREFILTER-004
        scenario_id: necessary-condition-candidate-pruning
        method: test
        intent: Independently check equal unique anchors with alternate and nonoptimal correspondences.
        observable: Alternate optimum remains unknown and forced nonoptimal correspondence remains introduced.
        selector:
          runner: pytest
          node_id: tests/unit/specfact_code_review/run/test_correspondence_candidate_prefilter.py::test_equal_unique_anchors_still_need_optimality
      - case_id: PREFILTER-005
        scenario_id: necessary-condition-candidate-pruning
        method: test
        intent: Require final forbidden work and complete costs after all search candidates reject.
        observable: Fallback still computes its one forbidden matrix and reports anchor change.
        selector:
          runner: pytest
          node_id: tests/unit/specfact_code_review/run/test_correspondence_candidate_prefilter.py::test_rejected_search_still_builds_final_fallback_evidence
      - case_id: PREFILTER-006
        scenario_id: necessary-condition-candidate-pruning
        method: test
        intent: Check exact production bound predicates without large DP allocations.
        observable: Exact byte/line/cell limits admit and just-over limits reject.
        selector:
          runner: pytest
          node_id: tests/unit/specfact_code_review/run/test_correspondence_candidate_prefilter.py::test_exact_bounds_without_large_dp
