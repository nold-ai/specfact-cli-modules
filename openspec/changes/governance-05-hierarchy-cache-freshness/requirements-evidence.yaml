schema_version: "2"
requirements:
  openspec:governance-05-hierarchy-cache-freshness:github-hierarchy-cache:cache-refresh-records-hierarchy-metadata:
    rationale: A successful cache read must renew freshness even when the hierarchy content is unchanged.
    stakeholder_refs:
      - docs/agent-rules/60-github-change-governance.md
    touchpoints:
      - id: hierarchy-cache-sync
        kind: script
        locator: scripts/sync_github_hierarchy_cache.py
    verification_cases:
      - case_id: GOV-05-001
        scenario_id: cache-refresh-records-hierarchy-metadata
        method: test
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_sync_github_hierarchy_cache.py::test_sync_cache_skips_write_when_fingerprint_is_unchanged
        intent: Verify that a successful unchanged sync retains cache content and renews state freshness.
        observable: The markdown cache, including its Generated At line, is byte-stable and state generated_at advances beyond the seeded timestamp.
        implementation_task: "2.3"
      - case_id: GOV-05-002
        scenario_id: cache-refresh-records-hierarchy-metadata
        method: test
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_sync_github_hierarchy_cache.py::test_sync_cache_never_opens_final_destination_for_writing[markdown]
        intent: Verify markdown publication replaces a complete temporary file without truncating the final path.
        observable: The final-path write guard is not reached and the complete rendered cache is published.
      - case_id: GOV-05-003
        scenario_id: cache-refresh-records-hierarchy-metadata
        method: test
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_sync_github_hierarchy_cache.py::test_sync_cache_never_opens_final_destination_for_writing[state]
        intent: Verify state publication uses the same no-truncation boundary.
        observable: The final-path write guard is not reached and valid state JSON is published.
      - case_id: GOV-05-004
        scenario_id: cache-refresh-records-hierarchy-metadata
        method: test
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_sync_github_hierarchy_cache.py::test_sync_cache_failed_publication_preserves_prior_freshness
        intent: Verify injected publication failure preserves existing markdown and freshness.
        observable: The write fails, prior bytes remain, and no unlink is attempted; any retained temporary output is private on POSIX.
      - case_id: GOV-05-005
        scenario_id: cache-refresh-records-hierarchy-metadata
        method: test
        selector:
          runner: pytest
          node_id: tests/unit/scripts/test_sync_github_hierarchy_cache.py::test_cache_publication_does_not_unlink_after_success
        intent: Verify successful publication ends temporary-name ownership.
        observable: The complete cache is published without a subsequent unlink attempt on the temporary name.
