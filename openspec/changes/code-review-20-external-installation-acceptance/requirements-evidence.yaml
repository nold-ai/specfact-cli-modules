      scenario_id: published-compatibility-follows-installed-evidence
      method: inspection
      intent: 'Inspect planned scenario: Manager and platform corpus.'
      observable: each advertised cell demonstrates imports, entrypoints, native dependencies, plugins, configured
        checks and seeded defect detection or remains explicitly unadvertised. Planning inspection only; runtime
        tests, RED/GREEN, installed acceptance and publication remain pending.
    - case_id: published-compatibility-follows-installed-evidence-independent-python-support-inspection
      scenario_id: published-compatibility-follows-installed-evidence
      method: inspection
      intent: 'Inspect planned scenario: Independent Python support.'
      observable: their actual compatibility is recorded independently of the controller version and no capsule
        ABI allowlist rejects the whole project. Planning inspection only; runtime tests, RED/GREEN, installed acceptance
        and publication remain pending.
