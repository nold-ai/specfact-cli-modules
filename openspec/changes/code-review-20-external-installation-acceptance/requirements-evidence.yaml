schema_version: '2'
requirements:
  ? openspec:code-review-20-external-installation-acceptance:external-review-acceptance:external-installation-survives-fresh-invocations
  : rationale: Review the owner-approved replacement contract at planned maturity without claiming implementation
      evidence.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#516
    touchpoints:
    - id: external-review-acceptance-spec
      kind: config_file
      locator: openspec/changes/code-review-20-external-installation-acceptance/specs/external-review-acceptance/spec.md
    verification_cases:
    - case_id: external-installation-survives-fresh-invocations-fresh-pipx-and-uv-tool-installations-inspection
      scenario_id: external-installation-survives-fresh-invocations
      method: inspection
      intent: 'Inspect planned scenario: Fresh pipx and uv tool installations.'
      observable: the command loads its modules, uses project Python, detects a seeded defect and leaves project
        declarations and existing environment package inventory unchanged. Planning inspection only; runtime tests,
        RED/GREEN, installed acceptance and publication remain pending.
    - case_id: external-installation-survives-fresh-invocations-repeated-uvx-invocation-inspection
      scenario_id: external-installation-survives-fresh-invocations
      method: inspection
      intent: 'Inspect planned scenario: Repeated uvx invocation.'
      observable: module loading and declared dependencies work through supported installation paths without relying
        on a previously mutated uvx environment. Planning inspection only; runtime tests, RED/GREEN, installed acceptance
        and publication remain pending.
    - case_id: LOCAL-ARTIFACTS-OFFLINE
      scenario_id: external-installation-survives-fresh-invocations
      method: inspection
      intent: 'Inspect planned scenario: Run from verified local artifacts offline. Once a supported invocation
        route, signed modules, project environment and tools are available locally, disabled networking does
        not prevent installed review; missing prerequisites stay nonaccepting.'
      observable: The planned spec retains provisioned offline execution; no runtime or test maturity is claimed.
