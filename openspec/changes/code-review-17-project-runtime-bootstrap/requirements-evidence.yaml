        node_id: tests/unit/specfact_codebase/test_project_runtime.py::test_numeric_hatch_and_version_file_compare_whole_components
    - case_id: first-hatch-native-absolute-python-cold-without-version-file
      scenario_id: independent-customer-interpreter-selection
      method: test
      intent: Use a native absolute Hatch interpreter declaration for existing and cold targets, with and without
        version file.
      observable: Native command base prefix and full version match the declared interpreter; declarations remain
        unchanged.
      selector:
