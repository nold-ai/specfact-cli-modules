      evidence.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#513
    touchpoints:
    - id: project-runtime-bootstrap-spec
      kind: config_file
      locator: openspec/changes/code-review-17-project-runtime-bootstrap/specs/project-runtime-bootstrap/spec.md
    verification_cases:
    - case_id: independent-customer-interpreter-selection-different-controller-and-project-versions-inspection
      scenario_id: independent-customer-interpreter-selection
      method: inspection
      intent: 'Inspect planned scenario: Different controller and project versions.'
      observable: project imports and commands use the selected interpreter and the report records both identities.
        Planning inspection only; runtime tests, RED/GREEN, installed acceptance and publication remain pending.
    - case_id: independent-customer-interpreter-selection-ambiguous-or-missing-interpreter-inspection
      scenario_id: independent-customer-interpreter-selection
      method: inspection
      intent: 'Inspect planned scenario: Ambiguous or missing interpreter.'
      observable: it names the candidates or missing version and performs no installation or controller-Python fallback.
        Planning inspection only; runtime tests, RED/GREEN, installed acceptance and publication remain pending.
