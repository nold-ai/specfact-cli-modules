      scenario_id: faithful-external-sidecar-preparation
      method: inspection
      intent: 'Inspect planned scenario: First detached Hatch workflow.'
      observable: both execute the selected project command, native pytest plugin, entrypoint and dependency imports
        with unchanged project declarations and customer environment inventory. Planning inspection only; runtime
        tests, RED/GREEN, installed acceptance and publication remain pending.
    - case_id: faithful-external-sidecar-preparation-locked-manager-preparation-inspection
      scenario_id: faithful-external-sidecar-preparation
      method: inspection
      intent: 'Inspect planned scenario: Locked manager preparation.'
      observable: the native manager consumes the selected inputs without rewriting locks, weakening constraints,
        or replacing manager semantics with a generic pip install. Planning inspection only; runtime tests, RED/GREEN,
        installed acceptance and publication remain pending.
    - case_id: faithful-external-sidecar-preparation-unlocked-project-resolution-inspection
      scenario_id: faithful-external-sidecar-preparation
      method: inspection
      intent: 'Inspect planned scenario: Unlocked project resolution.'
      observable: the resulting dependency and origin identities are recorded externally and no lock or constraints
        are written into the customer project. Planning inspection only; runtime tests, RED/GREEN, installed acceptance
        and publication remain pending.
