    rationale: Review the owner-approved replacement contract at planned maturity without claiming implementation
      evidence.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#513
    touchpoints:
    - id: project-runtime-bootstrap-spec
      kind: config_file
      locator: openspec/changes/code-review-17-project-runtime-bootstrap/specs/project-runtime-bootstrap/spec.md
    verification_cases:
    - case_id: independent-customer-interpreter-selection-different-controller-and-project-versions-inspection
      scenario_id: independent-customer-interpreter-selection
      method: inspection
      intent: 'Inspect planned scenario: Different controller and project versions.'
      observable: project imports and commands use the selected interpreter and the report records both identities.
        Planning inspection only; runtime tests, RED/GREEN, installed acceptance and publication remain pending.
    - case_id: independent-customer-interpreter-selection-ambiguous-or-missing-interpreter-inspection
      scenario_id: independent-customer-interpreter-selection
      method: inspection
      intent: 'Inspect planned scenario: Ambiguous or missing interpreter.'
      observable: it names the candidates or missing version and performs no installation or controller-Python fallback.
        Planning inspection only; runtime tests, RED/GREEN, installed acceptance and publication remain pending.
    - case_id: first-hatch-selected-venv-identity-and-no-sync-even-with-stale-dependencies
      scenario_id: independent-customer-interpreter-selection
      method: test
      intent: Bounded first Hatch milestone. selected venv identity and no sync even with stale dependencies.
      observable: Actual selected environment execution satisfies the test predicate; full manager and reviewer
        rollout remains pending.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_codebase/test_project_runtime.py::test_selected_venv_identity_and_no_sync_even_with_stale_dependencies
    - case_id: first-hatch-missing-tool-never-falls-back-to-controller-path
      scenario_id: independent-customer-interpreter-selection
      method: test
      intent: Bounded first Hatch milestone. missing tool never falls back to controller path.
      observable: Actual selected environment execution satisfies the test predicate; full manager and reviewer
        rollout remains pending.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_codebase/test_project_runtime.py::test_missing_tool_never_falls_back_to_controller_path
    - case_id: first-hatch-project-python-constraint
      scenario_id: independent-customer-interpreter-selection
      method: test
      intent: Reject selected Python incompatible with project.requires-python before native manager queries.
      observable: Structured failure preserves requested constraint and does not invoke native Hatch.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_codebase/test_project_runtime.py::test_project_python_constraint_rejected_before_native_query
    - case_id: first-hatch-discover-existing-without-python-override
      scenario_id: independent-customer-interpreter-selection
      method: test
      intent: Use a probeable selected existing native environment without requiring redundant caller Python configuration.
      observable: Preparation discovers and validates the selected existing interpreter without lifecycle calls.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_codebase/test_project_runtime.py::test_existing_environment_discovered_without_redundant_python_override
    - case_id: first-hatch-explicit-base-python-existing
      scenario_id: independent-customer-interpreter-selection
      method: test
      intent: Bind an explicit base Python selection to the existing target installation.
      observable: Equal version with a different base installation returns a diagnostic naming both bases and no
        completed capability.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_codebase/test_project_runtime.py::test_explicit_base_python_must_match_prepared_target[existing]
    - case_id: first-hatch-explicit-base-python-cold
      scenario_id: independent-customer-interpreter-selection
      method: test
      intent: Bind an explicit base Python selection to the native-created cold target installation.
