      scenario_id: bounded-remediation-and-honest-readiness
      method: inspection
      intent: Inspect planned acceptance for Bounded Remediation and Honest Readiness.
      observable: THEN the loop stops with remaining findings and a non-passing outcome. THEN absence alone is not classified
        as invalid planning. Planned inspection only; implementation and signed producer acceptance remain pending.
  ? openspec:workflow-01-turn-orchestration:turn-workflow-orchestration:signed-current-run-producer-compatibility-precedes-adoption
