      locator: openspec/changes/workflow-01-turn-orchestration/specs/turn-workflow-orchestration/spec.md
    verification_cases:
    - case_id: exact-scoped-input-binding-inspection
      scenario_id: exact-scoped-input-binding
      method: inspection
      intent: Inspect planned acceptance for Exact Scoped Input Binding.
      observable: THEN their input digests differ and the earlier result cannot satisfy the later request. THEN checks evaluate
        the exact materialized index snapshot and preserve the original index/worktree. THEN its output is retained diagnostically
        but cannot establish a passing result for the current request. Planned inspection only; implementation and signed
        producer acceptance remain pending.
