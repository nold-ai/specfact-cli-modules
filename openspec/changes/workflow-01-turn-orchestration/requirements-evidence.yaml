    verification_cases:
    - case_id: disposable-local-progress-inspection
      scenario_id: disposable-local-progress
      method: inspection
      intent: Inspect planned acceptance for Disposable Local Progress.
      observable: THEN current checks run without reconstructing earlier sessions and chronology remains unclaimed. THEN it
        retains consumed budget, verifies current identities and reconciles incomplete work instead of treating it as success.
        Planned inspection only; implementation and signed producer acceptance remain pending.
