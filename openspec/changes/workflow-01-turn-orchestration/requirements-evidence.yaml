      method: inspection
      intent: Inspect planned acceptance for Signed Current-Run Producer Compatibility Precedes Adoption.
      observable: THEN the combination is rejected as not ready with an actionable diagnostic THEN the compatibility prerequisite
        is satisfied for that exact combination Planned inspection only; implementation and signed producer acceptance remain
        pending.
