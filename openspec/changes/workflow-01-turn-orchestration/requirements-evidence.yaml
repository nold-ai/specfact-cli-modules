    verification_cases:
    - case_id: ci-and-review-completion-are-independent-inspection
      scenario_id: ci-and-review-completion-are-independent
      method: inspection
      intent: Inspect planned acceptance for CI and Review Completion Are Independent.
      observable: THEN the loop remains incomplete. THEN it waits within the elapsed-time budget without inventing a code
        repair or marking success. Planned inspection only; implementation and signed producer acceptance remain pending.
  openspec:workflow-01-turn-orchestration:bounded-pr-remediation:bounded-and-recoverable-external-effects:
    rationale: Map the existing workflow proposal to planned inspection without claiming runtime evidence.
