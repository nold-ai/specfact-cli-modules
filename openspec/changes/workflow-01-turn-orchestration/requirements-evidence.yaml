    verification_cases:
    - case_id: portable-deterministic-orchestration-inspection
      scenario_id: portable-deterministic-orchestration
      method: inspection
      intent: Inspect planned acceptance for Portable Deterministic Orchestration.
      observable: THEN applicable checks use that configuration without requiring these repositories or internal wiki files.
        THEN it is blocked with an actionable diagnostic; optional checks are explicitly not evaluated, never silently passed.
        Planned inspection only; implementation and signed producer acceptance remain pending.
