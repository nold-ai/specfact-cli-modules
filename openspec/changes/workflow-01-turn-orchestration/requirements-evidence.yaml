    verification_cases:
    - case_id: independent-producer-outcomes-inspection
      scenario_id: independent-producer-outcomes
      method: inspection
      intent: Inspect planned acceptance for Independent Producer Outcomes.
      observable: THEN the test remains failing and the requested full verification cannot pass. THEN all affected gates run
        or reuse valid matching outputs; uncertain applicability selects the complete lane. Planned inspection only; implementation
        and signed producer acceptance remain pending.
  openspec:workflow-01-turn-orchestration:turn-workflow-orchestration:exact-scoped-input-binding:
    rationale: Map the existing workflow proposal to planned inspection without claiming runtime evidence.
    stakeholder_refs:
