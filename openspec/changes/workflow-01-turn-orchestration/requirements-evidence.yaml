schema_version: '2'
requirements:
  openspec:workflow-01-turn-orchestration:bounded-pr-remediation:explicit-local-pr-mutation-authority:
    rationale: Map the existing workflow proposal to planned inspection without claiming runtime evidence.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#483
    touchpoints:
    - id: bounded-pr-remediation-spec
      kind: config_file
      locator: openspec/changes/workflow-01-turn-orchestration/specs/bounded-pr-remediation/spec.md
    verification_cases:
    - case_id: explicit-local-pr-mutation-authority-inspection
      scenario_id: explicit-local-pr-mutation-authority
      method: inspection
      intent: Inspect planned acceptance for Explicit Local PR Mutation Authority.
      observable: THEN it reports actionable state without edits, commits, pushes or review writes. THEN mutation stops for
        reconciliation and evidence for A cannot close findings on B. Planned inspection only; implementation and signed producer
        acceptance remain pending.
  openspec:workflow-01-turn-orchestration:bounded-pr-remediation:ci-and-review-completion-are-independent:
