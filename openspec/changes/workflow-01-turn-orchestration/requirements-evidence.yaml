      locator: openspec/changes/workflow-01-turn-orchestration/specs/bounded-pr-remediation/spec.md
    verification_cases:
    - case_id: bounded-and-recoverable-external-effects-inspection
      scenario_id: bounded-and-recoverable-external-effects
      method: inspection
      intent: Inspect planned acceptance for Bounded and Recoverable External Effects.
      observable: THEN it reads the remote head and reconciles the operation before any retry, preserving consumed rounds.
        THEN it returns an exhausted/non-passing outcome with actionable state rather than looping indefinitely. THEN the
        thread remains unresolved; only a verified fix receives a commit/check reply and resolution. Planned inspection only;
        implementation and signed producer acceptance remain pending.
