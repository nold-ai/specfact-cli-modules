schema_version: '2'
requirements:
  openspec:code-review-linux-pytest-execution-budget:code-review-execution-budget:bounded-operator-linux-pytest-execution-budget:
    rationale: A complete configured Linux test workload needs an explicit bounded deadline without reducing scope.
    touchpoints:
      - id: budget-spec
        kind: config_file
        locator: openspec/changes/code-review-linux-pytest-execution-budget/specs/code-review-execution-budget/spec.md
    verification_cases:
      - case_id: BUDGET-001
        scenario_id: bounded-operator-linux-pytest-execution-budget
        method: inspection
        intent: Inspect default300, exact integer1..600 admission, public routing and unchanged non-pytest budgets.
        observable: The specification and focused routing tests preserve full workload selection and reject invalid budgets before execution.
  openspec:code-review-linux-pytest-execution-budget:code-review-execution-budget:budget-provenance-and-incomplete-evidence:
    rationale: Selected execution time must never grant completion or coverage authority.
    touchpoints:
      - id: incomplete-budget-spec
        kind: config_file
        locator: openspec/changes/code-review-linux-pytest-execution-budget/specs/code-review-execution-budget/spec.md
    verification_cases:
      - case_id: BUDGET-002
        scenario_id: budget-provenance-and-incomplete-evidence
        method: inspection
        intent: Inspect requested/effective metadata, timeout UNKNOWN/nonzero and Darwin fail-closed override.
        observable: Timeout and unsupported-platform controls remain incomplete; default platform behavior and signatures stay unchanged.
  openspec:code-review-linux-pytest-execution-budget:code-review-execution-budget:sealed-nonportable-pytest-budget-propagation:
    rationale: Explicit execution intent must reach the nonportable subprocess without altering legacy limits or crossing invocation boundaries.
    touchpoints:
      - id: private-budget-spec
        kind: config_file
        locator: openspec/changes/code-review-linux-pytest-execution-budget/specs/code-review-execution-budget/spec.md
    verification_cases:
      - case_id: BUDGET-003
        scenario_id: sealed-nonportable-pytest-budget-propagation
        method: inspection
        intent: Inspect strict private admission, actual subprocess limits and restoration across concurrent, nested and failing invocations.
        observable: Absent/default requests preserve legacy limits, explicit requests reach the subprocess and no operation inherits another budget.
  openspec:code-review-linux-pytest-execution-budget:code-review-execution-budget:independent-signed-review-keeps-a-bounded-whole-review-controller:
    rationale: The independent signed review exhausted its 300-second controller, so the controller may increase to a bounded 600 seconds while narrower execution limits remain unchanged; fresh hosted execution must establish whether the complete review finishes.
    touchpoints:
      - id: independent-review-workflow
        kind: config_file
        locator: .github/workflows/capsule-customer-execution.yml
    verification_cases:
      - case_id: BUDGET-004
        scenario_id: independent-signed-review-keeps-a-bounded-whole-review-controller
        method: test
        intent: Execute the independent inline review wrapper with the600-second controller and preserve blocking exit124 on expiry.
        observable: The workflow test records timeout=600 for the complete review, unchanged preparation and member/analyzer limits, and propagates exit124 without synthesizing success.
