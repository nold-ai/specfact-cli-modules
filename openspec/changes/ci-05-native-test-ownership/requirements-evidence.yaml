      scenario_id: complete-actual-outcomes-gate-success
      method: test
      intent: Admit exact original successful outcomes; synthetic unit reports remain distinct from actual native
        execution.
      observable: exact 702 unique passes and bounded inspectable JUnit/summary qualify; incomplete outcomes never
        qualify
      implementation_task: '2.2'
      selector:
        runner: pytest
        node_id: tests/unit/native_release/test_native_execution_proof.py::test_incomplete_or_unsuccessful_results_refuse
