schema_version: '2'
requirements:
  openspec:ci-05-native-test-ownership:native-test-ownership:acceptance-requires-physical-proof-before-receipt:
    rationale: acceptance requires physical proof before receipt
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#521
    touchpoints:
    - id: acceptance-requires-physical-proof-before-receipt
      kind: source
      locator: scripts/native_release/acceptance.py
    verification_cases:
    - case_id: CI-05-1-1
      scenario_id: acceptance-requires-physical-proof-before-receipt
      method: test
      intent: attempt candidate acceptance
      observable: unconditional admitted-runtime proof call precedes the success receipt without swallowed failure
      implementation_task: '2.1'
      selector:
        runner: pytest
        node_id: tests/unit/native_release/test_physical_proof_ownership.py::test_acceptance_requires_proof_inside_runtime_before_receipt
    - case_id: CI-05-1-2
      scenario_id: acceptance-requires-physical-proof-before-receipt
      method: test
      intent: validate release receipt checks
      observable: native_execution is a required existing receipt check
      implementation_task: '2.1'
      selector:
        runner: pytest
        node_id: tests/unit/native_release/test_physical_proof_ownership.py::test_release_receipts_require_native_execution
