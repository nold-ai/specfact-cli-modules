schema_version: "2"
requirements:
  openspec:requirements-08-bounded-red-green-proof:requirements-bounded-red-green-proof:independent-current-execution-and-chronology:
    rationale: "Current execution and historical chronology are separate evidence claims."
    stakeholder_refs:
      - "nold-ai/specfact-cli#665"
      - "nold-ai/specfact-cli#675"
      - "nold-ai/specfact-cli-modules#414"
    touchpoints:
      - id: requirements-report-claims
        kind: planned_schema
        locator: "requirements report schema"
    verification_cases:
      - case_id: R08-MOD-001
        scenario_id: independent-current-execution-and-chronology
        method: test
        intent: "Prevent either claim from inflating or erasing the other."
        observable: "Separate statuses and provenance in finalized evidence."
  openspec:requirements-08-bounded-red-green-proof:requirements-bounded-red-green-proof:trusted-replay-capsule-validation:
    rationale: "The module validates trusted replay evidence without owning execution."
    stakeholder_refs:
      - "nold-ai/specfact-cli#665"
      - "nold-ai/specfact-cli#675"
      - "nold-ai/specfact-cli-modules#414"
    touchpoints:
      - id: replay-capsule-schema
        kind: planned_schema
        locator: "historical replay capsule"
    verification_cases:
      - case_id: R08-MOD-002
        scenario_id: trusted-replay-capsule-validation
        method: test
        intent: "Validate B/R/H/D identities, protected signed R/H checkpoint object/signature/trust bindings, all transition/hash links, frozen red inputs including pre-R readiness-validation evidence, selectors, exact R/D frozen failing/readiness section equality, exact mapped/observed red failure identities, fail/pass/pass outcomes, signed module identity, and epoch."
        observable: "Trusted capsules require valid externally issued R/H checkpoint bindings, byte-identical frozen failing/readiness sections from R through D, and one canonical observed red marker matching each frozen expected_failure_id before pass/pass outcomes; missing, duplicate, wrong, or same-class-but-wrong IDs produce a deterministic non-green finding."
  openspec:requirements-08-bounded-red-green-proof:requirements-bounded-red-green-proof:bounded-chronology-claim:
    rationale: "The assurance statement must not exceed the supplied evidence."
    stakeholder_refs:
      - "nold-ai/specfact-cli#671"
      - "nold-ai/specfact-cli#675"
      - "nold-ai/specfact-cli-modules#414"
    touchpoints:
      - id: chronology-claim
        kind: planned_artifact
        locator: "red_green_chronology"
    verification_cases:
      - case_id: R08-MOD-003
        scenario_id: bounded-chronology-claim
        method: test
        intent: "Emit the fixed fail-at-R/pass-at-H/remain-pass-at-D bounded claim and limitations."
        observable: "No complete-intent, dependency, quality, or defect-absence claim."
  openspec:requirements-08-bounded-red-green-proof:requirements-bounded-red-green-proof:fail-closed-untrusted-chronology:
    rationale: "Missing trust must never become a green chronology result."
    stakeholder_refs:
      - "nold-ai/specfact-cli#665"
      - "nold-ai/specfact-cli#675"
      - "nold-ai/specfact-cli-modules#414"
    touchpoints:
      - id: chronology-policy
        kind: planned_policy
        locator: "bounded red-green reconciliation"
    verification_cases:
      - case_id: R08-MOD-004
        scenario_id: fail-closed-untrusted-chronology
        method: test
        intent: "Return unknown/unproven and fail strict policy for incomplete capsules."
        observable: "Diagnostics are retained and no pass/no-impact is emitted."
  openspec:requirements-08-bounded-red-green-proof:requirements-proof-review-context:finalized-requirements-evidence-review-context:
    rationale: "Code Review must retain chronology and current-execution provenance without verdict fusion."
    stakeholder_refs:
      - "nold-ai/specfact-cli#675"
      - "nold-ai/specfact-cli-modules#414"
    touchpoints:
      - id: code-review-proof-context
        kind: planned_schema
        locator: "specfact code review run --requirements-evidence"
    verification_cases:
      - case_id: R08-MOD-005
        scenario_id: finalized-requirements-evidence-review-context
        method: test
        intent: "Retain finalized B/R/H/D chronology provenance independently from the Code Review verdict."
        observable: "Review context exposes both Requirements claims and their limitations without changing findings, score, verdict, or exit code."
