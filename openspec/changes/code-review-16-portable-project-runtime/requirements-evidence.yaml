schema_version: '2'
requirements:
  openspec:code-review-16-portable-project-runtime:portable-project-runtime:discover-a-project-without-executing-its-code:
    rationale: Discover a project without executing its code. The approved portable-runtime story requires independent
      customer runtime evidence.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#473
    - nold-ai/specfact-cli-modules#472
    touchpoints:
    - id: openspec-source-spec
      kind: config_file
      locator: openspec/changes/code-review-16-portable-project-runtime/specs/portable-project-runtime/spec.md
    verification_cases:
    - case_id: 473-1-1
      scenario_id: discover-a-project-without-executing-its-code
      method: test
      intent: Verify hatchling is only a build backend through the focused regression suite and, for execution claims,
        the pinned Linux capsule corpus.
      observable: Actual test assertions and retained runtime/report evidence must demonstrate the stated scenario.
        Local unit or bootstrap results do not constitute signed release acceptance.
    - case_id: 473-1-2
      scenario_id: discover-a-project-without-executing-its-code
      method: test
      intent: Verify external hatch configuration through the focused regression suite and, for execution claims,
        the pinned Linux capsule corpus.
      observable: Actual test assertions and retained runtime/report evidence must demonstrate the stated scenario.
        Local unit or bootstrap results do not constitute signed release acceptance.
    - case_id: 473-1-3
      scenario_id: discover-a-project-without-executing-its-code
      method: test
      intent: Verify conflicting environment evidence through the focused regression suite and, for execution claims,
        the pinned Linux capsule corpus.
      observable: Actual test assertions and retained runtime/report evidence must demonstrate the stated scenario.
        Local unit or bootstrap results do not constitute signed release acceptance.
    - case_id: 473-1-4
      scenario_id: discover-a-project-without-executing-its-code
      method: test
      intent: Verify requirements constraints and local inputs through the focused regression suite and, for execution
        claims, the pinned Linux capsule corpus.
      observable: Actual test assertions and retained runtime/report evidence must demonstrate the stated scenario.
        Local unit or bootstrap results do not constitute signed release acceptance.
    - case_id: 473-1-5
      scenario_id: discover-a-project-without-executing-its-code
      method: test
      intent: Preserve verified checkout activation across actual immutable index and revision materialization.
      observable: Snapshot dependency hashes remain distinct from live inputs; spoofed or unrelated activation is rejected,
        explicit selection wins even when the active environment is absent, and missing environments are diagnosed.
    - case_id: 473-1-6
      scenario_id: discover-a-project-without-executing-its-code
      method: test
      intent: Recognize verified implicit Hatch default activation across live, index and revision discovery.
      observable: Default activation passes without an explicit default table; environment-only configuration still wins and unrelated activation remains rejected.
