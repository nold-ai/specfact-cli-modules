  openspec:code-review-16-portable-project-runtime:portable-project-runtime:observe-ordinary-customer-pytest-execution:
    rationale: Observe ordinary customer pytest execution. The approved portable-runtime story requires independent
      customer runtime evidence.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#473
    - nold-ai/specfact-cli-modules#472
    touchpoints:
    - id: openspec-source-spec
      kind: config_file
      locator: openspec/changes/code-review-16-portable-project-runtime/specs/portable-project-runtime/spec.md
    verification_cases:
    - case_id: 473-5-1
      scenario_id: observe-ordinary-customer-pytest-execution
      method: test
      intent: Verify detached hatch reconstruction through the focused regression suite and, for execution claims,
        the pinned Linux capsule corpus.
      observable: Actual test assertions and retained runtime/report evidence must demonstrate the stated scenario.
        Local unit or bootstrap results do not constitute signed release acceptance.
    - case_id: 473-5-2
      scenario_id: observe-ordinary-customer-pytest-execution
      method: test
      intent: Verify controlled regression through the focused regression suite and, for execution claims, the pinned
        Linux capsule corpus.
      observable: Actual test assertions and retained runtime/report evidence must demonstrate the stated scenario.
        Local unit or bootstrap results do not constitute signed release acceptance.
    - case_id: 477-pytest-1
      scenario_id: observe-ordinary-customer-pytest-execution
      method: test
      intent: Mixed PASS/SKIP/XFAIL/XPASS outcomes and empty expected-failure reasons yield blocking findings.
      observable: Actual regressions in test_portable_pytest_evidence.py and test_portable_pytest_policy.py preserve
        RED/GREEN evidence; Linux signed capsule acceptance remains required.
    - case_id: 477-pytest-2
      scenario_id: observe-ordinary-customer-pytest-execution
      method: test
      intent: Missing and low per-source coverage fail with effective native thresholds and an 80 percent minimum.
      observable: Actual regressions in test_portable_pytest_evidence.py and test_portable_pytest_policy.py preserve
        RED/GREEN evidence; Linux signed capsule acceptance remains required.
    - case_id: 477-pytest-3
      scenario_id: observe-ordinary-customer-pytest-execution
      method: test
      intent: Nested pytest roots resolve actual test files without exempting production under discovery roots.
      observable: Actual regressions in test_portable_pytest_evidence.py and test_portable_pytest_policy.py preserve
        RED/GREEN evidence; Linux signed capsule acceptance remains required.
    - case_id: 478-pytest-paths
      scenario_id: observe-ordinary-customer-pytest-execution
      method: test
      intent: Non-passing nested pytest nodeids identify snapshot-relative test files without changing raw evidence.
      observable: Nested relative and absolute roots map findings to the reviewed test file; outside roots and
        escaping node paths yield incomplete-evidence diagnostics without false file attribution.
    - case_id: 478-pytest-startup
      scenario_id: observe-ordinary-customer-pytest-execution
      method: test
      intent: Native pytest usage errors preserve the targeted member and recorded execution without a fabricated root.
      observable: A real unknown-option exit four with null root retains target_execution in the capsule response;
        malformed roots on otherwise usable observations produce actionable incomplete-evidence diagnostics.
    - case_id: 478-installed-coverage
      scenario_id: observe-ordinary-customer-pytest-execution
      method: test
      intent: Attribute native installed-project coverage only through sealed local distribution ownership and identical source bytes.
      observable: Real installed-package pytest keeps native imports, actual defect exits, per-source coverage, and raw rows; generated code, ownership ambiguity, unsafe RECORD entries, and changed snapshots receive no guessed credit.
    - case_id: 478-installed-flat-coverage
      scenario_id: observe-ordinary-customer-pytest-execution
      method: test
      intent: Distinguish enumerated unexecuted flat-layout snapshot rows from actual installed execution.
      observable: Native importlib pytest records zero executed snapshot lines and real installed lines; verified attribution replaces only the evaluation alias while preserving raw zero rows and true snapshot execution precedence.
    - case_id: 478-installed-native-aliases
      scenario_id: observe-ordinary-customer-pytest-execution
      method: test
      intent: Retain transformed-source uncertainty when native coverage aliases rewrite installed filenames.
      observable: A real two-file alias reproduction cannot pass for different source bytes; identical mappings and unrelated native alias patterns remain supported, post-execution identity errors persist, and unavailable origin APIs preserve test records with an explicit diagnostic. Renamed package origins are recorded for the whole measured directory and cannot credit an unmatched reviewed source.
    - case_id: 478-installed-single-module
      scenario_id: observe-ordinary-customer-pytest-execution
      method: test
      intent: Attribute uniquely owned installed py_modules without granting coverage over unrelated site packages.
      observable: Actual root and src-layout module imports retain verified 100 percent source attribution and untouched raw rows; duplicate source/ownership, changed bytes and malformed names reject credit. Native and configured source scopes remain authoritative while reviewer defaults use only the verified module selector.
    - case_id: 478-pytest-coverage-fidelity
      scenario_id: observe-ordinary-customer-pytest-execution
      method: test
      intent: Separate reviewer-only measurement from native coverage activation without reducing the per-file floor.
      observable: Real subprocess tests preserve native reset, config, include/omit, report bytes, threshold, precision, disabling and failure outcomes; high aggregate coverage cannot hide low selected-file coverage.
    - case_id: 478-pytest-coverage-workers
      scenario_id: observe-ordinary-customer-pytest-execution
      method: test
      intent: Preserve real distributed and configured subprocess evidence under the supported plugin lifecycle.
      observable: Real native and reviewer -n2 tests combine worker lines, missing worker receipts stay incomplete, configured subprocess lines are collected, and strict warning policy and customer cwd are preserved.
    - case_id: 478-pytest-coverage-bootstrap
      scenario_id: observe-ordinary-customer-pytest-execution
      method: test
      intent: Load only the verified target helper without widening supervisor or customer import paths.
      observable: Eight startup and cache tests reject forged aliases, exercise first-entry and child bootstrap, and invalidate builder identity when helper bytes change.
    - case_id: 478-pytest-coverage-policy
      scenario_id: observe-ordinary-customer-pytest-execution
      method: test
      intent: Preserve native aggregate failures and incomplete execution with typed evidence.
      observable: Controller tests retain real failure and collection evidence, reject malformed policy receipts and preserve exact actionable coverage diagnostics without treating arbitrary exit1 as an aggregate failure.
