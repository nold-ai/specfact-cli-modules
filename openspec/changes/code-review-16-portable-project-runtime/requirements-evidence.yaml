      observable: Focused regression assertions and actual Linux corpus execution must pass; local component results
        do not confer signed release acceptance.
    - case_id: 473-7-2
      scenario_id: native-environment-and-execution-evidence-fidelity
      method: test
      intent: Retain owned executables and actual pytest phase errors.
      observable: Focused regression assertions and actual Linux corpus execution must pass; local component results
        do not confer signed release acceptance.
    - case_id: 473-7-3
      scenario_id: native-environment-and-execution-evidence-fidelity
      method: test
      intent: Reject host manager startup failures without test calls.
      observable: Focused regression assertions and actual Linux corpus execution must pass; local component results
        do not confer signed release acceptance.
    - case_id: 473-7-4
      scenario_id: native-environment-and-execution-evidence-fidelity
      method: test
      intent: Bind VCS version inputs and immutable snapshot contexts.
      observable: Focused regression assertions and actual Linux corpus execution must pass; local component results
        do not confer signed release acceptance.
    - case_id: 473-7-5
      scenario_id: native-environment-and-execution-evidence-fidelity
      method: test
      intent: Select a signed Python worker matching project constraints.
      observable: Focused regression assertions and actual Linux corpus execution must pass; local component results
        do not confer signed release acceptance.
    - case_id: 473-7-6
      scenario_id: native-environment-and-execution-evidence-fidelity
      method: test
      intent: Allow localhost plugin coordination while external networking remains disabled.
      observable: Focused regression assertions and actual Linux corpus execution must pass; local component results
        do not confer signed release acceptance.
    - case_id: 473-7-7
      scenario_id: native-environment-and-execution-evidence-fidelity
      method: test
      intent: Preserve tool-only setup.cfg configuration without attempting a root package installation, while retaining
        native pip installable-directory behavior.
      observable: Adapter regressions retain requirements and constraints, omit an unbuildable root, and keep pyproject.toml
        or setup.py installation and extras controls passing.
    - case_id: 473-7-8
      scenario_id: native-environment-and-execution-evidence-fidelity
      method: test
      intent: Match targeted source tests through configured pytest directories, literal files and glob paths.
      observable: Real pytest-compatible cases select corresponding tests after path expansion, retain native no-match
        fallback and reject escaping roots without changing explicit selection or full native discovery.
    - case_id: 473-7-9
      scenario_id: native-environment-and-execution-evidence-fidelity
      method: test
      intent: Isolate controller diagnostic capture from builder-controlled filesystem paths.
      observable: Disposable sentinel tests reject symlink and special-file redirection, retain private failure
        and timeout diagnostics through a pre-created controller file descriptor, and close and remove successful
        logs without exposing captured output.
    - case_id: 473-7-10
      scenario_id: native-environment-and-execution-evidence-fidelity
      method: test
      intent: Validate untrusted builder artifact topology before controller-side reads or enrichment.
      observable: Disposable sentinel regressions reject root, native-directory, inventory and nested-file symlinks
        and special nodes before inventory access or native writes, while valid regular artifacts and final sealing
        remain accepted.
    - case_id: 473-7-11
      scenario_id: native-environment-and-execution-evidence-fidelity
      method: test
      intent: Preserve nested Python environment additions, overrides and removals, working directory and caller-private
        temporary files.
      observable: Real nested subprocess regressions retain caller context and relative file access; the reconstructed
        Hatch corpus exercises the same behavior through host, cold capsule and offline warm capsule execution.
    - case_id: 473-7-12
      scenario_id: native-environment-and-execution-evidence-fidelity
      method: test
      intent: Preserve the verified member dependency domain independently of mutable environment markers while
        retaining initial worker isolation.
      observable: Nested launch controls retain the mounted member domain under replacement environments; first-entry
        commands always clear inherited supervisor state and establish private process, mount and network namespaces.
    - case_id: 473-7-13
      scenario_id: native-environment-and-execution-evidence-fidelity
      method: test
      intent: Reject multiply linked runtime payloads and descriptors before content reads or attachment.
      observable: Disposable hardlinks fail preparation, sealing and same-byte post-seal reuse before payload reads;
        copied package-manager cache files remain accepted.
    - case_id: 473-7-14
      scenario_id: native-environment-and-execution-evidence-fidelity
      method: test
      intent: Keep controller diagnostic file descriptors outside the build namespace.
      observable: Actual child processes see pipe stdout rather than regular log storage; bounded capture preserves
        failure, timeout and downstream diagnostics and closes resources.
    - case_id: 473-7-15
      scenario_id: native-environment-and-execution-evidence-fidelity
      method: test
      intent: Preserve safe controller validation reasons in public preparation errors.
      observable: Actual nonzero and signal exits retain numeric status; artifact symlink, special-node and hardlink
        rejections expose their stable codes while arbitrary exception details stay private.
    - case_id: 473-7-16
      scenario_id: native-environment-and-execution-evidence-fidelity
      method: test
      intent: Preserve caller import paths for nested Python without replacing trusted startup or analyzer ownership.
      observable: Real nested wrappers match native caller imports for inherited and explicit absolute, relative,
        empty-component, empty and omitted PYTHONPATH in project and analyzer domains; reconstructed Hatch validates
        caller-only imports in its private temporary namespace.
    - case_id: 473-7-17
      scenario_id: native-environment-and-execution-evidence-fidelity
      method: test
      intent: Preserve builder logging assertions and keyword-only fixture inputs using pinned-engine-compatible syntax.
      observable: Real Semgrep 1.144.0 accepts the equivalent named fixture function and all builder logging tests pass; customer parser limitations remain explicit.


  openspec:code-review-16-portable-project-runtime:portable-project-runtime:pylint-preserves-attached-namespace-source-roots:
    rationale: Attached editable namespace imports must not be shadowed by Pylint's legacy file-root discovery.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#473
    - nold-ai/specfact-cli-modules#472
    touchpoints:
    - id: namespace-source-root-dispatch
      kind: config_file
      locator: packages/specfact-code-review/src/specfact_code_review/run/target_pylint.py
    verification_cases:
    - case_id: 473-8-1
      scenario_id: pylint-preserves-attached-namespace-source-roots
      method: test
      intent: Run real Pylint against editable, declared and overlapping namespace import roots with a same-name
        leaf.
      observable: test_attached_namespace_root_prevents_leaf_shadowing passes its three parameter cases.
    - case_id: 473-8-2
      scenario_id: pylint-preserves-attached-namespace-source-roots
      method: test
      intent: Preserve actual missing imports after correcting namespace source roots.
      observable: test_missing_import_is_preserved_with_attached_roots retains exactly the genuine E0401 finding.
    - case_id: 473-8-3
      scenario_id: pylint-preserves-attached-namespace-source-roots
      method: test
      intent: Keep native repository and command-line source-roots precedence, including an explicit empty value.
      observable: test_native_config_overrides_runtime_fallback and test_native_cli_overrides_repository_roots pass.
    - case_id: 473-8-4
      scenario_id: pylint-preserves-attached-namespace-source-roots
      method: test
      intent: Avoid unconfigured source overlays and preserve ordinary Pylint multiprocessing serialization.
      observable: test_built_runtime_does_not_infer_raw_source_root and test_parallel_pylint_retains_runtime_roots
        pass.
    - case_id: 473-8-5
      scenario_id: pylint-preserves-attached-namespace-source-roots
      method: test
      intent: Reject E0401/E0611 at all three verified Poetry import statements in cold and warm acceptance.
      observable: test_poetry_corpus_rejects_known_import_misresolution rejects all twelve phase/location/rule cases.
    - case_id: 473-8-6
      scenario_id: pylint-preserves-attached-namespace-source-roots
      method: test
      intent: Preserve unrelated upstream findings rather than imposing zero findings on untouched projects.
      observable: test_poetry_corpus_preserves_unrelated_findings accepts other files, lines and diagnostic classes.
    - case_id: 473-8-7
      scenario_id: pylint-preserves-attached-namespace-source-roots
      method: test
      intent: Invalidate cached runtime identity when only the trusted Pylint dispatcher changes.
      observable: test_controller_policy_change_invalidates_offline_runtime_reuse[target_pylint.py] preserves unchanged reuse and
        rejects changed bytes.

  openspec:code-review-16-portable-project-runtime:portable-project-runtime:declare-compatible-repository-development-analyzer-versions:
    rationale: Repository development tooling must remain compatible with its signed review analyzer entries.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#473
    touchpoints:
    - id: declared-development-tools
      kind: config_file
      locator: pyproject.toml
    verification_cases:
    - case_id: 473-9-1
      scenario_id: declare-compatible-repository-development-analyzer-versions
      method: test
      intent: Compare declared development tool ranges, actual observed incompatible versions and every signed ABI through production compatibility validation.
      observable: All three signed environments accept declared selections while the recorded incompatible native versions remain rejected; customer collision policy is unchanged.

    - case_id: 473-9-2
      scenario_id: declare-compatible-repository-development-analyzer-versions
      method: test
      intent: Keep the actual BasedPyright Node distribution sealed and explicitly reject conflicting project versions.
      observable: Real graph, launch mounts and import finder tests preserve matching or absent Node dependencies and unrelated legacy-name packages; all three signed ABI declarations admit only the matching Node pin.
    - case_id: 473-9-3
      scenario_id: declare-compatible-repository-development-analyzer-versions
      method: test
      intent: Prevent stale member graphs after a controller compatibility-policy change.
      observable: Warm offline cache reuse succeeds before the policy file changes and fails afterwards with the same project and signed worker identity.
  openspec:code-review-16-portable-project-runtime:portable-project-runtime:declare-bounded-target-native-tools:
    rationale: External tests require explicitly declared commands without importing arbitrary host environments.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#473
    - nold-ai/specfact-cli-modules#472
    touchpoints:
    - id: target-native-capabilities
      kind: config_file
      locator: packages/specfact-code-review/src/specfact_code_review/run/runtime_tools.py
    verification_cases:
    - case_id: 473-10-1
      scenario_id: declare-bounded-target-native-tools
      method: test
      intent: Preserve explicit configuration precedence and reject unsupported capabilities without PATH guessing.
      observable: Discovery regressions accept supported declarations and explicit overrides, rejecting unknown names and invalid types.
    - case_id: 473-10-2
      scenario_id: declare-bounded-target-native-tools
      method: test
      intent: Bind complete program, helper, launcher and transitive library bytes before the builder starts.
      observable: Capture tests verify local Git services, changed helper libraries and offline cache identities; missing binaries and libraries fail precisely.
    - case_id: 473-10-3
      scenario_id: declare-bounded-target-native-tools
      method: test
      intent: Install controller capture after project library inventory while rejecting all builder destination collisions.
      observable: Builder integration preserves original captured bytes and separate project library resolution; collision tests reject command, directory and file conflicts before writing.
    - case_id: 473-10-4
      scenario_id: declare-bounded-target-native-tools
      method: test
      intent: Execute real Git, uname and sed through the declared private launchers.
      observable: Non-root offline Linux smoke executes Git clean filters and file transport successfully; final signed capsule acceptance remains separately required.
  openspec:code-review-16-portable-project-runtime:portable-project-runtime:sanitized-vcs-lookup-retains-declared-target-git:
