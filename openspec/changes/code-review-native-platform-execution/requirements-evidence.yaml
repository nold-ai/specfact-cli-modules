      locator: openspec/changes/code-review-native-platform-execution/specs/review-native-platform-execution/spec.md
    verification_cases:
    - case_id: 460-6-1
      scenario_id: dependency-source-admission
      method: inspection
      intent: "Inspect planned acceptance: Signed dependency is prohibited."
      observable: "it fails before execution; signatures and ordinary trust exceptions cannot override the prohibition. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-6-2
      scenario_id: dependency-source-admission
      method: inspection
      intent: "Inspect planned acceptance: Inherited C14 lock conflicts with policy."
      observable: "design approval remains blocked until a compliant complete closure or separately approved policy change exists; old signatures confer no exemption. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-6-3
      scenario_id: dependency-source-admission
      method: inspection
      intent: "Inspect planned acceptance: Policy-admissible replacement is verified."
      observable: "native execution may proceed without satisfying the new selection from a superseded cache. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
  openspec:code-review-native-platform-execution:review-native-platform-execution:native-project-runtime-preparation:
    rationale: Define macOS ARM64 acceptance without claiming unexecuted runtime proof.
    stakeholder_refs:
