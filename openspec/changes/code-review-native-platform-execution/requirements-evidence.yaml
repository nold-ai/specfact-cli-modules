    - id: openspec-source-spec
      kind: config_file
      locator: openspec/changes/code-review-native-platform-execution/specs/review-native-platform-execution/spec.md
    verification_cases:
    - case_id: 460-3-8
      scenario_id: portable-review-semantics
      method: test
      intent: Invalid or empty-attribution requests do not trigger unnecessary ownership scans.
      observable: Planner/launcher guards prove malformed JSON/selectors are rejected before ownership I/O; preparation errors clear stale observations. Empty Python attribution inputs produce the identical empty bridge without metadata reads. Valid mappings retain full ownership, byte identity and target checks; all budgets remain unchanged.
    - case_id: 460-3-7
      scenario_id: portable-review-semantics
      method: test
      intent: Hosted transport and cp311 bootstrap preparation preserve strict input validation.
      observable: Executed artifact restore recipe passes actual immutable Git file validation without byte changes; unexpected executables remain rejected. Fresh cp311 preparation removes bootstrap setuptools before unchanged hash-pinned installation and lock admission.
    - case_id: 460-3-6
      scenario_id: portable-review-semantics
      method: test
      intent: Failed hosted reviews expose bounded profiling without granting acceptance.
      observable: Diagnostic summary tests reject malformed, oversized and substituted fields; only static tracked public symbols and sample counts survive. Workflow checks retain the required 300-second failure and a shorter independently stopped diagnostic replay; no raw profile is uploaded.
    - case_id: 460-3-5
      scenario_id: portable-review-semantics
      method: test
      intent: Synthetic enforcement tests do not borrow the real checkout as an identity fixture.
      observable: A fail-on-real-Git-inventory fixture guard preserves all five enforcement/readback assertions against a minimal standalone source; actual identity security tests remain unchanged. Local timing is diagnostic, not hosted acceptance.
    - case_id: 460-3-4
      scenario_id: portable-review-semantics
      method: test
      intent: "Pylint fatal diagnostics remain incomplete analyzer evidence."
      observable: "Six failing-before/passing-after regressions preserve fatal F0001/F0002/F0010 diagnostics as tool_error findings even outside selected paths, retaining ordinary findings. No internal analyzer crash may satisfy complete-report acceptance. Three independent checker regressions additionally reject fatal/style misclassification and tool errors despite complete member rows; genuine project findings remain accepted."
    - case_id: 460-3-1
      scenario_id: portable-review-semantics
      method: inspection
      intent: "Inspect planned acceptance: Portable fixture classification."
      observable: "introduced, fixed and unchanged findings and authoritative status/exit results agree; skipped, empty or UNKNOWN required evidence cannot pass acceptance. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-3-2
      scenario_id: portable-review-semantics
      method: inspection
      intent: "Inspect planned acceptance: OS dependent project tests."
      observable: "reports preserve the actual platform and outcomes without forcing cross-platform equality or relabeling genuine failures. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-3-3
