  openspec:code-review-native-platform-execution:review-native-platform-execution:managed-native-process-boundary:
    rationale: Owner-approved managed-process delivery; executable signed acceptance is still required.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#460
    touchpoints:
    - id: openspec-source-spec
      kind: config_file
      locator: openspec/changes/code-review-native-platform-execution/specs/review-native-platform-execution/spec.md
    verification_cases:
    - case_id: 460-9-11
      scenario_id: managed-native-process-boundary
      method: inspection
      intent: "Inspect planned acceptance: Worker changes task or thread exception ports."
      observable: "Task/thread set and swap operations are denied through kernel RPC restrictions on every supported OS; valid positive controls succeed outside confinement and missing newer hooks never omit that restriction. Complete matrix acceptance remains required."
    - case_id: 460-9-10
      scenario_id: managed-native-process-boundary
      method: inspection
      intent: "Inspect planned acceptance: Sandbox compiler rejects the sealed native profile."
      observable: "A bounded numeric compiler line may accompany failed startup; raw messages are private and no diagnostic record satisfies READY or image admission. Mandatory isolation acceptance remains unchanged."
    - case_id: 460-9-9
      scenario_id: managed-native-process-boundary
      method: inspection
      intent: "Inspect planned acceptance: Bootstrap fails before the trace handshake."
      observable: "A bounded phase/errno marker rejects startup without satisfying READY, tracing or image admission. Invalid/future phases fail closed, original cleanup remains mandatory, and raw output is not published. Focused executable proof remains separate from full release acceptance."
    - case_id: 460-9-1
      scenario_id: managed-native-process-boundary
      method: inspection
      intent: 'Inspect planned acceptance: Managed subprocess completes.'
      observable: "The broker launches a separately confined direct worker through a bounded private channel and returns output, status and lifecycle; all ten analyzers and the pip/Hatch/uv/Poetry corpus remain first-release requirements. Planned inspection only; signed runtime and publication acceptance remain unproven."
    - case_id: 460-9-2
      scenario_id: managed-native-process-boundary
      method: inspection
      intent: 'Inspect planned acceptance: Worker bypasses compatibility adapter.'
      observable: "The kernel denies direct fork/vfork/posix_spawn, process-creation syscalls and unauthorized tracing, signals or IPC; unsupported behavior yields actionable incomplete evidence, never host fallback or PASS with missing required evidence. Planned inspection only; signed runtime and publication acceptance remain unproven."
    - case_id: 460-9-3
      scenario_id: managed-native-process-boundary
      method: inspection
      intent: 'Inspect planned acceptance: Broker dies during startup or execution.'
      observable: "No unconfined project code runs across startup, tracing, confinement or exec; independent observation finds no governed survivor after five seconds following broker/CLI death, timeout or cancellation, including concurrent requests, with 100 repetitions per lifecycle race. Planned inspection only; signed runtime and publication acceptance remain unproven."
    - case_id: 460-9-4
      scenario_id: managed-native-process-boundary
      method: inspection
      intent: 'Inspect planned acceptance: Fixed trusted bootstrap owns the pre-trace interval.'
      observable: "Default-signal fixed trusted startup plus kernel tracing must remove governed workers and invocation jobs within five seconds, independently observed with 100 repetitions per transition and negative controls. STARTUP_BOUNDARY_RESULTS.md records a local physical-host subset; it does not establish the complete signed boundary, supported matrix or publication acceptance."
    - case_id: 460-9-5
      scenario_id: managed-native-process-boundary
      method: inspection
      intent: 'Inspect planned acceptance: Private control protocol preserves authority and terminal status.'
      observable: "CONTROL_BOUNDARY_CONTRACT.md specifies private authenticated bounded requests, owned handles, preserved terminal status and independently observed lifecycle gates excluding competing cleanup. Sanitized original-owner socket readiness categories aid startup diagnosis without changing its budget. Local fixed-fixture evidence does not approve production artifacts, the OS matrix or manager adapters."
    - case_id: 460-9-7
      scenario_id: managed-native-process-boundary
      method: inspection
      intent: 'Inspect planned acceptance: Owned Mach signal exceptions complete without BSD wakeup dependence.'
      observable: "MACH_SIGNAL_CONTRACT.md requires pre-spawn exception endpoints, kernel-origin owned task/thread admission, initial-stop and explicitly verified one-use image handoff suppression, preserved terminal signals and independent five-second/100-round cleanup. Generated SDK provenance and actual hosted results remain necessary; mocked admission checks do not approve production."
    - case_id: 460-9-8
      scenario_id: managed-native-process-boundary
