      observable: "The exact event-bound candidate/base delta reaches the unchanged blocking helper in an isolated ordinary-user worktree. Timeout, enforcement and sandbox checks remain intact; nonzero exit fails the required customer job. Other local gates remain required, credentials are excluded and candidate evidence does not establish public release acceptance."
