schema_version: '2'
requirements:
  openspec:code-review-native-platform-execution:review-native-platform-execution:native-local-execution:
    rationale: Define macOS ARM64 acceptance without claiming unexecuted runtime proof.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#460
    touchpoints:
    - id: openspec-source-spec
      kind: config_file
      locator: openspec/changes/code-review-native-platform-execution/specs/review-native-platform-execution/spec.md
    verification_cases:
    - case_id: 460-1-1
      scenario_id: native-local-execution
      method: inspection
      intent: "Inspect planned acceptance: Agent invokes the native CLI."
      observable: "the selected runtime executes natively without sudo, Docker, WSL, a VM, Rosetta or CPU emulation; diagnostics and reports identify the actual OS, architecture, ABI and backend. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-1-2
      scenario_id: native-local-execution
      method: inspection
      intent: "Inspect planned acceptance: Architecture is not silently substituted."
      observable: "execution fails with an actionable unsupported diagnostic; no Homebrew, emulated or development-host fallback satisfies capsule acceptance. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
  openspec:code-review-native-platform-execution:review-native-platform-execution:native-isolation-capability-evidence:
    rationale: Define macOS ARM64 acceptance without claiming unexecuted runtime proof.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#460
    touchpoints:
    - id: openspec-source-spec
      kind: config_file
      locator: openspec/changes/code-review-native-platform-execution/specs/review-native-platform-execution/spec.md
    verification_cases:
    - case_id: 460-2-1
      scenario_id: native-isolation-capability-evidence
      method: inspection
      intent: "Inspect planned acceptance: Isolation and cleanup are proven."
      observable: "allowed operations succeed and denied operations fail for the intended policy reason; helper startup or parser failure is not successful confinement evidence. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-2-2
      scenario_id: native-isolation-capability-evidence
      method: inspection
      intent: "Inspect planned acceptance: Required capability is unavailable."
      observable: "the runtime rejects analyzer launch and reports incomplete evidence under the released status/exit contract without weakening isolation. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-2-3
      scenario_id: native-isolation-capability-evidence
      method: inspection
      intent: "Inspect planned acceptance: Cancellation and descendants are bounded."
      observable: "all governed descendants terminate within the frozen cleanup bound; fixtures independently check survivors and resource ceilings rather than treating killpg alone as proof. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-2-4
      scenario_id: native-isolation-capability-evidence
      method: inspection
      intent: "Inspect planned acceptance: Startup cannot bypass confinement."
      observable: "untrusted code cannot execute before the required boundary is active or use inherited access to bypass it; allowed Apple system libraries are explicitly distinguished from prohibited ambient dependencies. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
  openspec:code-review-native-platform-execution:review-native-platform-execution:portable-review-semantics:
    rationale: Define macOS ARM64 acceptance without claiming unexecuted runtime proof.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#460
    touchpoints:
    - id: openspec-source-spec
      kind: config_file
      locator: openspec/changes/code-review-native-platform-execution/specs/review-native-platform-execution/spec.md
    verification_cases:
    - case_id: 460-3-1
      scenario_id: portable-review-semantics
      method: inspection
      intent: "Inspect planned acceptance: Portable fixture classification."
      observable: "introduced, fixed and unchanged findings and authoritative status/exit results agree; skipped, empty or UNKNOWN required evidence cannot pass acceptance. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-3-2
      scenario_id: portable-review-semantics
      method: inspection
      intent: "Inspect planned acceptance: OS dependent project tests."
      observable: "reports preserve the actual platform and outcomes without forcing cross-platform equality or relabeling genuine failures. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-3-3
      scenario_id: portable-review-semantics
      method: inspection
      intent: "Inspect planned acceptance: Older protected consumer receives native evidence."
      observable: "it rejects unsupported evidence explicitly rather than interpreting it as historical Linux or protected PR assurance. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
  openspec:code-review-native-platform-execution:review-native-platform-execution:verified-provisioning-and-offline-reuse:
    rationale: Define macOS ARM64 acceptance without claiming unexecuted runtime proof.
    stakeholder_refs:
