schema_version: '2'
requirements:
  openspec:code-review-native-platform-execution:review-native-platform-execution:native-local-execution:
    rationale: Define macOS ARM64 acceptance without claiming unexecuted runtime proof.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#460
    touchpoints:
    - id: openspec-source-spec
      kind: config_file
      locator: openspec/changes/code-review-native-platform-execution/specs/review-native-platform-execution/spec.md
    verification_cases:
    - case_id: 460-1-1
      scenario_id: native-local-execution
      method: inspection
      intent: "Inspect planned acceptance: Agent invokes the native CLI."
      observable: "the selected runtime executes natively without requiring sudo, Docker, WSL, an additional VM, Rosetta or CPU emulation; compatible full VMs and physical systems are eligible, and diagnostics and reports identify the actual OS, architecture, ABI and backend. Planned maturity only; complete release acceptance is required by FEASIBILITY.md and tasks.md; no release pass is claimed."
    - case_id: 460-1-2
      scenario_id: native-local-execution
      method: inspection
      intent: "Inspect planned acceptance: Architecture is not silently substituted."
      observable: "execution fails with an actionable unsupported diagnostic; no Homebrew, emulated or development-host fallback satisfies capsule acceptance. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
  openspec:code-review-native-platform-execution:review-native-platform-execution:native-isolation-capability-evidence:
