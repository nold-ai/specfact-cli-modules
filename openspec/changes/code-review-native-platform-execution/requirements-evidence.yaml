schema_version: '2'
requirements:
  openspec:code-review-native-platform-execution:review-native-platform-execution:native-local-execution:
    rationale: Define macOS ARM64 acceptance without claiming unexecuted runtime proof.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#460
    touchpoints:
    - id: openspec-source-spec
      kind: config_file
      locator: openspec/changes/code-review-native-platform-execution/specs/review-native-platform-execution/spec.md
    verification_cases:
    - case_id: 460-1-1
      scenario_id: native-local-execution
      method: inspection
      intent: "Inspect planned acceptance: Agent invokes the native CLI."
      observable: "the selected runtime executes natively without requiring sudo, Docker, WSL, an additional VM, Rosetta or CPU emulation; compatible full VMs and physical systems are eligible, and diagnostics and reports identify the actual OS, architecture, ABI and backend. Planned maturity only; complete release acceptance is required by FEASIBILITY.md and tasks.md; no release pass is claimed."
    - case_id: 460-1-2
      scenario_id: native-local-execution
      method: inspection
      intent: "Inspect planned acceptance: Architecture is not silently substituted."
      observable: "execution fails with an actionable unsupported diagnostic; no Homebrew, emulated or development-host fallback satisfies capsule acceptance. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
  openspec:code-review-native-platform-execution:review-native-platform-execution:native-isolation-capability-evidence:
    rationale: Define macOS ARM64 acceptance without claiming unexecuted runtime proof.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#460
    touchpoints:
    - id: openspec-source-spec
      kind: config_file
      locator: openspec/changes/code-review-native-platform-execution/specs/review-native-platform-execution/spec.md
    verification_cases:
    - case_id: 460-15-6
      scenario_id: native-isolation-capability-evidence
      method: inspection
      intent: "Inspect acceptance: Kernel RPC denial retains exception endpoints."
      observable: "KERN_DENIED and KERN_NO_ACCESS still require unchanged independently read set/swap/clear endpoint snapshots and normal exit; actual signed controls run on ARM64. Lifecycle repetition requirements are unchanged."
    - case_id: 460-2-11
      scenario_id: native-isolation-capability-evidence
      method: test
      intent: Preserve proof assertions when an owned process exits between cleanup identity observation and signaling.
      observable: Cleanup catches only ProcessLookupError; regression tests retain permission failures and reject absent or changed identities. Actual local controller-loss, bootstrap-failure and exception-denial proofs pass with unchanged numeric protocol, positive controls and five-second deadline. Hosted supported cells remain separate acceptance.
    - case_id: 460-2-1
      scenario_id: native-isolation-capability-evidence
      method: inspection
      intent: "Inspect planned acceptance: Isolation and cleanup are proven."
      observable: "allowed operations succeed and denied operations fail for the intended policy reason; helper startup or parser failure is not successful confinement evidence. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-2-2
      scenario_id: native-isolation-capability-evidence
      method: inspection
      intent: "Inspect planned acceptance: Required capability is unavailable."
      observable: "the runtime rejects analyzer launch and reports incomplete evidence under the released status/exit contract without weakening isolation. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-2-3
      scenario_id: native-isolation-capability-evidence
      method: inspection
      intent: "Inspect planned acceptance: Cancellation and descendants are bounded."
      observable: "under the managed revision, the kernel denies worker-created descendants and all broker-managed workers terminate within five seconds; each lifecycle race requires 100 repetitions with independent survivor and resource checks rather than killpg alone. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-2-4
      scenario_id: native-isolation-capability-evidence
      method: inspection
      intent: "Inspect planned acceptance: Startup cannot bypass confinement."
      observable: "untrusted code cannot execute before the required boundary is active or use inherited access to bypass it; allowed Apple system libraries are explicitly distinguished from prohibited ambient dependencies. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-2-5
      scenario_id: native-isolation-capability-evidence
      method: inspection
      intent: "Inspect planned acceptance: Native XPC boundary candidate must prove descendant cleanup."
      observable: "Historical XPC evidence is retained: the no-admin ARM64 harness rejected surviving descendants and does not approve a release. The approved managed-process revision supersedes unrestricted subprocess compatibility; current acceptance is mapped in 460-9-1 through 460-10-2."
  openspec:code-review-native-platform-execution:review-native-platform-execution:portable-review-semantics:
    rationale: Define macOS ARM64 acceptance without claiming unexecuted runtime proof.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#460
    touchpoints:
    - id: openspec-source-spec
      kind: config_file
      locator: openspec/changes/code-review-native-platform-execution/specs/review-native-platform-execution/spec.md
    verification_cases:
    - case_id: 460-3-8
      scenario_id: portable-review-semantics
      method: test
      intent: Invalid or empty-attribution requests do not trigger unnecessary ownership scans.
      observable: Planner/launcher guards prove malformed JSON/selectors are rejected before ownership I/O; preparation errors clear stale observations. Empty Python attribution inputs produce the identical empty bridge without metadata reads. Valid mappings retain full ownership, byte identity and target checks; all budgets remain unchanged.
    - case_id: 460-3-7
      scenario_id: portable-review-semantics
      method: test
      intent: Hosted transport and cp311 bootstrap preparation preserve strict input validation.
      observable: Executed artifact restore recipe passes actual immutable Git file validation without byte changes; unexpected executables remain rejected. Fresh cp311 preparation removes bootstrap setuptools before unchanged hash-pinned installation and lock admission.
    - case_id: 460-3-6
      scenario_id: portable-review-semantics
      method: test
      intent: Failed hosted reviews expose bounded profiling without granting acceptance.
      observable: Diagnostic summary tests reject malformed, oversized and substituted fields; only static tracked public symbols and sample counts survive. Workflow checks retain the required 300-second failure and a shorter independently stopped diagnostic replay; no raw profile is uploaded.
    - case_id: 460-3-5
      scenario_id: portable-review-semantics
      method: test
      intent: Synthetic enforcement tests do not borrow the real checkout as an identity fixture.
      observable: A fail-on-real-Git-inventory fixture guard preserves all five enforcement/readback assertions against a minimal standalone source; actual identity security tests remain unchanged. Local timing is diagnostic, not hosted acceptance.
    - case_id: 460-3-4
      scenario_id: portable-review-semantics
      method: test
      intent: "Pylint fatal diagnostics remain incomplete analyzer evidence."
      observable: "Six failing-before/passing-after regressions preserve fatal F0001/F0002/F0010 diagnostics as tool_error findings even outside selected paths, retaining ordinary findings. No internal analyzer crash may satisfy complete-report acceptance. Three independent checker regressions additionally reject fatal/style misclassification and tool errors despite complete member rows; genuine project findings remain accepted."
    - case_id: 460-3-1
      scenario_id: portable-review-semantics
      method: inspection
      intent: "Inspect planned acceptance: Portable fixture classification."
      observable: "introduced, fixed and unchanged findings and authoritative status/exit results agree; skipped, empty or UNKNOWN required evidence cannot pass acceptance. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-3-2
      scenario_id: portable-review-semantics
      method: inspection
      intent: "Inspect planned acceptance: OS dependent project tests."
      observable: "reports preserve the actual platform and outcomes without forcing cross-platform equality or relabeling genuine failures. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-3-3
      scenario_id: portable-review-semantics
      method: inspection
      intent: "Inspect planned acceptance: Older protected consumer receives native evidence."
      observable: "it rejects unsupported evidence explicitly rather than interpreting it as historical Linux or protected PR assurance. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
