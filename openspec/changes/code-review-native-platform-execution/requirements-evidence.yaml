    touchpoints:
    - id: openspec-source-spec
      kind: config_file
      locator: openspec/changes/code-review-native-platform-execution/specs/review-native-platform-execution/spec.md
    verification_cases:
    - case_id: 460-7-1
      scenario_id: native-project-runtime-preparation
      method: inspection
      intent: "Inspect planned acceptance: Native extension and plugin execute."
      observable: "Mach-O slices, dylib dependencies, relocatable paths and load origins are checked and actual collection/execution succeeds without changing project pins. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-7-2
      scenario_id: native-project-runtime-preparation
      method: inspection
      intent: "Inspect planned acceptance: Preparation hook attempts host access."
      observable: "the attempt is denied; acquisition credentials and host state are not exposed to project execution, and analysis remains network-denied. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-7-3
      scenario_id: native-project-runtime-preparation
      method: inspection
      intent: "Inspect planned acceptance: Project runtime is incompatible."
      observable: "it reports the root incompatibility honestly, preserves independent static evidence where supported, and never converts incomplete required evidence to PASS. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
  openspec:code-review-native-platform-execution:review-native-platform-execution:signed-customer-release-acceptance:
    rationale: Define macOS ARM64 acceptance without claiming unexecuted runtime proof.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#460
    touchpoints:
    - id: openspec-source-spec
      kind: config_file
      locator: openspec/changes/code-review-native-platform-execution/specs/review-native-platform-execution/spec.md
    verification_cases:
    - case_id: 460-8-1
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Customer installs the published capsule."
      observable: "all required analyzers and real tests execute with expected exits; cold acquisition and offline warm reuse pass on the supported matrix. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-8-2
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Customer filesystem differs."
      observable: "paths cannot escape declared boundaries, valid layouts work and unsupported layouts produce actionable diagnostics without source mutation. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-8-3
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Apple distribution and loading controls apply."
      observable: "applicable signing/notarization/quarantine checks and the approved library-loading policy pass without disabling host protections; final payload hashes match the shipped signed manifest. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-8-4
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Linux regression and rollback."
      observable: "Linux remains supported with historical identities intact; a faulty macOS publication can be withdrawn or superseded without disabling Linux or deleting evidence. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-8-5
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Local Docker assembly preserves native identity."
      observable: "COPY-only candidate assembly retains darwin/arm64 and exact payload digests without claiming native execution or production eligibility. Planned maturity only; local experiments do not establish release acceptance."
    - case_id: 460-8-6
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Candidate cannot be promoted without native proof."
      observable: "Missing lifecycle, dependency, signing or installation proof blocks production promotion despite green packaging checks. Planned maturity only; publication remains gated."
    - case_id: 460-8-7
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Candidate outer archive contains unchecked entries."
      observable: "Unreferenced files, blobs and unexpected directories are rejected even if the referenced graph matches. Planned maturity only; local verifier tests do not establish native release acceptance."
    - case_id: 460-8-8
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Candidate TAR framing is malformed."
      observable: "Malformed framing and unsupported extension headers fail closed through API and CLI. Planned maturity only; local parser evidence does not establish release acceptance."
    - case_id: 460-8-9
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Candidate metadata includes non-JSON constants."
      observable: "Non-JSON numeric constants fail closed even in unused fields. Planned maturity only; local parser evidence does not establish release acceptance."
    - case_id: 460-8-10
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Candidate metadata encoding or raw paths are noncanonical."
      observable: "Non-UTF-8 metadata and noncanonical raw directory paths fail closed before normalization. Planned maturity only; parser checks do not establish native release acceptance."
    - case_id: 460-8-11
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Candidate gzip framing is malformed."
      observable: "Strict single-member gzip framing rejects invalid flags, header CRC, truncation and trailing streams without weakening decompression bounds. Planned maturity only; this is not release acceptance."
    - case_id: 460-8-12
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Candidate TAR format identifier is unsupported."
      observable: "Unknown magic/version combinations fail closed despite valid checksums. Planned maturity only; local format validation does not establish release acceptance."
    - case_id: 460-8-13
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Candidate image configuration violates known field schemas."
      observable: "Known configuration fields and formats are validated against a pinned local OCI schema without remote resolution. Planned maturity only; schema validation does not establish release acceptance."
    - case_id: 460-8-14
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Candidate index manifest or descriptor violates known field schemas."
      observable: "Malformed known fields in index, manifest and descriptors fail pinned offline schema validation. Planned maturity only; this does not establish native release acceptance."
    - case_id: 460-8-15
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Candidate introduces unsupported alternative content references."
      observable: "Embedded descriptor data and index/manifest subjects are rejected explicitly by the fixed three-blob profile. Planned maturity only; this does not establish release acceptance."
    - case_id: 460-8-16
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Candidate index declares a contradictory media type."
      observable: "Index mediaType, when present, must identify an OCI index. Planned maturity only; this does not establish release acceptance."
    - case_id: 460-8-17
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Candidate map keys bypass value validation."
      observable: "Unmatched map keys are rejected across annotations and configuration maps. Planned maturity only; this does not establish release acceptance."
    - case_id: 460-8-18
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Expected payload contains hard-link aliases."
      observable: "Expected regular files require a single link before reading; aliases are rejected without claiming TOCTOU sealing. Planned maturity only; this does not establish release acceptance."
    - case_id: 460-8-19
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Candidate numeric TAR fields contain hidden garbage."
      observable: "Raw numeric fields require unsigned octal text and valid padding; hidden garbage and numeric extensions are rejected. Planned maturity only; this is not release acceptance."
    - case_id: 460-8-20
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Candidate numeric fields omit digits or history disagrees with layers."
      observable: "Required numeric fields contain digits and present history matches layer cardinality. Planned maturity only; this is not release acceptance."
    - case_id: 460-8-21
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Candidate TAR header padding contains hidden bytes."
      observable: "Raw ordinary TAR header tail padding is zero. Planned maturity only; this is not release acceptance."
    - case_id: 460-8-22
      scenario_id: signed-customer-release-acceptance
      method: inspection
      intent: "Inspect planned acceptance: Candidate TAR ancillary text fields hide bytes."
      observable: "All raw textual TAR fields require strict UTF-8 and zero post-terminator padding. Planned maturity only; this is not release acceptance."
