      observable: "it stops at the feasibility gate while planning and bounded feasibility work may proceed. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-5-2
      scenario_id: released-baseline-implementation-gate
      method: inspection
      intent: "Inspect planned acceptance: C15 remains unreleased."
      observable: "open C15 issues alone do not block delivery and native work does not implement or claim C15 semantics. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-5-3
      scenario_id: released-baseline-implementation-gate
      method: inspection
      intent: "Inspect planned acceptance: Baseline drives the full lifecycle."
      observable: "focused failing-first tests precede code, current native and Linux regression results verify the candidate, and signed published installation is read back. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
  openspec:code-review-native-platform-execution:review-native-platform-execution:dependency-source-admission:
    rationale: Define macOS ARM64 acceptance without claiming unexecuted runtime proof.
