    - id: openspec-source-spec
      kind: config_file
      locator: openspec/changes/code-review-native-platform-execution/specs/review-native-platform-execution/spec.md
    verification_cases:
    - case_id: 460-4-1
      scenario_id: verified-provisioning-and-offline-reuse
      method: inspection
      intent: "Inspect planned acceptance: Cached native runtime."
      observable: "it revalidates the payload and uses only the bound runtime while recording its identity. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-4-2
      scenario_id: verified-provisioning-and-offline-reuse
      method: inspection
      intent: "Inspect planned acceptance: Invalid native artifact."
      observable: "execution fails before untrusted analyzer or project code runs. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-4-3
      scenario_id: verified-provisioning-and-offline-reuse
      method: inspection
      intent: "Inspect planned acceptance: Module-shipped native artifact changes."
      observable: "verification fails without narrowing the full-module boundary to Python files. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-4-4
      scenario_id: verified-provisioning-and-offline-reuse
      method: inspection
      intent: "Inspect planned acceptance: External cache has no approved binding."
      observable: "it is rejected even if the module signature itself verifies. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-4-5
      scenario_id: verified-provisioning-and-offline-reuse
      method: inspection
      intent: "Inspect planned acceptance: Stale external cache identity."
      observable: "the stale identity is rejected before admission or execution. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-4-6
      scenario_id: verified-provisioning-and-offline-reuse
      method: inspection
      intent: "Inspect planned acceptance: Partial external runtime cache."
      observable: "partial output never becomes reusable; publication is atomic and concurrent preparations cannot mix payloads. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-4-7
      scenario_id: verified-provisioning-and-offline-reuse
      method: inspection
      intent: "Inspect planned acceptance: Mixed external runtime cache."
      observable: "the mixed closure is rejected despite individual valid file hashes. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
    - case_id: 460-4-8
      scenario_id: verified-provisioning-and-offline-reuse
      method: inspection
      intent: "Inspect planned acceptance: Verification to launch substitution."
      observable: "the replacement cannot execute and the runtime reports integrity failure; the approved design records how this is enforced on macOS. Planned maturity only; future native execution evidence is required by FEASIBILITY.md and tasks.md; no runtime pass is claimed."
