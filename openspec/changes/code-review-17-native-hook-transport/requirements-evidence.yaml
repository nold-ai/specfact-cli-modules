schema_version: '2'
requirements:
  openspec:code-review-17-native-hook-transport:native-hook-transport:validate-the-exact-staged-snapshot-before-running-unchanged-hooks:
    rationale: A native Linux result must describe exactly the allowlisted local staged tree.
    stakeholder_refs:
      - nold-ai/specfact-cli-modules#473
    touchpoints:
      - id: transport-validator
        kind: config_file
        locator: scripts/native_hook_transport.py
    verification_cases:
      - case_id: 473-hook-1
        scenario_id: validate-the-exact-staged-snapshot-before-running-unchanged-hooks
        method: test
        intent: Apply a genuine Git patch and compare its immutable staged tree.
        observable: test_exact_tree_is_applied and test_request_round_trip assert the actual index identity.
      - case_id: 473-hook-2
        scenario_id: validate-the-exact-staged-snapshot-before-running-unchanged-hooks
        method: test
        intent: Reject mismatched identities, controls, escaping paths, oversized content and nonregular modes.
        observable: Focused identity, path, size, mode and dirty-checkout tests reject the request before hook execution.
      - case_id: 473-hook-7
        scenario_id: validate-the-exact-staged-snapshot-before-running-unchanged-hooks
        method: test
        intent: Permit only the exact reviewed analyzer pin replacements, Node and published core dependency insertions and native-tools metadata insertion in pyproject.toml.
        observable: A real Git patch with just those replacements passes; one extra byte change fails before hooks.
      - case_id: 473-hook-16
        scenario_id: validate-the-exact-staged-snapshot-before-running-unchanged-hooks
        method: test
        intent: Carry larger reviewed patches only from the fixed signed control checkout while preserving exact identities and resource bounds.
        observable: Real Git large-patch and legacy receipts pass; mixed selectors, nonregular files, encoded/decoded/expanded limits, noncanonical base64 and corrupt identity fail before application; the fixed data remains UTF-8-safe under the unchanged staged text diff.
  openspec:code-review-17-native-hook-transport:native-hook-transport:preserve-real-execution-authority-and-hook-outcome:
    rationale: Developer evidence cannot silently become publisher authority or a successful result after hook failure.
    stakeholder_refs:
      - nold-ai/specfact-cli-modules#473
    touchpoints:
      - id: native-workflow
        kind: config_file
        locator: .github/workflows/capsule-customer-execution.yml
    verification_cases:
      - case_id: 473-hook-3
        scenario_id: preserve-real-execution-authority-and-hook-outcome
        method: test
        intent: Execute a real child, preserve its exit and reject hook source mutation.
        observable: Child fixture exits are propagated, credentials and publisher variables are absent, tracked and non-ignored untracked mutations fail.
      - case_id: 473-hook-4
        scenario_id: preserve-real-execution-authority-and-hook-outcome
        method: test
        intent: Retain the normal customer corpus when no transport request is supplied.
        observable: test_default_customer_workflow_is_preserved asserts opt-in selection, read-only permissions and timeout.
      - case_id: 473-hook-5
        scenario_id: preserve-real-execution-authority-and-hook-outcome
        method: test
        intent: Use genuine Hatch activation and retain decorated CLI output with one typed runtime descriptor.
        observable: Native Hatch invocation and raw output are asserted; incomplete or ambiguous JSON objects are rejected before hooks.
      - case_id: 473-hook-6
        scenario_id: preserve-real-execution-authority-and-hook-outcome
        method: test
        intent: Bind runtime preparation to the same reviewed workspace modules selected by unchanged hooks.
        observable: Only repository-owned bundle source roots reach preparation; inherited overlays and credentials are absent.
      - case_id: 473-hook-8
        scenario_id: preserve-real-execution-authority-and-hook-outcome
        method: test
        intent: Capture the actual hook interpreter package inventory after preparation has synchronized the environment.
        observable: The fresh pre-hook inventory command and digest are retained separately from initial installation evidence.
      - case_id: 473-hook-10
        scenario_id: preserve-real-execution-authority-and-hook-outcome
        method: test
        intent: Retain a separate official sealed Semgrep replay without accepting failed review evidence.
        observable: test_native_semgrep_diagnostic verifies raw error retention, source hashes, offline isolation, missing-rule/preflight/publisher-context refusal and unchanged original report.
      - case_id: 473-hook-11
        scenario_id: preserve-real-execution-authority-and-hook-outcome
        method: test
        intent: Keep failed hook status authoritative regardless of separate diagnostic success or failure.
        observable: Real child cases preserve hook exit seven when replay exits zero or nine, and never replay successful hooks.
      - case_id: 473-hook-12
        scenario_id: preserve-real-execution-authority-and-hook-outcome
        method: test
        intent: Replay incomplete basedpyright only with the exact review-bound runtime and unchanged signed target worker.
        observable: test_native_basedpyright_diagnostic checks four identity bindings, offline-only cache use, mismatch refusal, exact portable argv, nested worker dispatch, raw outputs and exits, and default-off workflow selection.
      - case_id: 473-hook-13
        scenario_id: preserve-real-execution-authority-and-hook-outcome
        method: test
        intent: Preserve genuine manager activation and hook failure during opt-in replay.
        observable: A real detached Hatch environment with a competing hatch-test environment supplies default activation and excludes credentials; diagnostic exit seven leaves original hook exit twenty-three unchanged.
      - case_id: 473-hook-15
        scenario_id: preserve-real-execution-authority-and-hook-outcome
        method: test
        intent: Reconstruct the same private immutable index root before offline cache lookup.
        observable: test_replay_preserves_real_cached_snapshot_identity uses a real Git index and controller materializer; replay must preserve production source and project identities including root permissions.
      - case_id: 473-hook-18
        scenario_id: preserve-real-execution-authority-and-hook-outcome
        method: test
        intent: Diagnose a timed-out unchanged hook without changing its limits, targets or authority.
        observable: Actual child stream and timeout tests preserve bounded raw prefixes with full counts and hashes; opt-in replay retains original exit and genuine credential-free Hatch activation.
      - case_id: 473-hook-19
        scenario_id: preserve-real-execution-authority-and-hook-outcome
        method: test
        intent: Measure exact cached snapshot preparation separately from the total warm review while preserving source identities.
        observable: Timing replay records source and runtime identities, exact offline miss behavior and source mutation refusal, labels every artifact diagnostic-only, and kills only its owned process groups on timeout.
