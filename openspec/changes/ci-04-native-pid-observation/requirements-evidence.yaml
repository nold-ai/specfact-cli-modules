  openspec:ci-04-native-pid-observation:native-pid-observation:creation-does-not-imply-publication:
    rationale: Both active readers SHALL await complete publication when a real marker
      is empty or contains only an incomplete ASCII numeric prefix.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#520
    touchpoints:
    - id: pid-readers
      kind: source
      locator: tests/native/proof_macos_native_broker_wait.py
    verification_cases:
    - case_id: CI-04-2-1
      scenario_id: creation-does-not-imply-publication
      method: test
      selector:
        runner: pytest
        node_id: tests/unit/native_release/test_boundary.py::test_pid_observation_waits_for_publication[controller-empty]
      intent: the producer exclusively creates its real marker and publishes the remaining
        actual PID bytes and newline after the first pending poll
      observable: both consumers observe the complete actual PID and never prematurely
        parse the empty or partial record
      implementation_task: '2.1'
    - case_id: CI-04-2-2
