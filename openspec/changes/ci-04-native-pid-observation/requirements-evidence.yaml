  openspec:ci-04-native-pid-observation:native-pid-observation:pending-publication-uses-one-five-second-deadline:
    rationale: Absent, empty and newline-free numeric markers SHALL remain pending
      under one fixed five-second monotonic deadline, with positive sleeps at most
      10 ms capped by remaining time.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#520
    touchpoints:
    - id: pid-readers
      kind: source
      locator: tests/native/proof_macos_native_broker_wait.py
    verification_cases:
    - case_id: CI-04-3-1
      scenario_id: pending-publication-uses-one-five-second-deadline
      method: test
      selector:
        runner: pytest
        node_id: tests/unit/native_release/test_boundary.py::test_pid_observation_pending_times_out[controller-absent]
      intent: publication remains absent, empty or incomplete
      observable: both consumers raise AssertionError by the same deadline without
        PID output or WAIT
      implementation_task: '2.1'
    - case_id: CI-04-3-2
