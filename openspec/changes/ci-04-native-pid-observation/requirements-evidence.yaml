schema_version: '2'
requirements:
  openspec:ci-04-native-pid-observation:native-pid-observation:complete-positive-records-remain-observable:
    rationale: A complete positive ASCII decimal PID plus one final newline, at most
      31 bytes total, SHALL be accepted without a pending-publication sleep.
    stakeholder_refs:
    - nold-ai/specfact-cli-modules#520
    touchpoints:
    - id: pid-readers
      kind: source
      locator: tests/native/proof_macos_native_broker_wait.py
    verification_cases:
    - case_id: CI-04-1-1
      scenario_id: complete-positive-records-remain-observable
      method: test
      selector:
        runner: pytest
        node_id: tests/unit/native_release/test_boundary.py::test_pid_observation_accepts_complete_record[controller-31-bytes]
      intent: an immediately complete valid marker is read
      observable: both existing consumers observe its integer value, and the controller
        retains exact JSON, WAIT payload and WAIT_SENT
      implementation_task: '2.1'
    - case_id: CI-04-1-2
      scenario_id: complete-positive-records-remain-observable
      method: test
      selector:
        runner: pytest
        node_id: tests/unit/native_release/test_boundary.py::test_pid_observation_accepts_complete_record[controller-leading-zero]
      intent: an immediately complete valid marker is read
      observable: both existing consumers observe its integer value, and the controller
        retains exact JSON, WAIT payload and WAIT_SENT
      implementation_task: '2.1'
    - case_id: CI-04-1-3
