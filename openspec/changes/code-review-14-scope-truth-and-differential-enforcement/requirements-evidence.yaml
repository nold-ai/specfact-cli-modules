        intent: "Preserve diagnostics required by basedpyright path-scoped strict policy."
        observable: "A basic-mode policy with strict=[a.py] that reports unknown-member diagnostics yields basedpyright_strict_projection_unsupported UNKNOWN before projection; the verifier never clears non-empty target strict, and global settings remain unchanged."
      - case_id: CR14-077
        scenario_id: mandatory-analyzer-coverage
