  openspec:code-review-14-scope-truth-and-differential-enforcement:review-run-command:mandatory-analyzer-coverage:
    rationale: "A review cannot claim assurance when a mandatory analyzer did not produce trustworthy evidence."
    stakeholder_refs:
      - "nold-ai/specfact-cli#671"
    touchpoints:
      - id: review-analyzer-coverage
        kind: planned_schema
        locator: "ReviewReport.analyzer_coverage"
    verification_cases:
      - case_id: CR14-006
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Record each analyzer identity and outcome and fail closed when mandatory coverage is unavailable."
        observable: "Skipped, failed, timed-out, or unparsable mandatory analyzer evidence yields UNKNOWN without an all-passed summary."
      - case_id: CR14-015
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Freeze the pr-range-v1 analyzer membership and required/conditional statuses."
        observable: "Eight analyzers are always required; semgrep-bugs is required when governed config exists and otherwise NOT_APPLICABLE; no member is silently optional."
      - case_id: CR14-017
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Surface required contract/CrossHair timeout as failed analyzer coverage."
        observable: "A swallowed timeout cannot become an empty successful contracts run; strict assurance is UNKNOWN."
      - case_id: CR14-026
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Surface a documented CrossHair tool/process-error exit without parsed findings as failed analyzer coverage."
        observable: "Exit code 2 retains exit/stderr diagnostics and yields UNKNOWN, while parsed counterexamples remain findings."
      - case_id: CR14-038
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Keep mandatory Semgrep coverage usable when a consumer repository does not vendor the module clean-code policy."
        observable: "Both snapshots receive the same explicit clean-code payload from the exact signed installed module artifact with package and payload digests; source/worktree discovery is disabled, semgrep-bugs remains conditional on target policy, and missing or invalid fallback evidence yields UNKNOWN."
      - case_id: CR14-058
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Provision the exact configuration-loader and analyzer versions claimed by pr-range-v1."
        observable: "The signed analyzer-environment lock—not module-package host pip_dependencies—binds an immutable OCI base/root schema plus checkpoint-matching exact analyzer entries, directly includes pytest 9.0.3 and Coverage 7.15.4, and any capsule version/root digest mismatch makes profile activation UNKNOWN."
      - case_id: CR14-060
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Make analyzer runtime and Python distribution identity stable across controller storage roots."
        observable: "OCI/final-root/interpreter/stdlib/extension/loader/library/bootstrap plus wheel/RECORD payload and normalized entry-point identities match across capsule materialization roots; outside-root and generated-wrapper bytes are excluded, while runtime/payload/entry-point drift is UNKNOWN."
      - case_id: CR14-065
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Close and sign the complete analyzer runtime dependency graph and provision it during implementation."
        observable: "For each supported Linux/CPython environment, the signed lock closes OCI base layers, the final runtime-root manifest, and every direct/transitive analyzer package, marker, edge, payload and digest while module-package pip_dependencies excludes the analyzer closure; host conflicts cannot preempt capsule provisioning, and missing/extra/bare/host-leaked/drift evidence is UNKNOWN."
      - case_id: CR14-093
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Bind the generated signed analyzer lock exactly to the frozen pre-implementation checkpoint."
        observable: "The checkpoint stores the complete canonical logical lock projection and SHA-256; regeneration compares every field/byte/digest, mismatch invalidates activation/signing, and TDD evidence records the result."
      - case_id: CR14-085
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Make fresh and offline OCI capsule acquisition resolvable, immutable, and fail closed."
        observable: "The signed lock supplies one HTTPS registry/repository@manifest locator plus config/layer identities and a complete fixed wheelhouse manifest; a verified digest-keyed cache supports offline use, while a genuine fresh miss fetches only that artifact through per-hop HTTPS+allowlist authorization with no credential forwarding before authorization, binds the full redirect/final-URL chain, and installs every selected lock member offline with indexes disabled. Missing/extra/incompatible wheels, mutable/missing locators, partial cache, acquisition/digest/media/size/redirect/downgrade/credential failures are UNKNOWN without another source or host fallback."
      - case_id: CR14-094
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Prevent OCI redirects from downgrading transport or forwarding controller credentials to an unauthorized target."
        observable: "Every redirect target is HTTPS and signed-allowlisted before credentials are attached; credentials are stripped/re-authorized per hop, the complete ordered chain/final URL is evidence, and downgrade or unauthorized forwarding is UNKNOWN."
      - case_id: CR14-061
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Keep targeted coverage code identical by rejecting repository-loaded plugins."
        observable: "Every configured Coverage plugin is UNKNOWN under the initial empty signed manifest before launch; repository plugin code is never imported or statically inferred."
      - case_id: CR14-064
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Keep Coverage data and report writes out of immutable snapshots and config mounts."
        observable: "Every pinned-schema writable field, including relative data_file, is projected into a role-specific process-private output path with bound transformation evidence; escape, collision, or drift is UNKNOWN."
      - case_id: CR14-066
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Reconcile targeted coverage against every runtime-measurable governed production input present in each immutable snapshot."
        observable: "Under runtime-measurable-production-v1, the normalized Coverage manifest contains each tracked regular governed production .py path exactly once before threshold evaluation; target-policy exclusion, missing/duplicate/aliased/escaping/identity-mismatched runtime paths are UNKNOWN even when tests and the reported threshold pass, while governed .pyi stubs remain in a separate static-only manifest."
      - case_id: CR14-068
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Prevent authorized target Coverage regexes from suppressing candidate statements or branches."
        observable: "Non-empty exclusion/partial-branch fields are UNKNOWN before launch; absent/empty fields produce a bound projection clearing pinned defaults/additions, so matching marker text cannot create a false threshold fix."
      - case_id: CR14-069
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Keep every pytest cache/log/temp/JUnit write out of immutable snapshots and config mounts."
        observable: "Pinned pytest config/addopts paths have closed read/write roles; writable destinations are rebound to deterministic process-private roots with controller-owned JUnit precedence, and unclassified/escaping/colliding/ineffective output projection is UNKNOWN."
      - case_id: CR14-073
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Prevent Ruff cache initialization from writing into immutable snapshots or turning ordinary execution into UNKNOWN."
        observable: "Pinned --no-cache is effective, cache_mode=disabled is bound, no snapshot/config-root write occurs, and flag/catalog/write drift is UNKNOWN."
      - case_id: CR14-074
        scenario_id: mandatory-analyzer-coverage
