        observable: "The baseline non-passing result remains per-snapshot FAIL evidence, the exact head pass classifies the pair as fixed and non-blocking, and uncertainty on either side remains UNKNOWN."
      - case_id: CR14-023
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Distinguish a structurally absent merge-base input/selector from an attempted empty pytest run."
        observable: "Only a merge-base with no governed production/test/test-support input records manifest-bound NOT_APPLICABLE; otherwise its complete recognized suite runs. Head always requires complete collection/coverage and missing tests remain UNKNOWN."
      - case_id: CR14-024
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Represent structurally empty per-snapshot analyzer input truthfully for add-only and delete-only ranges."
        observable: "The empty side is manifest-bound NOT_APPLICABLE, the non-empty side still runs, unrecorded adapter early return is rejected, and aggregate range assurance remains applicable."
      - case_id: CR14-115
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Eliminate unsound source-to-test inference from strict range assurance."
        observable: "complete-pytest-suite-v1 collects and runs every selector recognized by the sealed policy on both snapshots, including multiple and nonconventionally named tests; no production-name/import/coverage heuristic or candidate impact map can omit tests, and removed or uncollected changed tests are UNKNOWN."
      - case_id: CR14-119
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Prevent collection outcomes from reclassifying changed tests as support."
        observable: "pytest-input-role-v1 binds roles before collection from immutable paths and the shared authorized testpaths/root-default plus python_files policy; an emptied, __test__-disabled, moved, or support-renamed previously collected test remains an uncollected test candidate and yields UNKNOWN, while only preclassified support may omit selectors."
      - case_id: CR14-120
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Match path-bearing python_files patterns exactly as pinned pytest does."
        observable: "pytest-input-role-v1 reproduces pytest 9.0.3 fnmatch_ex on the same absolute materialized Path: separator-free patterns match basename, path-bearing relative patterns match the full path with */ prefixing, and an empty tests/unit/test_new.py under python_files=tests/unit/test_*.py remains an uncollected test candidate and yields UNKNOWN."
      - case_id: CR14-121
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Prevent authorized pytest addopts from filtering the complete suite."
        observable: "pytest-selection-controls-disabled-v1 parses the complete composed pytest/pytest-cov/admitted-plugin option catalog and makes positional selectors, -k/-m, ignore/deselect/cache selectors, short-circuits, discovery/plugin overrides, and coverage overrides UNKNOWN before collection; a production change with an ignored failing test cannot pass, while declarative suite identity and non-selecting options remain bound."
      - case_id: CR14-122
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Prevent effective pytest configuration fields from hiding whole test modules."
        observable: "The frozen pytest/pytest-cov addini catalog classifies non-empty norecursedirs and every other selection/discovery/plugin/coverage field as unsupported UNKNOWN; independently every test_candidate, changed or unchanged, must contribute a selector per side, so a production-only range with an ignored failing module cannot pass."
      - case_id: CR14-125
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Prevent a repository collection hook from hiding one changed test inside an otherwise collected file."
        observable: "The frozen hook-disposition catalog rejects collection-shaping conftest hooks before execution; plugin/hook origins, raw-collected items, and pre/post registry digests are bound, so selective deselection is UNKNOWN rather than PASS."
      - case_id: CR14-127
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Prevent pytest's built-in __test__ control from hiding one changed test inside an otherwise collected file."
        observable: "The sealed non-mutating collectstart/makeitem observer records each pinned-name-matching module/class/function before built-in filtering and makes a false runtime __test__ value UNKNOWN even when a sibling selector passes; observer or outcome drift is UNKNOWN."
      - case_id: CR14-129
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Prevent pytest's built-in class-constructor controls from hiding one changed test inside an otherwise collected file."
        observable: "Before Class.collect can return empty, the sealed collectstart observer records pinned hasinit/hasnew inputs and decisions; custom __init__ or __new__ on a name-matching class is UNKNOWN even when a sibling selector passes, while inherited defaults remain supported."
      - case_id: CR14-126
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Admit exact target-tip pytest fixture plugins without ambient loading or unclassified parser and collection behavior."
        observable: "The authenticated project-runtime descriptor binds plugin distribution, payload, dependency, pytest11 entry point, parser, and hook capabilities; a snapshot-free sandbox mounts only the analyzer capsule plus identical read-only project layer for exact entry-point preflight, and targeted pytest uses the same layer identity; a matching fixture-only plugin collects on both sides, while unlisted, snapshot/user, drifted, dynamic, or collection-shaping plugins are UNKNOWN."
      - case_id: CR14-116
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Keep Python stubs in static analysis without demanding impossible runtime coverage."
        observable: "A .pyi-only range records targeted-pytest-coverage as NOT_APPLICABLE with an empty runtime-measurable manifest while every applicable static analyzer still includes the stub; mixed .py/.pyi snapshots reconcile only .py coverage and bind the .pyi static-only manifest."
      - case_id: CR14-097
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Execute dependency-bearing project tests without trusting candidate locks or ambient host packages."
        observable: "A target-tip-attested project-runtime layer is reused for both snapshots, imports its exact dependency closure, rejects reserved analyzer/runner collisions and untrusted provenance, and makes missing/incomplete evidence UNKNOWN."
      - case_id: CR14-102
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Seal Bubblewrap's host-side runtime before it creates the analyzer namespace."
        observable: "The pinned launcher is a verified static Linux x86_64 ELF with no interpreter or needed libraries, executes from the verified descriptor with loader injection cleared, and exposes no unexpected pre-namespace mapped object; dynamic/host-dependent launch is UNKNOWN."
      - case_id: CR14-104
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Run mandatory built-in analyzers from signed code inside the sealed capsule."
        observable: "module-code-payload-v1 re-verifies the complete loader-registered signed specfact_code_review installation, copies every canonical payload member into the capsule, binds loader/origin/key/full-payload-verification/import/root identities, boots ai-bloat-ast and ast-clean-code without controller paths, and makes incomplete or drifted evidence UNKNOWN."
      - case_id: CR14-111
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Boot signed built-in analyzers after the marketplace discards the downloaded module archive."
        observable: "A fresh official installation deletes its archive and archive cache, then verified-installed-module-payload-v1 revalidates checksum/signature/key/origin and descriptor-safely copies the canonical installed payload into the capsule; no reacquisition or host import occurs, while failed installation evidence is UNKNOWN."
