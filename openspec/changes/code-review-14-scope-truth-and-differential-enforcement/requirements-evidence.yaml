        observable: "A multi-rule bundle with any rule-level paths.include/paths.exclude is UNKNOWN before launch even when another rule makes pass-level paths.scanned look complete; accepted bundles then require normalized scanned paths to equal the eligible manifest, retain skipped reasons, and fail UNKNOWN on size/missing/extra/reconciliation gaps."
      - case_id: CR14-078
