        observable: "Each generated flattened project binds original controls, sets include to the exact eligible snapshot-relative files, clears exclude and ignore, uses only explicit --project without positional sources, and preserves other authorized diagnostic settings; include/effective-control/catalog/manifest drift is UNKNOWN."
      - case_id: CR14-089
        scenario_id: mandatory-analyzer-coverage
