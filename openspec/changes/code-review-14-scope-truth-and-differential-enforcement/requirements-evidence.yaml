schema_version: "2"
requirements:
  openspec:code-review-14-scope-truth-and-differential-enforcement:review-run-command:explicit-review-scope-evidence:
    rationale: "A review verdict is meaningful only when the evaluated snapshot is known."
    stakeholder_refs:
      - "nold-ai/specfact-cli#665"
      - "nold-ai/specfact-cli#671"
    touchpoints:
      - id: review-scope-cli
        kind: planned_cli_command
        locator: "specfact code review run --scope"
    verification_cases:
      - case_id: CR14-001
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Resolve worktree, index, range, full, or explicit-file scope without ambiguity."
        observable: "Immutable scope evidence identifies the analyzed snapshot and files."
      - case_id: CR14-007
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Materialize base/head inputs from resolved commit trees and reject mutation-capable range options."
        observable: "Caller-worktree mutation cannot affect range results; manifest mismatch yields UNKNOWN."
      - case_id: CR14-009
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Analyze materialized staged blobs even when the same path has later unstaged edits."
        observable: "Only index tree/blob/content identities affect index findings, score, and status."
      - case_id: CR14-018
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Reserve pull-request range assurance for the complete governed Python selection."
        observable: "Range rejects exclude-tests, every focus facet, path, no-tests, and level filters before analysis; narrowed runs cannot emit assurance_kind=pr_range or false NOT_APPLICABLE."
      - case_id: CR14-027
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Bind the producer and consumer to the independently authenticated expected PR target tip."
        observable: "Resolved base-tip commit/tree must match trusted repository/ref/PR-or-queue context; mismatch or caller self-assertion is UNKNOWN and cannot satisfy pr_range."
  openspec:code-review-14-scope-truth-and-differential-enforcement:review-run-command:differential-base-head-enforcement:
    rationale: "Introduced findings require symmetric base/head evidence, not changed-line coincidence."
    stakeholder_refs:
      - "nold-ai/specfact-cli#671"
    touchpoints:
      - id: review-differential-runner
        kind: planned_component
        locator: "specfact-code-review differential runner"
    verification_cases:
      - case_id: CR14-002
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Classify introduced, fixed, unchanged, and unknown findings only under identical immutable analyzer/toolchain/policy/config identities."
        observable: "Introduced blockers block even away from added lines; baseline failures or analyzer-identity mismatch remain unknown."
      - case_id: CR14-010
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Use the resolved merge-base rather than an advanced base-ref tip as the differential baseline."
        observable: "Target-only post-divergence findings are not misclassified as feature-branch changes."
      - case_id: CR14-012
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Normalize stable file anchors through resolved one-to-one renames before base/head fingerprint comparison."
        observable: "A pure file rename retains the blocker as unchanged while both paths and the rename fact remain evidence."
      - case_id: CR14-019
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Inject one sealed authorized target-base-tip configuration bundle into both source-snapshot analyzer runs."
        observable: "Head config cannot suppress its own finding; Ruff/Pylint/basedpyright/Semgrep never fall back to source/worktree/dot discovery; injection failure is UNKNOWN."
      - case_id: CR14-022
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Apply policy already promoted at the authorized target tip without replacing the merge-base source baseline."
        observable: "Both source snapshots use the frozen target-tip policy; moved, untrusted, missing, or unusable target policy yields UNKNOWN."
      - case_id: CR14-028
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Project target-policy basedpyright paths independently onto each immutable source snapshot."
        observable: "Shared policy/toolchain/projection identities match while side-specific projected digests may differ only by recorded root bindings; relative imports stay inside the corresponding snapshot; true shared-identity drift or unsafe paths yield UNKNOWN."
      - case_id: CR14-029
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Bind every import-capable analyzer subprocess to the active materialized snapshot."
        observable: "Pylint, CrossHair, and targeted pytest use snapshot cwd/import roots, sealed toolchain, sanitized environment, pinned plugins, and never resolve caller/head source during baseline analysis."
  openspec:code-review-14-scope-truth-and-differential-enforcement:review-finding-model:independent-finding-lifecycle-and-remediation:
    rationale: "Severity, resolution, autofix availability, and policy are distinct facts."
    stakeholder_refs:
      - "nold-ai/specfact-cli#671"
    touchpoints:
      - id: review-finding-schema
        kind: planned_schema
        locator: "ReviewFinding"
    verification_cases:
      - case_id: CR14-003
        scenario_id: independent-finding-lifecycle-and-remediation
        method: test
        intent: "Keep open fixable errors blocking until actually fixed or waived."
        observable: "Separate fields and deterministic policy derivation."
  openspec:code-review-14-scope-truth-and-differential-enforcement:review-cli-contracts:truthful-review-assurance-status:
    rationale: "Unknown and not-applicable are not green passes."
    stakeholder_refs:
      - "nold-ai/specfact-cli#665"
    touchpoints:
      - id: review-report-status
        kind: planned_schema
        locator: "ReviewReport"
    verification_cases:
      - case_id: CR14-004
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Expose PASS, FAIL, UNKNOWN, and NOT_APPLICABLE with analyzer coverage."
        observable: "No all-passed summary when mandatory evidence is skipped or unknown."
      - case_id: CR14-008
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Dual-write schema 1.6 assurance into the closed legacy verdict, normalized enforcement-mode, and exit-code projection."
        observable: "UNKNOWN is never green; old reports cannot imply UNKNOWN/NOT_APPLICABLE; malformed 1.6 reports cannot pass."
      - case_id: CR14-030
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Publish one signed machine-readable compatibility matrix before any core consumer adoption."
        observable: "Four canonical statuses bind legacy projections and strict/shadow exits; mismatches are invalid; explicit-files and pr-range consumers must pass the exact matrix digest."
      - case_id: CR14-013
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Preserve schema 1.6 truth through every post-analysis enrichment path."
        observable: "Cleanup forecast refresh retains schema, authoritative assurance, scope/analyzer evidence, legacy projection, and exit code unchanged."
      - case_id: CR14-025
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Attach validated Requirements context without downgrading the Code Review report schema."
        observable: "Requirements attachment preserves schema 1.6 assurance, scope/analyzer evidence, legacy projection, and exit code while adding only its context."
  openspec:code-review-14-scope-truth-and-differential-enforcement:review-cli-contracts:review-cli-contracts-cover-explicit-scope-and-differential-evidence:
    rationale: "The public CLI contract must prove every explicit scope and differential evidence path."
    stakeholder_refs:
      - "nold-ai/specfact-cli#665"
      - "nold-ai/specfact-cli#671"
    touchpoints:
      - id: review-cli-contract-fixtures
        kind: planned_component
        locator: "tests/cli-contracts/specfact-code-review-run.scenarios.yaml"
    verification_cases:
      - case_id: CR14-005
        scenario_id: review-cli-contracts-cover-explicit-scope-and-differential-evidence
        method: test
        intent: "Exercise static argv/report contracts for explicit scope sources, full-ref requirements, assurance/enforcement projection, positional-file PR downgrade rejection, and invalid combinations."
        observable: "Static CLI fixtures reject ambiguous inputs without claiming stateful Git topology or analyzer evidence."
      - case_id: CR14-014
        scenario_id: review-cli-contracts-cover-explicit-scope-and-differential-evidence
        method: test
        intent: "Make range defaults and generated AI instructions executable under the normalized enforcement contract."
        observable: "Omitted range enforcement becomes strict full; explicit range-plus-changed is rejected; instructions use range refs and explicit full enforcement."
      - case_id: CR14-016
        scenario_id: review-cli-contracts-cover-explicit-scope-and-differential-evidence
        method: test
        intent: "Migrate installed merge-quality guidance from changed/worktree scope to executable PR-range assurance."
        observable: "Rules updater and bundled skill emit range/base/head/full guidance while local simplification preview remains worktree-scoped."
      - case_id: CR14-021
        scenario_id: review-cli-contracts-cover-explicit-scope-and-differential-evidence
        method: test
        intent: "Keep canonical repository quality-gate, module/bundle, generated-instruction, and installed-skill guidance on the same assurance boundary."
        observable: "Merge guidance requires complete range/base/head/full; staged positional and simplification worktree commands are explicitly non-PR; generated skill copies match their bundled source."
  openspec:code-review-14-scope-truth-and-differential-enforcement:review-run-command:mandatory-analyzer-coverage:
    rationale: "A review cannot claim assurance when a mandatory analyzer did not produce trustworthy evidence."
    stakeholder_refs:
      - "nold-ai/specfact-cli#671"
    touchpoints:
      - id: review-analyzer-coverage
        kind: planned_schema
        locator: "ReviewReport.analyzer_coverage"
    verification_cases:
      - case_id: CR14-006
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Record each analyzer identity and outcome and fail closed when mandatory coverage is unavailable."
        observable: "Skipped, failed, timed-out, or unparsable mandatory analyzer evidence yields UNKNOWN without an all-passed summary."
      - case_id: CR14-015
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Freeze the pr-range-v1 analyzer membership and required/conditional statuses."
        observable: "Eight analyzers are always required; semgrep-bugs is required when governed config exists and otherwise NOT_APPLICABLE; no member is silently optional."
      - case_id: CR14-017
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Surface required contract/CrossHair timeout as failed analyzer coverage."
        observable: "A swallowed timeout cannot become an empty successful contracts run; strict assurance is UNKNOWN."
      - case_id: CR14-026
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Surface a documented CrossHair tool/process-error exit without parsed findings as failed analyzer coverage."
        observable: "Exit code 2 retains exit/stderr diagnostics and yields UNKNOWN, while parsed counterexamples remain findings."
      - case_id: CR14-020
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Represent targeted pytest/coverage as a conditional pr-range-v1 member with exact per-selector execution truth."
        observable: "Only exactly-once all-selected-passed head outcomes satisfy coverage; assertion/skip/xfail/xpass is FAIL; missing/duplicate/deselected/reconciliation/infrastructure/coverage failures are UNKNOWN."
      - case_id: CR14-031
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Prevent an exit-zero head run from neutralizing selected tests through skip/xfail/xpass or deselection."
        observable: "Selector/JUnit/count reconciliation overrides process success and readable coverage; non-passing selected outcomes cannot produce PASS."
      - case_id: CR14-023
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Distinguish a structurally absent merge-base input/selector from an attempted empty pytest run."
        observable: "A new-file range records manifest-bound merge-base-side NOT_APPLICABLE and still requires valid head collection/coverage; missing head tests remain UNKNOWN."
      - case_id: CR14-024
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Represent structurally empty per-snapshot analyzer input truthfully for add-only and delete-only ranges."
        observable: "The empty side is manifest-bound NOT_APPLICABLE, the non-empty side still runs, unrecorded adapter early return is rejected, and aggregate range assurance remains applicable."
  openspec:code-review-14-scope-truth-and-differential-enforcement:review-finding-model:ledger-preserves-authoritative-assurance-status:
    rationale: "A first-party consumer must not turn UNKNOWN or NOT_APPLICABLE compatibility projections into passing reward events."
    stakeholder_refs:
      - "nold-ai/specfact-cli#665"
      - "nold-ai/specfact-cli#671"
    touchpoints:
      - id: review-ledger-assurance
        kind: planned_component
        locator: "specfact-code-review ledger client"
    verification_cases:
      - case_id: CR14-011
        scenario_id: ledger-preserves-authoritative-assurance-status
        method: test
        intent: "Persist schema 1.6 assurance directly and keep UNKNOWN/NOT_APPLICABLE neutral for rewards and streaks."
        observable: "Neutral states persist canonical report_json/report_digest without coins, pass bonuses, block penalties, or streak changes; legacy records remain readable."

