        observable: "A renamed module matching target ignored-modules remains analyzed under the cleared pinned exemption catalog; every catalog entry has a retained/cleared/rejected disposition, and effective bypass or schema/help drift is UNKNOWN."
      - case_id: CR14-076
        scenario_id: mandatory-analyzer-coverage
        method: test
