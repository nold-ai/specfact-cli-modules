      observable: pytest TOML/INI variants plus native/legacy pyproject, tox.ini, and setup.cfg sections are manifested; selection
        follows the signed pytest 9.0.3 locator order, and ambiguity or loader-profile drift is UNKNOWN.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_scope.py::test_pytest_supported_config_sources_follow_pinned_precedence[files0-pytest.toml]
      implementation_task: 3.5c
