schema_version: "2"
requirements:
  openspec:code-review-14-scope-truth-and-differential-enforcement:review-run-command:explicit-review-scope-evidence:
    rationale: "A review verdict is meaningful only when the evaluated snapshot is known."
    stakeholder_refs:
      - "nold-ai/specfact-cli#665"
      - "nold-ai/specfact-cli#671"
    touchpoints:
      - id: review-scope-cli
        kind: planned_cli_command
        locator: "specfact code review run --scope"
    verification_cases:
      - case_id: CR14-001
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Resolve worktree, index, range, full, or explicit-file scope without ambiguity."
        observable: "Immutable scope evidence identifies the analyzed snapshot and files; only a successfully resolved unfiltered diff containing neither governed Python nor governed analyzer-policy input is NOT_APPLICABLE, and rejected narrowing cannot manufacture that state."
      - case_id: CR14-047
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Treat candidate analyzer-policy/config changes as governed impact without self-authorization."
        observable: "Closed policy paths/pyproject sections are selected and digested; a policy-only range is UNKNOWN under the target-tip policy, never NOT_APPLICABLE/PASS, until a separate trusted promotion contract exists."
      - case_id: CR14-048
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Avoid classifying unrelated shared-file metadata as review-policy impact."
        observable: "Only canonical analyzer, coverage, and pytest sections in pyproject/setup.cfg/tox.ini enter the governed policy digest; parse failure is UNKNOWN."
      - case_id: CR14-049
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Treat candidate pytest and coverage configuration as governed policy impact."
        observable: ".coveragerc/pytest.ini and the closed shared-file sections are selected/digested; policy-only changes are UNKNOWN rather than NOT_APPLICABLE/PASS."
      - case_id: CR14-051
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Govern every Pylint configuration source recognized by the pinned loader."
        observable: "pylintrc legacy/TOML variants and Pylint sections in pyproject/setup.cfg/tox.ini are selected; one target source is explicit --rcfile, multiple are UNKNOWN, and candidate-only weakening cannot pass."
      - case_id: CR14-059
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Keep analyzer code identical by rejecting unsealed Pylint hooks, plugins, and extension packages."
        observable: "Any init-hook, any non-empty extension-pkg allow-list/whitelist alias, and every load-plugins entry under the initial empty signed plugin manifest is UNKNOWN before applicability/launch; unsafe extension-only changes cannot become NOT_APPLICABLE, and repository analyzer-extension code is never imported or statically inferred."
      - case_id: CR14-052
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Govern every pytest configuration source and section recognized by the pinned loader."
        observable: "pytest TOML/INI variants plus native/legacy pyproject, tox.ini, and setup.cfg sections are manifested; selection follows the signed pytest 9.0.3 locator order, and ambiguity or loader-profile drift is UNKNOWN."
      - case_id: CR14-054
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Govern every coverage configuration source recognized by the pinned loader."
        observable: ".coveragerc.toml joins .coveragerc/shared-file sources; selection follows the signed Coverage 7.15.4 order, ignored lower-precedence sources remain evidence, and loader-profile drift is UNKNOWN."
      - case_id: CR14-055
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Treat Ruff's target-tip transitive extend graph as governed sealed policy input."
        observable: "Every relative in-tree closure node/edge/blob/content digest is selected and materialized read-only; member changes are governed UNKNOWN, while escape, cycle, missing, unsupported, or over-bound graphs are UNKNOWN."
      - case_id: CR14-056
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Treat basedpyright extends and baselineFile references as governed sealed policy inputs."
        observable: "The complete relative in-tree config graph and baseline artifact are manifested; referenced-only changes are governed UNKNOWN and unsafe/cyclic/missing/unsupported graphs are UNKNOWN."
      - case_id: CR14-007
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Materialize base/head inputs from resolved commit trees and reject mutation-capable range options."
        observable: "Caller-worktree mutation cannot affect range results; manifest mismatch yields UNKNOWN."
      - case_id: CR14-009
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Analyze a complete materialized HEAD-plus-index tree even when selected or supporting paths have later unstaged edits."
        observable: "Staged selection and complete index tree/path/blob/content identities are distinct evidence; caller-worktree bytes cannot affect findings, imports, score, or status."
      - case_id: CR14-037
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Bind index-side imports and subprocess execution to the complete isolated index snapshot."
        observable: "Imported dependencies, cwd, configuration, and environment come from HEAD-plus-index SnapshotInvocationContext; caller-source resolution or manifest mismatch is UNKNOWN."
      - case_id: CR14-018
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Reserve pull-request range assurance for the complete governed Python selection."
        observable: "Range rejects exclude-tests, every focus facet, path, no-tests, and level filters before analysis; narrowed runs cannot emit range_candidate or an effective pr_range envelope or false NOT_APPLICABLE."
      - case_id: CR14-027
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Bind the module producer to the claimed expected PR target tip and publish the exact downstream consumer contract."
        observable: "Module tests prove candidate/preview production and target-identity rejection; the signed static matrix fixes the core consumer inputs and mismatch cases. Workflow-native recomputation and envelope emission are proved only by paired core adoption tests and are excluded from module selectors."
  openspec:code-review-14-scope-truth-and-differential-enforcement:review-run-command:differential-base-head-enforcement:
    rationale: "Introduced findings require symmetric base/head evidence, not changed-line coincidence."
    stakeholder_refs:
      - "nold-ai/specfact-cli#671"
    touchpoints:
      - id: review-differential-runner
        kind: planned_component
        locator: "specfact-code-review differential runner"
    verification_cases:
      - case_id: CR14-002
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Classify introduced, fixed, unchanged, and unknown findings only under identical immutable analyzer/toolchain/policy/config identities."
        observable: "Introduced blockers block even away from added lines; baseline failures or analyzer-identity mismatch remain unknown."
      - case_id: CR14-010
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Use the resolved merge-base rather than an advanced base-ref tip as the differential baseline."
        observable: "Target-only post-divergence findings are not misclassified as feature-branch changes."
      - case_id: CR14-012
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Normalize stable file anchors through resolved one-to-one renames before base/head fingerprint comparison."
        observable: "A pure file rename retains the blocker as unchanged while both paths and the rename fact remain evidence."
      - case_id: CR14-067
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Prevent candidate-added inline suppressions from masquerading as repaired analyzer findings."
        observable: "The signed comment-token registry—including Pylint disable-all/legacy disable-msg, basedpyright basic/standard mode directives, and CrossHair zero per-condition timeout—makes new/changed/relocated directives always-open class-specific blockers (`introduced_inline_suppression` or `introduced_result_weakening_directive`), changes affected missing base findings to unknown rather than fixed, rejects any purported waiver/trusted flag because CR14 has no authenticated ingestion path, retains pure-rename/unchanged controls, and fails UNKNOWN on manifest or directive-catalog parity uncertainty."
      - case_id: CR14-079
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Prevent a candidate basedpyright mode directive from weakening strict diagnostics and masquerading as a fix."
        observable: "Introduced pyright basic or standard emits an open `introduced_result_weakening_directive` blocker before fingerprint classification; affected missing base findings are unknown, and catalog drift is UNKNOWN."
      - case_id: CR14-080
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Prevent a candidate CrossHair zero-timeout directive from erasing a counterexample and masquerading as a fix."
        observable: "Introduced crosshair per_condition_timeout=0 emits an open `introduced_result_weakening_directive` blocker before fingerprint classification; affected missing base findings are unknown, and catalog drift is UNKNOWN."
      - case_id: CR14-019
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Inject one sealed authorized target-base-tip configuration bundle into both source-snapshot analyzer runs."
        observable: "Head config cannot suppress its own finding; Ruff/Pylint/basedpyright/Semgrep never fall back to source/worktree/dot discovery; injection failure is UNKNOWN."
      - case_id: CR14-022
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Apply policy already promoted at the authorized target tip without replacing the merge-base source baseline."
        observable: "Both source snapshots use the frozen target-tip policy; moved, untrusted, missing, or unusable target policy yields UNKNOWN."
      - case_id: CR14-057
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Provide a deterministic basedpyright input when the target repository has no config."
        observable: "basedpyright-default-v1 generates explicit side --project files from canonical logical JSON and bound snapshot substitutions; implicit project-dot discovery is impossible."
      - case_id: CR14-028
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Project target-policy basedpyright paths independently onto each immutable source snapshot."
        observable: "Shared policy/toolchain/projection identities match while side-specific projected digests may differ only by recorded root bindings; relative imports stay inside the corresponding snapshot; true shared-identity drift or unsafe paths yield UNKNOWN."
      - case_id: CR14-029
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Bind every import-capable analyzer subprocess to the active materialized snapshot."
        observable: "Every analyzer subprocess—including Ruff, Radon, Pylint, basedpyright, both Semgrep passes, CrossHair, and targeted pytest—consumes sealed snapshot cwd/executable/environment/output context; import-capable adapters never resolve caller/head source during baseline analysis."
      - case_id: CR14-062
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Expose every sealed analyzer configuration input through the sandbox without exposing its source bundle."
        observable: "config_roots contains exact read-only Ruff, generated Pylint, basedpyright baseline/reference, Semgrep bundle, and pytest/coverage projection mounts; omission, extra/writeable roots, or digest mismatch is UNKNOWN."
      - case_id: CR14-039
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Prevent untrusted analyzer or imported candidate code from reading or modifying another evidence root."
        observable: "The pinned `linux-bwrap-v1` capability-probed sandbox exposes only the active read-only snapshot, exact read-only config/toolchain inputs, and process-private writable outputs; cross-root, credential, descriptor, and network access is denied, artifacts are sealed after exit, and unavailable or failed isolation yields UNKNOWN."
      - case_id: CR14-040
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "State the trust boundary for pytest, CrossHair, and other candidate-executing observations without inventing hostile-code proof."
        observable: "Runtime artifacts are labelled candidate-executed observations under the explicit non-adversarial-candidate assumption; sealing claims post-collection immutability only, and a consumer requiring adversarial runtime evidence receives UNKNOWN/no PASS."
      - case_id: CR14-041
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Give reviewed Git inputs, signed module payloads, generated projections, and builtin analyzer modes unambiguous provenance."
        observable: "The closed tagged input identity binds source-specific fields and materialized digests; only reviewed-tree inputs claim Git blobs, and producer/consumer canonical digests match."
      - case_id: CR14-034
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Permit the mandatory Radon subprocess to consume the same per-snapshot invocation context."
        observable: "Radon receives sealed executable, snapshot cwd/environment/output roots, and context digest without changing metric semantics."
      - case_id: CR14-036
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Permit both mandatory Semgrep subprocesses to consume the per-snapshot invocation context."
        observable: "Semgrep receives sealed executable, snapshot cwd/environment/output roots, context digest, target-policy bundle, the authorized target-tip or exact signed-module-fallback AI-bloat pack, exact normalized scanned/skipped-to-eligible input reconciliation, and explicit process/parse failures without rule changes."
      - case_id: CR14-072
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Keep the existing AI-bloat Semgrep pack governed and present in symmetric sealed analysis."
        observable: "A target-tip pack is governed and sealed; absence selects the exact signed-module payload; both sides use identical bound bytes; candidate change, missing fallback, or digest drift is UNKNOWN."
  openspec:code-review-14-scope-truth-and-differential-enforcement:review-finding-model:independent-finding-lifecycle-and-remediation:
    rationale: "Severity, resolution, autofix availability, and policy are distinct facts."
    stakeholder_refs:
      - "nold-ai/specfact-cli#671"
    touchpoints:
      - id: review-finding-schema
        kind: planned_schema
        locator: "ReviewFinding"
    verification_cases:
      - case_id: CR14-003
        scenario_id: independent-finding-lifecycle-and-remediation
        method: test
        intent: "Keep open fixable errors blocking until actually fixed or waived."
        observable: "Separate fields and deterministic policy derivation."
  openspec:code-review-14-scope-truth-and-differential-enforcement:review-cli-contracts:truthful-review-assurance-status:
    rationale: "Unknown and not-applicable are not green passes."
    stakeholder_refs:
      - "nold-ai/specfact-cli#665"
    touchpoints:
      - id: review-report-status
        kind: planned_schema
        locator: "ReviewReport"
    verification_cases:
      - case_id: CR14-004
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Expose PASS, FAIL, UNKNOWN, and NOT_APPLICABLE with analyzer coverage."
        observable: "No all-passed summary when mandatory evidence is skipped or unknown."
      - case_id: CR14-008
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Dual-write schema 1.6 assurance into the closed legacy verdict, normalized enforcement-mode, and exit-code projection."
        observable: "UNKNOWN is never green; old reports cannot imply UNKNOWN/NOT_APPLICABLE; malformed 1.6 reports cannot pass."
      - case_id: CR14-045
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Resolve concurrent valid blocking evidence and required uncertainty without losing either fact."
        observable: "Only blockers remaining open after differential classification make aggregate FAIL; exact fixed baseline-only FAIL/head-PASS evidence is retained but excluded; concurrent required uncertainty remains present and signed compatibility/ledger consumers preserve the same precedence."
      - case_id: CR14-030
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Publish one signed machine-readable compatibility matrix before any core consumer adoption."
        observable: "Four canonical statuses bind legacy projections, strict/shadow exits, runtime-trust fields, and static accepted/rejected envelope fixtures; the exact schema-less ledger input maps to legacy schema 1.0/reward 5/PASS/exit 0 with preserved fields and no inferred authoritative status; hostile-candidate policy is UNKNOWN and mismatches are invalid. The module proves matrix integrity only; core runtime consumers must pass this exact digest in their own adoption tests."
      - case_id: CR14-013
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Preserve schema 1.6 truth through every post-analysis enrichment path."
        observable: "Cleanup forecast refresh retains schema, authoritative assurance, scope/analyzer evidence, legacy projection, and exit code unchanged."
      - case_id: CR14-025
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Attach validated Requirements context without downgrading the Code Review report schema."
        observable: "Requirements attachment preserves schema 1.6 assurance, scope/analyzer evidence, legacy projection, and exit code while adding only its context."
      - case_id: CR14-070
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Prevent the modules repository staged consumer from turning schema 1.6 UNKNOWN into a green hook result."
        observable: "Schema 1.6 authoritative assurance_status/ci_exit_code bypass legacy changed-line recomputation; UNKNOWN remains non-zero outside shadow even without a staged-line blocker, while old reports retain compatibility behavior."
      - case_id: CR14-071
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Prove the advertised minimum core version can install, load, and validate the released schema before publishing compatibility metadata."
        observable: "A fresh environment uses the checkpointed immutable core 0.56.0 tag/commit/tree plus candidate module package and exercises every consumer-matrix status/projection; missing identity, branch fallback, install/load failure, or mismatch blocks release without claiming protected PR assurance."
  openspec:code-review-14-scope-truth-and-differential-enforcement:review-cli-contracts:review-cli-contracts-cover-explicit-scope-and-differential-evidence:
    rationale: "The public CLI contract must prove every explicit scope and differential evidence path."
    stakeholder_refs:
      - "nold-ai/specfact-cli#665"
      - "nold-ai/specfact-cli#671"
    touchpoints:
      - id: review-cli-contract-fixtures
        kind: planned_component
        locator: "tests/cli-contracts/specfact-code-review-run.scenarios.yaml"
    verification_cases:
      - case_id: CR14-005
        scenario_id: review-cli-contracts-cover-explicit-scope-and-differential-evidence
        method: test
        intent: "Exercise static argv/report contracts for explicit scope sources, full-ref requirements, assurance/enforcement projection, positional-file PR downgrade rejection, and invalid combinations."
        observable: "Static CLI fixtures reject ambiguous inputs without claiming stateful Git topology or analyzer evidence."
      - case_id: CR14-014
        scenario_id: review-cli-contracts-cover-explicit-scope-and-differential-evidence
        method: test
        intent: "Make range defaults and generated AI instructions executable under the normalized enforcement contract."
        observable: "Omitted range enforcement becomes strict full; explicit range-plus-changed is rejected; instructions use range refs and explicit full enforcement."
      - case_id: CR14-016
        scenario_id: review-cli-contracts-cover-explicit-scope-and-differential-evidence
        method: test
        intent: "Migrate installed merge-quality guidance from changed/worktree scope to executable PR-range assurance."
        observable: "Rules updater and bundled skill emit protected range/base/head/context/full merge guidance, label local range as range_preview, and retain worktree-scoped simplification."
      - case_id: CR14-021
        scenario_id: review-cli-contracts-cover-explicit-scope-and-differential-evidence
        method: test
        intent: "Keep canonical repository quality-gate, module/bundle, generated-instruction, and installed-skill guidance on the same assurance boundary."
        observable: "Protected CI merge guidance requires range/base/head/context/full and independent verification; local range is range_preview; staged positional and simplification worktree commands are non-PR; generated skill copies match their bundled source."
      - case_id: CR14-032
        scenario_id: review-cli-contracts-cover-explicit-scope-and-differential-evidence
        method: test
        intent: "Make authenticated PR context an executable input without letting a local caller self-assert trust."
        observable: "Module tests prove a matching claimed context yields producer range_candidate, absence yields range_preview, and unsafe/mismatch yields UNKNOWN. The static matrix defines—but does not execute—the core-owned consumer envelope that alone yields effective pr_range."
  openspec:code-review-14-scope-truth-and-differential-enforcement:review-run-command:mandatory-analyzer-coverage:
    rationale: "A review cannot claim assurance when a mandatory analyzer did not produce trustworthy evidence."
    stakeholder_refs:
      - "nold-ai/specfact-cli#671"
    touchpoints:
      - id: review-analyzer-coverage
        kind: planned_schema
        locator: "ReviewReport.analyzer_coverage"
    verification_cases:
      - case_id: CR14-006
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Record each analyzer identity and outcome and fail closed when mandatory coverage is unavailable."
        observable: "Skipped, failed, timed-out, or unparsable mandatory analyzer evidence yields UNKNOWN without an all-passed summary."
      - case_id: CR14-015
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Freeze the pr-range-v1 analyzer membership and required/conditional statuses."
        observable: "Eight analyzers are always required; semgrep-bugs is required when governed config exists and otherwise NOT_APPLICABLE; no member is silently optional."
      - case_id: CR14-017
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Surface required contract/CrossHair timeout as failed analyzer coverage."
        observable: "A swallowed timeout cannot become an empty successful contracts run; strict assurance is UNKNOWN."
      - case_id: CR14-026
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Surface a documented CrossHair tool/process-error exit without parsed findings as failed analyzer coverage."
        observable: "Exit code 2 retains exit/stderr diagnostics and yields UNKNOWN, while parsed counterexamples remain findings."
      - case_id: CR14-038
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Keep mandatory Semgrep coverage usable when a consumer repository does not vendor the module clean-code policy."
        observable: "Both snapshots receive the same explicit clean-code payload from the exact signed installed module artifact with package and payload digests; source/worktree discovery is disabled, semgrep-bugs remains conditional on target policy, and missing or invalid fallback evidence yields UNKNOWN."
      - case_id: CR14-058
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Provision the exact configuration-loader and analyzer versions claimed by pr-range-v1."
        observable: "The signed module manifest has checkpoint-matching exact constraints, directly includes pytest 9.0.3 and Coverage 7.15.4, and a fresh-install version/digest mismatch makes profile activation UNKNOWN."
      - case_id: CR14-060
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Make Python distribution identity stable across virtual-environment roots."
        observable: "Wheel/RECORD payload and normalized entry-point identities match across install roots; generated wrapper/shebang bytes are excluded, while payload or entry-point drift is UNKNOWN."
      - case_id: CR14-065
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Close and sign the complete analyzer runtime dependency graph and provision it during implementation."
        observable: "For each supported Linux/CPython environment, module-package PEP 508 names and exact constraints match every selected-lock direct/transitive package, marker, edge, payload and closure digest; a normalized-name guard retains required tool membership, and missing/extra/bare/drift is UNKNOWN."
      - case_id: CR14-061
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Keep targeted coverage code identical by rejecting repository-loaded plugins."
        observable: "Every configured Coverage plugin is UNKNOWN under the initial empty signed manifest before launch; repository plugin code is never imported or statically inferred."
      - case_id: CR14-064
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Keep Coverage data and report writes out of immutable snapshots and config mounts."
        observable: "Every pinned-schema writable field, including relative data_file, is projected into a role-specific process-private output path with bound transformation evidence; escape, collision, or drift is UNKNOWN."
      - case_id: CR14-066
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Reconcile targeted coverage against every governed production input present in each immutable snapshot."
        observable: "The normalized coverage-file manifest contains each governed production path exactly once before threshold evaluation; target-policy exclusion, missing/duplicate/aliased/escaping/identity-mismatched paths are UNKNOWN even when tests and the reported threshold pass."
      - case_id: CR14-068
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Prevent authorized target Coverage regexes from suppressing candidate statements or branches."
        observable: "Non-empty exclusion/partial-branch fields are UNKNOWN before launch; absent/empty fields produce a bound projection clearing pinned defaults/additions, so matching marker text cannot create a false threshold fix."
      - case_id: CR14-069
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Keep every pytest cache/log/temp/JUnit write out of immutable snapshots and config mounts."
        observable: "Pinned pytest config/addopts paths have closed read/write roles; writable destinations are rebound to deterministic process-private roots with controller-owned JUnit precedence, and unclassified/escaping/colliding/ineffective output projection is UNKNOWN."
      - case_id: CR14-073
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Prevent Ruff cache initialization from writing into immutable snapshots or turning ordinary execution into UNKNOWN."
        observable: "Pinned --no-cache is effective, cache_mode=disabled is bound, no snapshot/config-root write occurs, and flag/catalog/write drift is UNKNOWN."
      - case_id: CR14-074
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Ensure Ruff force-exclude cannot silently remove an explicitly governed file."
        observable: "Pinned --no-force-exclude plus matching eligible/invoked manifests forces explicit governed inputs through Ruff; ineffective flags, skipped input, or option-catalog drift is UNKNOWN."
      - case_id: CR14-075
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Ensure Pylint whole-file ignore controls cannot silently remove a governed input."
        observable: "The generated projection clears ignore, ignore-patterns, and ignore-paths while binding original/effective values and exact eligible/argv manifests; effective ignore or drift is UNKNOWN."
      - case_id: CR14-076
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Ensure basedpyright ignore cannot report diagnostic success for a wholly silenced governed input."
        observable: "Each generated project binds and clears ignore while preserving other authorized settings and exact eligible/argv manifests; effective ignore or catalog/manifest drift is UNKNOWN."
      - case_id: CR14-077
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Require Semgrep to prove it scanned every eligible governed input."
        observable: "Normalized JSON paths.scanned equals the eligible manifest; paths.skipped is retained; rule exclusions, size skips, missing/extra paths, or reconciliation failure are UNKNOWN."
      - case_id: CR14-078
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Keep the exact locked analyzer dependency set separate from the SpecFact core/controller environment."
        observable: "A dedicated analyzer-only environment equals the signed lock plus bootstrap allowlist and is the only analyzer import/executable root; unrelated host packages are not extras, while any host-path leakage or analyzer-set drift is UNKNOWN."
      - case_id: CR14-042
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Keep valid failing behavioral evidence distinct from incomplete analyzer infrastructure."
        observable: "Completed blockers and collected assertion/skip/xfail/xpass evidence are FAIL; availability/process/timeout/parse/identity/artifact/reconciliation errors are UNKNOWN; legacy exit projection does not erase the distinction."
      - case_id: CR14-050
        scenario_id: mandatory-analyzer-coverage
