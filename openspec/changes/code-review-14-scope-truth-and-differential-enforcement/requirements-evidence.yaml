        derive from HEAD versus that tree, all evidence binds the same snapshot, later live-index mutation is ignored, and
        capture/metadata/tree/diff/object mismatch is UNKNOWN.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_scope.py::test_index_scope_derives_selection_from_captured_tree_during_concurrent_index_mutation
      implementation_task: '3.3'
    - case_id: CR14-143
