      - case_id: CR14-042
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Keep valid failing behavioral evidence distinct from incomplete analyzer infrastructure."
        observable: "Completed blockers and collected assertion/skip/xfail/xpass evidence are FAIL; availability/process/timeout/parse/identity/artifact/reconciliation errors are UNKNOWN; legacy exit projection does not erase the distinction."
      - case_id: CR14-050
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Prevent candidate pytest/coverage configuration from suppressing targeted measurement."
        observable: "Explicit sealed target-tip/default -c and --cov-config projections plus sanitized overrides defeat candidate exclude-all config; ambiguity/projection/effective-option drift is UNKNOWN."
      - case_id: CR14-053
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Resolve pytest path settings against the immutable snapshot being measured."
