schema_version: '2'
requirements:
  openspec:code-review-14-scope-truth-and-differential-enforcement:review-run-command:explicit-review-scope-evidence:
    rationale: A review verdict is meaningful only when the evaluated snapshot is known.
    stakeholder_refs:
    - nold-ai/specfact-cli#665
    - nold-ai/specfact-cli#671
    touchpoints:
    - id: review-scope-cli
      kind: planned_cli_command
      locator: specfact code review run --scope
    verification_cases:
    - case_id: CR14-001
      scenario_id: explicit-review-scope-evidence
      method: test
      intent: Resolve worktree, index, range, full, or explicit-file scope without ambiguity.
      observable: Immutable scope evidence identifies the analyzed snapshot and files; only a successfully resolved unfiltered
        diff containing neither governed Python nor governed analyzer-policy input is NOT_APPLICABLE, and rejected narrowing
        cannot manufacture that state.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_scope.py::test_range_scope_uses_merge_base_not_head_worktree
      implementation_task: '3.1'
    - case_id: CR14-047
      scenario_id: explicit-review-scope-evidence
      method: test
      intent: Treat candidate analyzer-policy/config changes as governed impact without self-authorization.
      observable: Closed policy paths/pyproject sections are selected and digested; a policy-only range is UNKNOWN under the
        target-tip policy, never NOT_APPLICABLE/PASS, until a separate trusted promotion contract exists.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_scope.py::test_policy_only_range_is_unknown_not_not_applicable
      implementation_task: 3.5a
    - case_id: CR14-048
      scenario_id: explicit-review-scope-evidence
      method: test
      intent: Avoid classifying unrelated shared-file metadata as review-policy impact.
      observable: Only canonical analyzer, coverage, and pytest sections in pyproject/setup.cfg/tox.ini enter the governed
        policy digest; parse failure is UNKNOWN.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_scope.py::test_coverage_config_only_range_is_governed_unknown
      implementation_task: 3.5c
    - case_id: CR14-049
      scenario_id: explicit-review-scope-evidence
      method: test
      intent: Treat candidate pytest and coverage configuration as governed policy impact.
      observable: .coveragerc/pytest.ini and the closed shared-file sections are selected/digested; policy-only changes are
        UNKNOWN rather than NOT_APPLICABLE/PASS.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_scope.py::test_pytest_empty_ini_overrides_lower_precedence_config
      implementation_task: 3.5c
    - case_id: CR14-106
      scenario_id: explicit-review-scope-evidence
      method: test
      intent: Prevent a governed Python or policy path from being dereferenced through a Git symlink and falsely treated as
        analyzed committed code.
      observable: tracked-regular-governed-input-v1 binds object type/mode/blob/content, accepts only no-follow-opened regular
        blob modes 100644/100755, and makes symlink/gitlink/unsafe mode changes governed UNKNOWN before applicability or analysis.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_scope.py::test_range_mode_change_regular_to_symlink_is_unknown
      implementation_task: '3.4'
    - case_id: CR14-051
      scenario_id: explicit-review-scope-evidence
      method: test
      intent: Govern every Pylint configuration source recognized by the pinned loader.
      observable: pylintrc legacy/TOML variants and Pylint sections in pyproject/setup.cfg/tox.ini are selected; one target
        source is explicit --rcfile, multiple are UNKNOWN, and candidate-only weakening cannot pass.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_scope.py::test_ruff_config_zero_or_one_source_is_explicit[.ruff.toml]
      implementation_task: 3.5d
    - case_id: CR14-059
      scenario_id: explicit-review-scope-evidence
      method: test
      intent: Keep analyzer code identical by rejecting unsealed Pylint hooks, plugins, and extension packages.
      observable: Any init-hook, any non-empty extension-pkg allow-list/whitelist alias, and every load-plugins entry under
        the initial empty signed plugin manifest is UNKNOWN before applicability/launch; unsafe extension-only changes cannot
        become NOT_APPLICABLE, and repository analyzer-extension code is never imported or statically inferred.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_scope.py::test_pylint_repository_plugin_or_init_hook_is_unknown[init-hook]
      implementation_task: '3.17'
    - case_id: CR14-052
      scenario_id: explicit-review-scope-evidence
      method: test
