        a bare pyproject.toml is only the final fallback; selected/ignored reasons are bound and loader drift is UNKNOWN.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_scope.py::test_pytest_bare_pyproject_is_final_fallback
      implementation_task: 3.5c
