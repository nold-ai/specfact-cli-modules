schema_version: "2"
requirements:
  openspec:code-review-14-scope-truth-and-differential-enforcement:review-run-command:explicit-review-scope-evidence:
    rationale: "A review verdict is meaningful only when the evaluated snapshot is known."
    stakeholder_refs:
      - "nold-ai/specfact-cli#665"
      - "nold-ai/specfact-cli#671"
    touchpoints:
      - id: review-scope-cli
        kind: planned_cli_command
        locator: "specfact code review run --scope"
    verification_cases:
      - case_id: CR14-001
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Resolve worktree, index, range, full, or explicit-file scope without ambiguity."
        observable: "Immutable scope evidence identifies the analyzed snapshot and files; only a successfully resolved unfiltered diff containing neither governed Python nor governed analyzer-policy input is NOT_APPLICABLE, and rejected narrowing cannot manufacture that state."
      - case_id: CR14-047
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Treat candidate analyzer-policy/config changes as governed impact without self-authorization."
        observable: "Closed policy paths/pyproject sections are selected and digested; a policy-only range is UNKNOWN under the target-tip policy, never NOT_APPLICABLE/PASS, until a separate trusted promotion contract exists."
      - case_id: CR14-048
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Avoid classifying unrelated shared-file metadata as review-policy impact."
        observable: "Only canonical analyzer, coverage, and pytest sections in pyproject/setup.cfg/tox.ini enter the governed policy digest; parse failure is UNKNOWN."
      - case_id: CR14-049
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Treat candidate pytest and coverage configuration as governed policy impact."
        observable: ".coveragerc/pytest.ini and the closed shared-file sections are selected/digested; policy-only changes are UNKNOWN rather than NOT_APPLICABLE/PASS."
      - case_id: CR14-106
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Prevent a governed Python or policy path from being dereferenced through a Git symlink and falsely treated as analyzed committed code."
        observable: "tracked-regular-governed-input-v1 binds object type/mode/blob/content, accepts only no-follow-opened regular blob modes 100644/100755, and makes symlink/gitlink/unsafe mode changes governed UNKNOWN before applicability or analysis."
      - case_id: CR14-051
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Govern every Pylint configuration source recognized by the pinned loader."
        observable: "pylintrc legacy/TOML variants and Pylint sections in pyproject/setup.cfg/tox.ini are selected; one target source is explicit --rcfile, multiple are UNKNOWN, and candidate-only weakening cannot pass."
      - case_id: CR14-059
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Keep analyzer code identical by rejecting unsealed Pylint hooks, plugins, and extension packages."
        observable: "Any init-hook, any non-empty extension-pkg allow-list/whitelist alias, and every load-plugins entry under the initial empty signed plugin manifest is UNKNOWN before applicability/launch; unsafe extension-only changes cannot become NOT_APPLICABLE, and repository analyzer-extension code is never imported or statically inferred."
      - case_id: CR14-052
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Govern every pytest configuration source and section recognized by the pinned loader."
        observable: "pytest TOML/INI variants plus native/legacy pyproject, tox.ini, and setup.cfg sections are manifested; selection follows the signed pytest 9.0.3 locator order, and ambiguity or loader-profile drift is UNKNOWN."
      - case_id: CR14-103
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Mirror the pinned pytest 9.0.3 configuration locator exactly for empty and fallback sources."
        observable: "Zero-byte pytest.toml/.pytest.toml and pytest.ini/.pytest.ini sources remain active and suppress lower sources; a bare pyproject.toml is only the final fallback; selected/ignored reasons are bound and loader drift is UNKNOWN."
      - case_id: CR14-054
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Govern every coverage configuration source recognized by the pinned loader."
        observable: ".coveragerc.toml joins .coveragerc/shared-file sources; selection follows the signed Coverage 7.15.4 order, ignored lower-precedence sources remain evidence, and loader-profile drift is UNKNOWN."
      - case_id: CR14-055
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Treat Ruff's target-tip transitive extend graph as governed sealed policy input."
        observable: "Every relative in-tree closure node/edge/blob/content digest is selected and materialized read-only; member changes are governed UNKNOWN, while escape, cycle, missing, unsupported, or over-bound graphs are UNKNOWN."
      - case_id: CR14-056
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Treat basedpyright extends and baselineFile references as governed sealed policy inputs."
        observable: "The complete relative in-tree config graph and baseline artifact are manifested; referenced-only changes are governed UNKNOWN and unsafe/cyclic/missing/unsupported graphs are UNKNOWN."
      - case_id: CR14-007
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Materialize base/head inputs from resolved commit trees and reject mutation-capable range options."
        observable: "Caller-worktree mutation cannot affect range results; manifest mismatch yields UNKNOWN."
      - case_id: CR14-009
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Analyze a complete materialized HEAD-plus-index tree even when selected or supporting paths have later unstaged edits."
        observable: "Staged selection and complete index tree/path/blob/content identities are distinct evidence; caller-worktree bytes cannot affect findings, imports, score, or status."
      - case_id: CR14-037
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Bind index-side imports and subprocess execution to the complete isolated index snapshot."
        observable: "Imported dependencies, cwd, configuration, and environment come from HEAD-plus-index SnapshotInvocationContext; caller-source resolution or manifest mismatch is UNKNOWN."
      - case_id: CR14-018
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Reserve pull-request range assurance for the complete governed Python selection."
        observable: "Range rejects exclude-tests, every focus facet, path, no-tests, and level filters before analysis; narrowed runs cannot emit range_candidate or an effective pr_range envelope or false NOT_APPLICABLE."
      - case_id: CR14-083
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Reject ambiguous range baselines instead of choosing an arbitrary best merge base."
        observable: "A synthetic criss-cross history retains the sorted candidate commit/tree list and digest, then yields UNKNOWN before diff/materialization/analyzers; producer and protected consumer both require exactly one and define no virtual-base fallback."
      - case_id: CR14-027
        scenario_id: explicit-review-scope-evidence
        method: test
        intent: "Bind the module producer to the claimed expected PR target tip and publish the exact downstream consumer contract."
        observable: "Module tests prove candidate/preview production and target-identity rejection; the signed static matrix fixes the core consumer inputs and mismatch cases. Workflow-native recomputation and envelope emission are proved only by paired core adoption tests and are excluded from module selectors."
  openspec:code-review-14-scope-truth-and-differential-enforcement:review-run-command:differential-base-head-enforcement:
    rationale: "Introduced findings require symmetric base/head evidence, not changed-line coincidence."
    stakeholder_refs:
      - "nold-ai/specfact-cli#671"
    touchpoints:
      - id: review-differential-runner
        kind: planned_component
        locator: "specfact-code-review differential runner"
    verification_cases:
      - case_id: CR14-002
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Classify introduced, fixed, unchanged, and unknown findings only under identical immutable analyzer/toolchain/policy/config identities."
        observable: "Introduced blockers block even away from added lines; baseline failures or analyzer-identity mismatch remain unknown."
      - case_id: CR14-010
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Use the resolved merge-base rather than an advanced base-ref tip as the differential baseline."
        observable: "Target-only post-divergence findings are not misclassified as feature-branch changes."
      - case_id: CR14-012
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Normalize stable file anchors through resolved one-to-one renames before base/head fingerprint comparison."
        observable: "A pure file rename retains the blocker as unchanged while both paths and the rename fact remain evidence."
      - case_id: CR14-067
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Prevent candidate-added inline suppressions from masquerading as repaired analyzer findings."
        observable: "The signed comment-token registry—including Ruff's complete pinned noqa/ignore/file-ignore/disable/enable grammar and every isort action in both accepted prefix families, Pylint disable-all/legacy disable-msg/atomic skip-file, basedpyright basic/standard mode directives, and the complete pinned CrossHair source-directive catalog—makes new/changed/relocated directives always-open class-specific blockers (`introduced_inline_suppression` or `introduced_analyzer_result_control`), changes affected missing base findings to unknown rather than fixed, rejects any purported waiver/trusted flag because CR14 has no authenticated ingestion path, retains pure-rename/unchanged controls, and fails UNKNOWN on manifest or directive-catalog parity uncertainty."
      - case_id: CR14-118
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Prevent Pylint's atomic skip-file pragma from forging a repaired finding."
        observable: "Adding # pylint: skip-file to a file with a baseline Pylint undefined-variable diagnostic emits an open introduced_inline_suppression blocker before fingerprinting; the vanished diagnostic is UNKNOWN rather than fixed, and the exact directive form is frozen in the signed catalog."
      - case_id: CR14-098
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Prevent Ruff isort action comments from erasing I001 evidence."
        observable: "Each pinned isort:/ruff: isort: skip_file|on|off|skip|split form is detected from comment tokens before fingerprints; an introduced action is a blocking inline-suppression finding and the missing baseline I001 remains unknown rather than fixed."
      - case_id: CR14-099
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Prevent Ruff range, line, and file suppression controls from erasing baseline evidence."
        observable: "Every pinned Ruff noqa, ignore, file-ignore, disable, and enable grammar form is parser-derived and detected before fingerprints; introduced controls block and affected missing baseline findings remain unknown, while parser/catalog drift is UNKNOWN."
      - case_id: CR14-109
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Prevent pre-existing unchanged suppressions from hiding defects introduced elsewhere in a modified file."
        observable: "suppression-affected-edit-v1 makes every content-changed governed Python file retaining a mapped unchanged directive required UNKNOWN for the affected required/activated analyzer, with blob/directive-manifest/changed-hunk evidence; silent analyzer output cannot PASS, while an identical-blob pure rename is not quarantined and changed directives remain blocking."
      - case_id: CR14-110
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Prevent suppression policy and analyzer mappings from drifting between the red checkpoint, package signature, producer, and protected consumer."
        observable: "The one signed pr-range-v1-suppression-catalog resource canonically binds both suppression-directives-v1 and suppression-affected-edit-v1, including parser/catalog versions, mappings, normalization, dispositions, and policy constants; missing, embedded-only, noncanonical, or checkpoint/package/profile/report/envelope drift is UNKNOWN before launch."
      - case_id: CR14-112
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Bind the suppression catalog identity across every module-owned trust boundary and hand off the live consumer comparison explicitly."
        observable: "Mapped module tests vary checkpoint/resource/package/profile/report/static-envelope catalog digests independently and reject every mismatch; task 4.7 separately requires the unmapped core consumer to load the approved signed catalog digest and reject report/envelope mismatch before pr_range promotion."
      - case_id: CR14-114
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Prevent basedpyright line-level pyright-ignore comments from erasing baseline diagnostics."
        observable: "Both parser-recognized `pyright: ignore` and bracketed `pyright: ignore[reportRule,...]` forms are frozen in the signed suppression catalog; an introduced occurrence blocks before fingerprint classification, affected missing base findings stay unknown, and parser/catalog drift is UNKNOWN."
      - case_id: CR14-100
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Select Ruff policy without implicit or implementation-dependent source precedence."
        observable: "Zero root Ruff sources uses explicit isolated mode, exactly one source is projected explicitly, and multiple .ruff.toml/ruff.toml/pyproject tool.ruff sources are ruff_config_ambiguous UNKNOWN before applicability or launch."
      - case_id: CR14-101
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Preserve diagnostic multiplicity without making raw line positions part of finding identity."
        observable: "finding-multiset-v1 pairs exact normalized identity/outcome buckets only after occurrence-continuity-v1 proves one physical source anchor per side; unrelated line shifts remain unchanged, duplicate head surplus is introduced, ambiguous anchors cannot pair, and identity/anchor/partition counts, decisions, pairs, surpluses, and digests remain evidence."
      - case_id: CR14-105
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Prevent an identity-equal diagnostic recreated at a different source location from masquerading as unchanged baseline debt."
        observable: "Canonical source spans and exact anchors distinguish unrelated replacements; a valid different/non-corresponding head anchor is introduced, invalid/non-unique/unavailable continuity is unknown, and a line shift is unchanged only when forced source-line correspondence is uniquely optimal."
      - case_id: CR14-108
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Prevent an identical source block moved between edit locations from being treated as the same unchanged diagnostic."
        observable: "source-line-correspondence-v1 binds global/forced/forbidden exact-line edit costs: uniquely forced optimum is continuous, higher forced cost is different/introduced, alternate optima or exceeded bounds are UNKNOWN, and no move/fuzzy inference exists."
      - case_id: CR14-079
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Prevent a candidate basedpyright source directive from weakening diagnostics and masquerading as a fix."
        observable: "Every introduced `pyright:` directive recognized by pinned basedpyright 1.39.10 emits an open `introduced_analyzer_result_control` blocker before fingerprint classification; the parser-derived catalog covers strict/basic/standard, all boolean settings and diagnostic-level rules/values, including analyzeUnannotatedFunctions=false; affected missing base findings are unknown, and catalog drift is UNKNOWN."
      - case_id: CR14-091
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Prevent any candidate-local basedpyright boolean or diagnostic-level source directive from erasing a diagnostic."
        observable: "A mechanically extracted pinned parser catalog parameterizes every recognized setting/value; each introduced directive blocks regardless of inferred strength, and catalog/parser drift is UNKNOWN."
      - case_id: CR14-080
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Prevent any candidate-local CrossHair analyzer-result directive from erasing a counterexample and masquerading as a fix."
        observable: "Every source directive in pinned CrossHair 0.0.109's special on/off forms and `AnalysisOptionSet.directive_fields` catalog emits an open `introduced_analyzer_result_control` blocker; explicit false-enable and non-positive iteration/path/condition budget aliases are covered, affected missing base findings are unknown, and parser/catalog drift is UNKNOWN."
      - case_id: CR14-019
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Inject one sealed authorized target-base-tip configuration bundle into both source-snapshot analyzer runs."
        observable: "Head config cannot suppress its own finding; Ruff/Pylint/basedpyright/Semgrep never fall back to source/worktree/dot discovery; injection failure is UNKNOWN."
      - case_id: CR14-022
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Apply policy already promoted at the authorized target tip without replacing the merge-base source baseline."
        observable: "Both source snapshots use the frozen target-tip policy; moved, untrusted, missing, or unusable target policy yields UNKNOWN."
      - case_id: CR14-057
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Provide a deterministic basedpyright input when the target repository has no config."
        observable: "basedpyright-default-v1 generates explicit side --project files from canonical logical JSON and bound snapshot substitutions; implicit project-dot discovery is impossible."
      - case_id: CR14-028
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Project target-policy basedpyright paths independently onto each immutable source snapshot."
        observable: "Shared policy/toolchain/projection identities match while side-specific projected digests may differ only by recorded root bindings; relative imports stay inside the corresponding snapshot; true shared-identity drift or unsafe paths yield UNKNOWN."
      - case_id: CR14-086
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Prevent basedpyright baseline slots from hiding a relocated or newly introduced diagnostic."
        observable: "Original baseline artifacts remain governed/digested, but generated projects remove every baselineFile and argv omits --baselinefile; baseline files are not mounted/read, the relocated diagnostic remains visible, and effective baseline injection is UNKNOWN."
      - case_id: CR14-087
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Prevent basedpyright include or exclude controls from dropping a governed input."
        observable: "The generated flattened project binds original controls, sets include to the exact eligible snapshot-relative manifest, clears exclude and ignore, and uses only explicit --project; a previously excluded file remains analyzed and any include/effective-control mismatch is UNKNOWN."
      - case_id: CR14-029
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Bind every import-capable analyzer subprocess to the active materialized snapshot."
        observable: "Every analyzer subprocess—including Ruff, Pylint, basedpyright, both Semgrep passes, CrossHair, and targeted pytest—consumes sealed snapshot cwd/executable/environment/output context; Radon consumes the same sealed snapshot identity through absolute inputs while using its empty control cwd; import-capable adapters never resolve caller/head source during baseline analysis."
      - case_id: CR14-062
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Expose every sealed analyzer configuration input through the sandbox without exposing its source bundle."
        observable: "config_roots contains exact read-only Ruff, generated Pylint, basedpyright project/non-baseline reference, Semgrep bundle, and pytest/coverage projection mounts while baseline artifacts remain governed but unmounted; omission, extra/writeable roots, or digest mismatch is UNKNOWN."
      - case_id: CR14-039
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Prevent untrusted analyzer or imported candidate code from reading or modifying another evidence root."
        observable: "The pinned `linux-bwrap-v1` capability-probed sandbox exposes only the active read-only snapshot, exact read-only config/toolchain inputs, and process-private writable outputs; cross-root, credential, descriptor, and network access is denied, artifacts are sealed after exit, and unavailable or failed isolation yields UNKNOWN."
      - case_id: CR14-040
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "State the trust boundary for pytest, CrossHair, and other candidate-executing observations without inventing hostile-code proof."
        observable: "Runtime artifacts are labelled candidate-executed observations under the explicit non-adversarial-candidate assumption; sealing claims post-collection immutability only, and a consumer requiring adversarial runtime evidence receives UNKNOWN/no PASS."
      - case_id: CR14-041
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Give reviewed Git inputs, signed module payloads, generated projections, and builtin analyzer modes unambiguous provenance."
        observable: "The closed tagged input identity binds source-specific fields and materialized digests; only reviewed-tree inputs claim Git blobs, and producer/consumer canonical digests match."
      - case_id: CR14-034
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Permit the mandatory Radon subprocess to consume the same per-snapshot invocation context."
        observable: "Radon receives the sealed executable, absolute snapshot inputs, empty control cwd/private home/sanitized environment, private output root, and context digest without changing metric formulas."
      - case_id: CR14-124
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Prevent candidate or ambient Radon configuration from filtering a governed result."
        observable: "Radon runs from an empty sealed control directory with private HOME and sanitized RADONCFG, receives absolute eligible snapshot inputs, forces CC A..F and MI A..C with empty exclude/ignore and private output, and reports UNKNOWN on discovery, narrowing, skipped input, or catalog drift."
      - case_id: CR14-036
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Permit both mandatory Semgrep subprocesses to consume the per-snapshot invocation context."
        observable: "Semgrep receives sealed executable, snapshot cwd/environment/output roots, context digest, target-policy bundle, the authorized target-tip or exact signed-module-fallback AI-bloat pack, exact normalized scanned/skipped-to-eligible input reconciliation, and explicit process/parse failures without rule changes."
      - case_id: CR14-072
        scenario_id: differential-base-head-enforcement
        method: test
        intent: "Keep the existing AI-bloat Semgrep pack governed and present in symmetric sealed analysis."
        observable: "A target-tip pack is governed and sealed; absence selects the exact signed-module payload; both sides use identical bound bytes; candidate change, missing fallback, or digest drift is UNKNOWN."
  openspec:code-review-14-scope-truth-and-differential-enforcement:review-finding-model:independent-finding-lifecycle-and-remediation:
    rationale: "Severity, resolution, autofix availability, and policy are distinct facts."
    stakeholder_refs:
      - "nold-ai/specfact-cli#671"
    touchpoints:
      - id: review-finding-schema
        kind: planned_schema
        locator: "ReviewFinding"
    verification_cases:
      - case_id: CR14-003
        scenario_id: independent-finding-lifecycle-and-remediation
        method: test
        intent: "Keep open fixable errors blocking until actually fixed or waived."
        observable: "Separate fields and deterministic policy derivation."
      - case_id: CR14-107
        scenario_id: independent-finding-lifecycle-and-remediation
        method: test
        intent: "Give every profile finding deterministic location evidence usable by differential continuity."
        observable: "Schema 1.6 preserves exact adapter endpoints or emits a whole-physical-line UTF-8-byte fallback, binds raw coordinate conversion, and types selector/non-source findings outside source pairing; invalid location evidence cannot be guessed."
      - case_id: CR14-090
        scenario_id: independent-finding-lifecycle-and-remediation
        method: test
        intent: "Prevent a matched fingerprint with changed severity from being treated as unchanged."
        observable: "Identity matching is followed by normalized severity and blocking-input comparison; any unclassified transition retains both observations as UNKNOWN and blocks strict PASS."
      - case_id: CR14-096
        scenario_id: independent-finding-lifecycle-and-remediation
        method: test
        intent: "Prevent any path-dependent analyzer behavior from turning a disappearance across a rename into a claimed fix."
        observable: "Under rename-fix-policy-v1 every base finding missing across a one-to-one rename is UNKNOWN regardless of file-byte changes; matching findings may remain unchanged, head-only findings may be introduced, and no semantic-subject inference exists."
  openspec:code-review-14-scope-truth-and-differential-enforcement:review-cli-contracts:truthful-review-assurance-status:
    rationale: "Unknown and not-applicable are not green passes."
    stakeholder_refs:
      - "nold-ai/specfact-cli#665"
    touchpoints:
      - id: review-report-status
        kind: planned_schema
        locator: "ReviewReport"
    verification_cases:
      - case_id: CR14-004
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Expose PASS, FAIL, UNKNOWN, and NOT_APPLICABLE with analyzer coverage."
        observable: "No all-passed summary when mandatory evidence is skipped or unknown."
      - case_id: CR14-008
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Dual-write schema 1.6 assurance into the closed legacy verdict, normalized enforcement-mode, and exit-code projection."
        observable: "UNKNOWN is never green; old reports cannot imply UNKNOWN/NOT_APPLICABLE; malformed 1.6 reports cannot pass."
      - case_id: CR14-045
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Resolve concurrent valid blocking evidence and required uncertainty without losing either fact."
        observable: "Only blockers remaining open after differential classification make aggregate FAIL; exact fixed baseline-only FAIL/head-PASS evidence is retained but excluded; concurrent required uncertainty remains present and signed compatibility/ledger consumers preserve the same precedence."
      - case_id: CR14-030
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Publish one signed machine-readable compatibility matrix before any core consumer adoption."
        observable: "Four canonical statuses bind legacy projections, strict/shadow exits, runtime-trust fields, and static accepted/rejected envelope fixtures; the exact schema-less ledger input maps to legacy schema 1.0/reward 5/PASS/exit 0 with preserved fields and no inferred authoritative status; hostile-candidate policy is UNKNOWN and mismatches are invalid. The module proves matrix integrity only; core runtime consumers must pass this exact digest in their own adoption tests."
      - case_id: CR14-013
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Preserve schema 1.6 truth through every post-analysis enrichment path."
        observable: "Cleanup forecast refresh retains schema, authoritative assurance, scope/analyzer evidence, legacy projection, and exit code unchanged."
      - case_id: CR14-025
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Attach validated Requirements context without downgrading the Code Review report schema."
        observable: "Requirements attachment preserves schema 1.6 assurance, scope/analyzer evidence, legacy projection, and exit code while adding only its context."
      - case_id: CR14-070
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Prevent the modules repository staged consumer from turning schema 1.6 UNKNOWN into a green hook result."
        observable: "Schema 1.6 authoritative assurance_status/ci_exit_code bypass legacy changed-line recomputation; UNKNOWN remains non-zero outside shadow even without a staged-line blocker, while old reports retain compatibility behavior."
      - case_id: CR14-071
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Prove every core version admitted by release metadata has immutable install, load, and schema evidence; the first C14 release admits only exact core 0.56.0."
        observable: "A fresh environment uses the checkpointed immutable core 0.56.0 tag/commit/tree plus candidate module package and exercises every consumer-matrix status/projection; only core_compatibility ===0.56.0 is permitted. Ordinary ==0.56.0, a local/alternate alias such as 0.56.0+vendor, a range, wildcard, untested identity, missing identity, branch fallback, install/load failure, or mismatch blocks release without claiming protected PR assurance."
      - case_id: CR14-128
        scenario_id: truthful-review-assurance-status
        method: test
        intent: "Reject PEP 440 local-version aliases that ordinary equality would admit without immutable smoke evidence."
        observable: "The release validator accepts only strict core_compatibility ===0.56.0 for the frozen identity and rejects ==0.56.0, 0.56.0+vendor, wildcards, ranges, and alternate strings."
  openspec:code-review-14-scope-truth-and-differential-enforcement:review-cli-contracts:review-cli-contracts-cover-explicit-scope-and-differential-evidence:
    rationale: "The public CLI contract must prove every explicit scope and differential evidence path."
    stakeholder_refs:
      - "nold-ai/specfact-cli#665"
      - "nold-ai/specfact-cli#671"
    touchpoints:
      - id: review-cli-contract-fixtures
        kind: planned_component
        locator: "tests/cli-contracts/specfact-code-review-run.scenarios.yaml"
    verification_cases:
      - case_id: CR14-005
