  openspec:code-review-14-scope-truth-and-differential-enforcement:review-run-command:differential-base-head-enforcement:
    rationale: Introduced findings require symmetric base/head evidence, not changed-line coincidence.
    stakeholder_refs:
    - nold-ai/specfact-cli#671
    touchpoints:
    - id: review-differential-runner
      kind: planned_component
      locator: specfact-code-review differential runner
    verification_cases:
    - case_id: CR14-002
      scenario_id: differential-base-head-enforcement
      method: test
      intent: Classify introduced, fixed, unchanged, and unknown findings only under identical immutable analyzer/toolchain/policy/config
        identities.
      observable: Introduced blockers block even away from added lines; baseline failures or analyzer-identity mismatch remain
        unknown.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_differential.py::test_unchanged_baseline_inline_suppression_is_retained
      implementation_task: '3.20'
    - case_id: CR14-010
      scenario_id: differential-base-head-enforcement
      method: test
      intent: Use the resolved merge-base rather than an advanced base-ref tip as the differential baseline.
      observable: Target-only post-divergence findings are not misclassified as feature-branch changes.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_differential.py::test_range_differential_uses_merge_base_snapshot_when_base_tip_advanced
      implementation_task: '3.20'
    - case_id: CR14-012
      scenario_id: differential-base-head-enforcement
      method: test
      intent: Normalize stable file anchors through deterministic tree-derived exact renames before base/head fingerprint
        comparison.
      observable: A unique identical-blob move retains the blocker as unchanged while both paths and canonical-exact-rename-v1
        evidence remain bound.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_differential.py::test_pure_rename_preserves_unchanged_fingerprint
      implementation_task: '3.20'
    - case_id: CR14-141
      scenario_id: differential-base-head-enforcement
      method: test
      intent: Make rename-sensitive classification independent of ambient Git rename settings and heuristic thresholds.
      observable: Producer and consumer derive raw add/delete facts from captured trees, uniquely pair identical blob IDs,
        make duplicate-object groups UNKNOWN, and bind the same digest; diff.renames/threshold/limit changes have no effect,
        and modified delete/add cannot claim fixed.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_differential.py::test_modified_delete_add_cannot_claim_fixed
      implementation_task: '3.20'
    - case_id: CR14-067
      scenario_id: differential-base-head-enforcement
      method: test
      intent: Prevent candidate-added inline suppressions from masquerading as repaired analyzer findings.
      observable: "The signed comment-token registry\u2014including Ruff's complete pinned noqa/ignore/file-ignore/disable/enable\
        \ grammar and every isort action in both accepted prefix families, Pylint disable-all/legacy disable-msg/atomic skip-file,\
        \ basedpyright basic/standard mode directives, and the complete pinned CrossHair source-directive catalog\u2014makes\
        \ new/changed/relocated directives always-open class-specific blockers (`introduced_inline_suppression` or `introduced_analyzer_result_control`),\
        \ changes affected missing base findings to unknown rather than fixed, rejects any purported waiver/trusted flag because\
        \ CR14 has no authenticated ingestion path, retains pure-rename/unchanged controls, and fails UNKNOWN on manifest\
        \ or directive-catalog parity uncertainty."
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_differential.py::test_ruff_ignore_file_ignore_disable_enable_catalog_blocks_before_fixed_classification[ruff-disable]
      implementation_task: '3.20'
    - case_id: CR14-142
      scenario_id: differential-base-head-enforcement
