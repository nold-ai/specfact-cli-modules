        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Use only metadata that a real marketplace installation persists when authenticating built-in code."
        observable: "The installed-payload contract succeeds with module name/version, deterministic full-payload checksum/signature, loader origin/root, and protected key identity, and requires no unavailable source commit/tree or archive metadata; missing or mismatched real fields are UNKNOWN."
  openspec:code-review-14-scope-truth-and-differential-enforcement:review-finding-model:ledger-preserves-authoritative-assurance-status:
    rationale: "A first-party consumer must not turn UNKNOWN or NOT_APPLICABLE compatibility projections into passing reward events."
    stakeholder_refs:
      - "nold-ai/specfact-cli#665"
      - "nold-ai/specfact-cli#671"
    touchpoints:
      - id: review-ledger-assurance
        kind: planned_component
        locator: "specfact-code-review ledger client"
    verification_cases:
      - case_id: CR14-011
        scenario_id: ledger-preserves-authoritative-assurance-status
        method: test
        intent: "Persist schema 1.6 assurance directly and keep UNKNOWN/NOT_APPLICABLE neutral for rewards and streaks."
        observable: "Neutral states persist canonical report_json/report_digest without coins, pass bonuses, block penalties, or streak changes; legacy records remain readable."
      - case_id: CR14-046
        scenario_id: ledger-preserves-authoritative-assurance-status
        method: test
        intent: "Preserve deterministic mixed FAIL/UNKNOWN precedence at the ledger boundary."
        observable: "The ledger consumes aggregate FAIL and its normal blocking policy while canonical report evidence retains has_unknown_required_evidence plus every UNKNOWN member diagnostic."

