      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_scope.py::test_index_scope_imports_dependency_from_complete_index_tree
      implementation_task: '3.3'
    - case_id: CR14-137
      scenario_id: explicit-review-scope-evidence
      method: test
