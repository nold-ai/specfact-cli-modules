        observable: "The generated projection binds and clears per-file-ignores plus extend-per-file-ignores while retaining other authorized rules; added/renamed eligible files remain invoked, and a non-empty effective map, ineffective transform, or catalog drift is UNKNOWN."
      - case_id: CR14-088
