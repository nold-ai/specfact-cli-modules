        method: test
        intent: "Classify a complete below-threshold coverage result as semantic failure rather than infrastructure uncertainty."
        observable: "A valid measured result below the sealed threshold is ran/FAIL with threshold and measurement evidence; baseline fail/head pass is fixed, while missing or unreconciled coverage is error/UNKNOWN."
      - case_id: CR14-020
        scenario_id: mandatory-analyzer-coverage
        method: test
        intent: "Represent targeted pytest/coverage as a conditional pr-range-v1 member with exact per-selector execution truth."
        observable: "Only exactly-once all-selected-passed head outcomes satisfy coverage; assertion/skip/xfail/xpass is FAIL; missing/duplicate/deselected/reconciliation/infrastructure/coverage failures are UNKNOWN."
      - case_id: CR14-031
        scenario_id: mandatory-analyzer-coverage
