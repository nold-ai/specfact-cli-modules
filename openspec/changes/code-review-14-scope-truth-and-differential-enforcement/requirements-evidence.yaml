      observable: Staged selection and complete index tree/path/blob/content identities are distinct evidence; caller-worktree
        bytes cannot affect findings, imports, score, or status.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_scope.py::test_index_scope_reads_staged_blobs_not_unstaged_worktree
      implementation_task: '3.3'
    - case_id: CR14-037
