  ? openspec:code-review-14-scope-truth-and-differential-enforcement:review-finding-model:independent-finding-lifecycle-and-remediation
  : rationale: Severity, resolution, autofix availability, and policy are distinct facts.
    stakeholder_refs:
    - nold-ai/specfact-cli#671
    touchpoints:
    - id: review-finding-schema
      kind: planned_schema
      locator: ReviewFinding
    verification_cases:
    - case_id: CR14-003
      scenario_id: independent-finding-lifecycle-and-remediation
      method: test
      intent: Keep open fixable errors blocking until actually fixed or waived.
      observable: Separate fields and deterministic policy derivation.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_findings.py::test_fixable_error_remains_blocking_until_applied
      implementation_task: '3.21'
    - case_id: CR14-107
      scenario_id: independent-finding-lifecycle-and-remediation
      method: test
      intent: Give every profile finding deterministic location evidence usable by differential continuity.
      observable: Schema 1.6 preserves exact adapter endpoints or emits a whole-physical-line UTF-8-byte fallback, binds raw
        coordinate conversion, and types selector/non-source findings outside source pairing; invalid location evidence cannot
        be guessed.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/tools/test_ruff_runner.py::test_ruff_fix_only_cannot_hide_unfixable_finding
      implementation_task: '3.15'
    - case_id: CR14-090
      scenario_id: independent-finding-lifecycle-and-remediation
      method: test
      intent: Prevent a matched fingerprint with changed severity from being treated as unchanged.
      observable: Identity matching is followed by normalized severity and blocking-input comparison; any unclassified transition
        retains both observations as UNKNOWN and blocks strict PASS.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_differential.py::test_suppression_waiver_input_is_unsupported_in_cr14
      implementation_task: '3.20'
    - case_id: CR14-096
      scenario_id: independent-finding-lifecycle-and-remediation
      method: test
      intent: Prevent any path-dependent analyzer behavior from turning a disappearance across a rename into a claimed fix.
      observable: Under canonical-exact-rename-v1 and rename-fix-policy-v1 every base finding missing across a unique identical-blob
        move is UNKNOWN; a deleted-path finding is also UNKNOWN when any unpaired governed addition exists, while matching
        exact-move findings may remain unchanged and no heuristic/semantic-subject inference exists.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_scorer.py::test_score_review_single_fixable_error
      implementation_task: '3.21'
    - case_id: CR14-SEL-1123
      scenario_id: independent-finding-lifecycle-and-remediation
      method: test
      intent: Execute the accepted C14 scenario test_report_binds_suppression_catalog_identity.
      observable: The exact collected pytest selector enforces its accepted red-to-green contract.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_findings.py::test_report_binds_suppression_catalog_identity
      implementation_task: '3.22'
  openspec:code-review-14-scope-truth-and-differential-enforcement:review-cli-contracts:truthful-review-assurance-status:
    rationale: Unknown and not-applicable are not green passes.
    stakeholder_refs:
    - nold-ai/specfact-cli#665
    touchpoints:
    - id: review-report-status
      kind: planned_schema
      locator: ReviewReport
    verification_cases:
    - case_id: CR14-004
      scenario_id: truthful-review-assurance-status
      method: test
      intent: Expose PASS, FAIL, UNKNOWN, and NOT_APPLICABLE with analyzer coverage.
      observable: No all-passed summary when mandatory evidence is skipped or unknown.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_findings.py::test_report_never_says_all_passed_with_mandatory_unknown
      implementation_task: '3.22'
    - case_id: CR14-008
      scenario_id: truthful-review-assurance-status
      method: test
      intent: Dual-write schema 1.6 assurance into the closed legacy verdict, normalized enforcement-mode, and exit-code projection.
      observable: UNKNOWN is never green; old reports cannot imply UNKNOWN/NOT_APPLICABLE; malformed 1.6 reports cannot pass.
      selector:
        runner: pytest
        node_id: tests/unit/specfact_code_review/run/test_findings.py::test_schema_1_6_assurance_status_legacy_projection_and_exit_matrix[FAIL-full-FAIL-1]
      implementation_task: '3.22'
    - case_id: CR14-045
      scenario_id: truthful-review-assurance-status
      method: test
