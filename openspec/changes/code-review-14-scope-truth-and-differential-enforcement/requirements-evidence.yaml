        observable: "Initial pr-range-v1 rejects non-empty target path-scoped strict and executionEnvironments before launch, emits empty strict only after proving the target array absent/canonically empty, preserves exact global checking/diagnostic settings, and prevents same-path or renamed strict diagnostics from disappearing into PASS."
      - case_id: CR14-123
        scenario_id: mandatory-analyzer-coverage
