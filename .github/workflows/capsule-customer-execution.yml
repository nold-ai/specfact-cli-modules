          def bounded_source(path, limit):
              descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  before = os.fstat(descriptor)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_size > limit:
                      raise ValueError("source bound")
                  with os.fdopen(descriptor, "rb", closefd=False) as stream:
                      data = stream.read(limit + 1)
                  after = os.fstat(descriptor)
                  identity = lambda value: (value.st_dev, value.st_ino, value.st_size, value.st_mtime_ns, value.st_ctime_ns, value.st_mode, value.st_nlink)
                  if len(data) > limit or len(data) != before.st_size or identity(before) != identity(after):
                      raise ValueError("source changed")
                  return data
              finally:
                  os.close(descriptor)


          def same_code(left, right, budget=None, depth=0):
              if budget is None:
                  budget = [100000]
              budget[0] -= 1
              if budget[0] < 0 or depth > 64 or type(left) is not type(right):
                  return False
              if isinstance(left, types.CodeType):
                  fields = ("co_argcount", "co_posonlyargcount", "co_kwonlyargcount", "co_nlocals", "co_stacksize", "co_flags",
                      "co_code", "co_consts", "co_names", "co_varnames", "co_filename", "co_name", "co_qualname", "co_firstlineno",
                      "co_linetable", "co_exceptiontable", "co_freevars", "co_cellvars")
                  return all(same_code(getattr(left, field), getattr(right, field), budget, depth + 1) for field in fields)
              if isinstance(left, tuple):
                  return len(left) == len(right) and all(same_code(a, b, budget, depth + 1) for a, b in zip(left, right))
              if isinstance(left, frozenset):
                  return len(left) == len(right) and all(any(same_code(a, b, budget, depth + 1) for b in right) for a in left)
              if isinstance(left, float):
                  return struct.pack("!d", left) == struct.pack("!d", right)
              if isinstance(left, complex):
                  return struct.pack("!dd", left.real, left.imag) == struct.pack("!dd", right.real, right.imag)
              return type(left) in (str, bytes, int, bool, type(None), type(Ellipsis)) and left == right


          def admitted_functions(module, authenticated, package):
              try:
                  if authenticated is None or type(module) is not types.ModuleType:
                      return None
                  filename = str((package / RUNNER_ENTRY).resolve())
                  if module.__name__ != "specfact_code_review.run.runner" or module.__file__ != filename or module.__spec__.origin != filename:
                      return None
                  source = authenticated["runner_source"]
                  compiled = compile(source, filename, "exec", dont_inherit=True, optimize=sys.flags.optimize)
                  parsed = ast.parse(source, filename)
                  originals = {}
                  for name in HOST_STAGES:
                      codes = [item for item in compiled.co_consts if type(item) is types.CodeType and item.co_name == name]
                      nodes = [item for item in parsed.body if isinstance(item, ast.FunctionDef) and item.name == name]
                      function = module.__dict__.get(name)
                      if len(codes) != 1 or len(nodes) != 1 or type(function) is not types.FunctionType:
                          return None
                      node = nodes[0]
                      defaults = tuple(ast.literal_eval(value) for value in node.args.defaults) or None
                      keywords = {arg.arg: ast.literal_eval(value) for arg, value in zip(node.args.kwonlyargs, node.args.kw_defaults) if value is not None} or None
                      if (node.decorator_list or function.__closure__ is not None or function.__globals__ is not module.__dict__
                          or function.__module__ != module.__name__ or function.__name__ != name or function.__qualname__ != name
                          or not same_code(function.__code__, codes[0]) or not same_code(function.__defaults__, defaults)
                          or (function.__kwdefaults__ is None) != (keywords is None)
                          or not same_code(tuple(sorted((function.__kwdefaults__ or {}).items())), tuple(sorted((keywords or {}).items())))):

                          return None
                      originals[name] = function
                  return originals
              except (OSError, ValueError, TypeError, KeyError, AttributeError, SyntaxError, RecursionError):
                  return None


          def unique_record(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate key")
                  result[key] = value
              return result


          class HostObservation:
              def __init__(self, module, originals, receipt, binding):
                  self.module, self.originals, self.receipt, self.binding = module, originals, receipt, binding
                  self.wrappers, self.stack, self.sides = {}, [], {}
                  self.identities = {name: (function.__code__, function.__defaults__, tuple(sorted((function.__kwdefaults__ or {}).items())))
                      for name, function in originals.items()}
                  self.lost, self.sequence, self.ordinal = False, 0, 0
                  self.descriptor = os.open(receipt, os.O_CREAT | os.O_EXCL | os.O_WRONLY | os.O_NOFOLLOW, 0o600)
                  os.set_inheritable(self.descriptor, False)
                  value = os.fstat(self.descriptor)
                  if not stat.S_ISREG(value.st_mode) or value.st_nlink != 1:
                      os.close(self.descriptor)
                      raise ValueError("receipt identity")

              def emit(self, event, call, stage="UNAVAILABLE", member="UNAVAILABLE", side="UNAVAILABLE"):
                  if self.lost:
                      return
                  try:
                      row = {"sequence": self.sequence + 1, "call": call, "event": event, "stage": stage,
                          "member": member, "side": side, "binding": self.binding}
                      data = (json.dumps(row, sort_keys=True, separators=(",", ":")) + "\n").encode()
                      if self.sequence >= 128 or len(data) > 1024 or os.write(self.descriptor, data) != len(data):
                          self.lost = True
                          return
                      self.sequence += 1
                  except BaseException:
                      self.lost = True

              def fields(self, name, args, kwargs):
                  member, side = "UNAVAILABLE", "UNAVAILABLE"
                  if name in ("_dispatch_capsule_member", "_execute_capsule_member"):
                      request = args[0] if args else kwargs["request"]
                      if type(request.member) is str and request.member in HOST_MEMBERS:
                          member = request.member
                      side = self.sides.get(request.snapshot_root.resolve(), "UNAVAILABLE")
                      if name == "_execute_capsule_member":
                          sources = [request.runtime.root, request.snapshot_root, *request.config_roots]
                          if request.project_runtime_root is not None:
                              sources.append(request.project_runtime_root)
                          sources.append(Path(os.environ["TMPDIR"]))
                          private = self.receipt.parent.resolve()
                          if any(private.is_relative_to(Path(source).resolve()) or Path(source).resolve().is_relative_to(private) for source in sources):
                              self.lost = True
                              self.receipt.unlink()
                  return member, side

              def wrapper(self, name, original):
                  def observed(*args, **kwargs):
                      entered, call, member, side = False, 0, "UNAVAILABLE", "UNAVAILABLE"
                      previous_sides = self.sides
                      try:
                          for alias, function in self.originals.items():
                              code, defaults, keywords = self.identities[alias]
                              if (getattr(self.module, alias) is not self.wrappers.get(alias)
                                  or function.__code__ is not code or function.__defaults__ is not defaults
                                  or not same_code(tuple(sorted((function.__kwdefaults__ or {}).items())), keywords)):
                                  self.lost = True
                          if not self.lost:
                              if len(self.stack) >= 16:
                                  self.lost = True
                              else:
                                  if name == "_run_bound_snapshot_pair":
                                      base = args[3] if len(args) > 3 else kwargs["base"]
                                      head = args[4] if len(args) > 4 else kwargs["head"]
                                      self.sides = {base.root.resolve(): "base", head.root.resolve(): "head"}
                                  member, side = self.fields(name, args, kwargs)
                                  self.ordinal += 1
                                  call = self.ordinal
                                  self.stack.append(call)
                                  entered = True
                                  self.emit("enter", call, HOST_STAGES[name], member, side)
                      except BaseException:
                          self.lost = True
                      try:
                          return original(*args, **kwargs)
                      finally:
                          try:
                              if entered:
                                  if not self.stack or self.stack.pop() != call:
                                      self.lost = True
                                  self.emit("leave", call, HOST_STAGES[name], member, side)
                              self.sides = previous_sides
                          except BaseException:
                              self.lost = True
                  return observed

              def install(self):
                  try:
                      for name, original in self.originals.items():
                          if getattr(self.module, name) is not original:
                              raise ValueError("alias changed")
                          wrapper = self.wrapper(name, original)
                          self.wrappers[name] = wrapper
                          setattr(self.module, name, wrapper)
                  except BaseException:
                      self.lost = True
                      self.restore()

              def restore(self):
                  for name, wrapper in self.wrappers.items():
                      try:
                          if getattr(self.module, name) is wrapper:
                              setattr(self.module, name, self.originals[name])
                          else:
                              self.lost = True
                      except BaseException:
                          self.lost = True

              def finish(self):
                  self.restore()
                  if self.stack:
                      self.lost = True
                  self.emit("complete", 0)
                  try:
                      os.close(self.descriptor)
                  except BaseException:
                      self.lost = True


          def start_observation(module, authenticated, package, controller):
              try:
                  root = controller.parent
                  manifest = json.loads(bounded_source(root / "observation-private/invocation.json", 4096), object_pairs_hook=unique_record)
                  if set(manifest) != {"head", "workflow_blob", "controller_sha256", "role", "attempt"}:
                      return None
                  if (manifest["role"] != "independent" or type(manifest["attempt"]) is not str
                      or not 1 <= len(manifest["attempt"]) <= 128 or any(c not in "0123456789:" for c in manifest["attempt"])):
                      return None
                  if any(type(manifest[key]) is not str or len(manifest[key]) != length or any(c not in "0123456789abcdef" for c in manifest[key])
                      for key, length in (("head", 40), ("workflow_blob", 40), ("controller_sha256", 64))):
                      return None
                  if hashlib.sha256(bounded_source(controller, 2 * 1024 * 1024)).hexdigest() != manifest["controller_sha256"]:
                      return None
                  originals = admitted_functions(module, authenticated, package)
                  if originals is None:
                      return None
                  private = root / "observation-private"
                  if private.is_symlink() or private.stat().st_mode & 0o777 != 0o700:
                      return None
                  binding = {**manifest, "payload_sha256": authenticated["payload_sha256"], "runner_sha256": authenticated["runner_sha256"]}
                  observer = HostObservation(module, originals, private / "receipt.jsonl", binding)
                  observer.install()
                  return observer
              except BaseException:
                  return None

          def authenticated_reviewer_source(package):
              try:
                  paths = list(islice(package.rglob("*"), 2049))
                  if package.is_symlink() or len(paths) > 2048 or any(path.is_symlink() for path in paths):
                      return None
                  if sum(path.stat().st_size for path in paths if path.is_file()) > 32 * 1024 * 1024:
                      return None
                  manifest = package / "module-package.yaml"
                  if manifest.stat().st_size > 256 * 1024:
                      return None
                  metadata = yaml.safe_load(bounded_source(manifest, 256 * 1024))
                  key = bounded_source(_bundled_public_key_path(), 16384)
                  if hashlib.sha256(key).hexdigest() != TRUSTED_KEY_SHA256:
                      return None
                  payload = _module_artifact_payload_stable(package)
                  integrity = metadata["integrity"]
                  digest = hashlib.sha256(payload).hexdigest()
                  if metadata["version"] != EXPECTED_REVIEWER_VERSION or digest != EXPECTED_REVIEWER_PAYLOAD:
                      return None
                  if integrity["checksum"] != "sha256:" + digest or not verify_signature(payload, integrity["signature"], key.decode()):
                      return None
                  entries = dict(line.rsplit(":", 1) for line in payload.decode().splitlines())
                  source = bounded_source(package / ADAPTER_ENTRY, 1024 * 1024)
                  adapter = hashlib.sha256(source).hexdigest()
                  if len(source) > 1024 * 1024 or entries.get(ADAPTER_ENTRY) != adapter:
                      return None
                  runner_source = bounded_source(package / RUNNER_ENTRY, 2 * 1024 * 1024)
                  runner_digest = hashlib.sha256(runner_source).hexdigest()
                  if entries.get(RUNNER_ENTRY) != runner_digest:
                      return None
                  return {"payload_sha256": digest, "adapter_sha256": adapter, "runner_source": runner_source, "runner_sha256": runner_digest}
              except (OSError, ValueError, TypeError, KeyError, UnicodeError, yaml.YAMLError):
                  return None


