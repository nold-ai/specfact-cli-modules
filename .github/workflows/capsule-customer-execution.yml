# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: capsule-customer-execution

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - registry/**
  workflow_dispatch:
    inputs:
      hook_snapshot:
        description: 'Optional reviewed PR478 snapshot JSON; developer hooks only, never customer acceptance'
        required: false
        type: string
        default: ''
      basedpyright_diagnostic:
        description: 'Replay incomplete basedpyright with the verified review runtime; diagnostic only'
        required: false
        type: boolean
        default: false
      review_timing_diagnostic:
        description: 'Time exact cached preparation and a separate failed review replay; diagnostic only'
        required: false
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: capsule-customer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  customer:
    if: ${{ inputs.hook_snapshot == '' }}
    name: capsule-${{ github.event_name == 'pull_request' && 'candidate' || 'public' }} (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      MATRIX_PYTHON: ${{ matrix.python }}
      RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
      MODE: ${{ github.event_name == 'pull_request' && 'candidate' || 'public' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Checkout published registry baseline for candidate installation
        if: github.event_name == 'pull_request'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: nold-ai/specfact-cli-modules
          ref: main
          path: .customer-published-registry
          sparse-checkout: registry
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared external corpus native requirements
        run: sudo apt-get update && sudo apt-get install -y libodbc2 bubblewrap
      - name: Prepare fresh customer-owned installation
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          CUSTOMER_ROOT="$RUNNER_TEMP/specfact-customer-$MATRIX_PYTHON"
          echo "CUSTOMER_ROOT=$CUSTOMER_ROOT" >> "$GITHUB_ENV"
          echo "SPECFACT_CODE_REVIEW_CAPSULE_CACHE=$CUSTOMER_ROOT/cache" >> "$GITHUB_ENV"
          mkdir -p "$CUSTOMER_ROOT/home" "$CUSTOMER_ROOT/tmp"
          echo "HOME=$CUSTOMER_ROOT/home" >> "$GITHUB_ENV"
          echo "TMPDIR=$CUSTOMER_ROOT/tmp" >> "$GITHUB_ENV"
          python -m venv "$CUSTOMER_ROOT/venv"
          "$CUSTOMER_ROOT/venv/bin/pip" install --no-cache-dir specfact-cli==0.55.4
          echo "$CUSTOMER_ROOT/venv/bin" >> "$GITHUB_PATH"
      - name: Install official signed module anonymously
        shell: bash
        run: |
          set -euo pipefail
          INSTALLATION_REPOSITORY="$GITHUB_WORKSPACE"
          if [ "$MODE" = "candidate" ]; then
            INSTALLATION_REPOSITORY="$GITHUB_WORKSPACE/.customer-published-registry"
          fi
          EXPECTED_MODULE_VERSION="$(python scripts/capsule_customer_gate.py \
            --repository "$INSTALLATION_REPOSITORY" --evidence "$CUSTOMER_ROOT/installation-evidence" \
            --mode "$MODE" --installation-version)"
          cd "$CUSTOMER_ROOT"
          env -i HOME="$HOME" TMPDIR="$TMPDIR" \
            PATH="$CUSTOMER_ROOT/venv/bin:/usr/bin:/bin" SPECFACT_MODULES_BRANCH=main \
            "$CUSTOMER_ROOT/venv/bin/specfact" module install nold-ai/specfact-code-review --scope user \
            --version "$EXPECTED_MODULE_VERSION" --source marketplace
          python "$GITHUB_WORKSPACE/scripts/capsule_customer_gate.py" \
            --repository "$INSTALLATION_REPOSITORY" --evidence "$CUSTOMER_ROOT/installation-evidence" \
            --mode "$MODE" --verify-installation
          specfact --version > "$CUSTOMER_ROOT/installed-core.txt"
          specfact module list > "$CUSTOMER_ROOT/installed-modules.txt"
          python -m pip freeze > "$CUSTOMER_ROOT/installed-python.txt"
      - name: Prepare candidate source (never public acceptance)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/link_dev_module.py specfact-code-review --shadow-root "$CUSTOMER_ROOT/candidate-modules"
          echo "SPECFACT_MODULES_ROOTS=$CUSTOMER_ROOT/candidate-modules" >> "$GITHUB_ENV"
          echo "SPECFACT_ALLOW_UNSIGNED=1" >> "$GITHUB_ENV"
      - name: Verify denied namespaces fail closed before administrator setup
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN PYTHONPATH
          SPECFACT_CODE_REVIEW_CAPSULE_CACHE="$CUSTOMER_ROOT/denied-cache" \
            python scripts/capsule_customer_gate.py \
              --repository "$GITHUB_WORKSPACE" \
              --evidence "$CUSTOMER_ROOT/denied-evidence" --mode "$MODE" \
              --expect-namespace-denial
      - name: Allow user namespaces for this job's capsule launcher only
        shell: bash
        run: |
          set -euo pipefail
          # Administrator prerequisite only: all installation and analysis runs as the runner user.
          # Keep Ubuntu's global AppArmor namespace restriction enabled.
          sudo install -d -o root -g root -m 0755 /specfact-corpus-offline
          sudo install -o root -g root -m 0555 /usr/bin/bwrap /specfact-corpus-offline/bwrap
          sha256sum /usr/bin/bwrap | cut -d ' ' -f 1 | sudo tee /specfact-corpus-offline/bwrap.sha256 > /dev/null
          sudo chmod 0444 /specfact-corpus-offline/bwrap.sha256
          echo "SPECFACT_CORPUS_OFFLINE_LAUNCHER=/specfact-corpus-offline/bwrap" >> "$GITHUB_ENV"
          profile="$CUSTOMER_ROOT/capsule-userns.apparmor"
          cat > "$profile" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile specfact-customer-capsule "$CUSTOMER_ROOT/cache/**/opt/specfact/bin/bwrap-static" flags=(unconfined) {
            userns,
          }
          profile specfact-customer-offline-network "/specfact-corpus-offline/bwrap" flags=(unconfined) {
            userns,
          }
          profile specfact-customer-capsule-umask "$CUSTOMER_ROOT/cache-077/**/opt/specfact/bin/bwrap-static" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "$profile"
      - name: Exercise cold and warm fixtures and modules repository
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN PYTHONPATH
          python scripts/capsule_customer_gate.py \
            --repository "$GITHUB_WORKSPACE" \
            --evidence "$CUSTOMER_ROOT/evidence" --mode "$MODE"
      - name: Validate pinned external Python corpus with automatic runtimes
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN PYTHONPATH
          python scripts/external_capsule_corpus.py --workspace "$CUSTOMER_ROOT/external"
      - name: Upload reports and exact installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capsule-${{ env.MODE }}-cp${{ matrix.python }}-${{ github.run_attempt }}
          path: |
            ${{ env.CUSTOMER_ROOT }}/evidence/
            ${{ env.CUSTOMER_ROOT }}/external/evidence/
            ${{ env.CUSTOMER_ROOT }}/denied-evidence/
            ${{ env.CUSTOMER_ROOT }}/installation-evidence/
            ${{ env.CUSTOMER_ROOT }}/installed-*.txt
            ${{ env.CUSTOMER_ROOT }}/capsule-userns.apparmor
          if-no-files-found: error
          retention-days: 14

  native-hooks:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.hook_snapshot != '' }}
    name: Native Linux exact-snapshot developer hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout reviewed transport controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: controls
          persist-credentials: false
      - name: Checkout immutable signed source baseline
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: efe7303efb32ac31379906a38e3f960ec4e7a744
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout paired core dependency
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: nold-ai/specfact-cli
          ref: 2f9567e28e98b082801b13ff02e863933ce2f0f2
          path: specfact-cli
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare ordinary developer environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          python -m pip install hatch icontract
          sudo apt-get update
          sudo apt-get install -y libodbc2 bubblewrap
          ROOT="$RUNNER_TEMP/native-hooks"
          mkdir -p "$ROOT/home" "$ROOT/tmp" "$ROOT/evidence"
          echo "HOOK_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "HOME=$ROOT/home" >> "$GITHUB_ENV"
          echo "TMPDIR=$ROOT/tmp" >> "$GITHUB_ENV"
          echo "SPECFACT_CODE_REVIEW_CAPSULE_CACHE=$ROOT/cache" >> "$GITHUB_ENV"
          echo "SPECFACT_CLI_REPO=$GITHUB_WORKSPACE/specfact-cli" >> "$GITHUB_ENV"
          echo "SPECFACT_MODULES_REPO=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"
          echo "PRE_COMMIT_HOME=$ROOT/pre-commit" >> "$GITHUB_ENV"
          echo "npm_config_cache=$ROOT/npm" >> "$GITHUB_ENV"
          cd source
          SPECFACT_CLI_REPO="$GITHUB_WORKSPACE/specfact-cli" hatch env create
          SPECFACT_CLI_REPO="$GITHUB_WORKSPACE/specfact-cli" hatch run dev-deps
          echo "$GITHUB_WORKSPACE/source/.venv/bin" >> "$GITHUB_PATH"
      - name: Install official signed portable runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOOK_ROOT"
          env -i HOME="$HOME" TMPDIR="$TMPDIR" PATH="$PATH" SPECFACT_MODULES_BRANCH=dev \
            "$GITHUB_WORKSPACE/source/.venv/bin/specfact" module install nold-ai/specfact-code-review \
            --scope user --version 0.50.0 --source marketplace > "$HOOK_ROOT/evidence/module-install.txt" 2>&1
          "$GITHUB_WORKSPACE/source/.venv/bin/specfact" module list > "$HOOK_ROOT/evidence/installed-modules.txt"
          python --version > "$HOOK_ROOT/evidence/python-version.txt"
          python -m pip freeze > "$HOOK_ROOT/evidence/installed-python.txt"
          git -C "$GITHUB_WORKSPACE/specfact-cli" rev-parse HEAD > "$HOOK_ROOT/evidence/core-sha.txt"
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["HOME"]) / ".specfact/modules"
          manifests = list(root.rglob("module-package.yaml"))
          if not manifests:
              raise SystemExit("Installed module manifests are missing")
          inventory = {
              str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
              for manifest in manifests
              for path in sorted(manifest.parent.rglob("*"))
              if path.is_file() and "__pycache__" not in path.parts
          }
          (Path(os.environ["HOOK_ROOT"]) / "evidence/installed-module-sha256.json").write_text(
              json.dumps(inventory, indent=2) + "\n", encoding="utf-8"
          )
          PYTHON
      - name: Permit namespaces for the sealed launcher only
        shell: bash
        run: |
          set -euo pipefail
          cat > "$HOOK_ROOT/capsule.apparmor" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile specfact-native-hooks "$HOOK_ROOT/cache/**/opt/specfact/bin/bwrap-static" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "$HOOK_ROOT/capsule.apparmor"
      - name: Run every unchanged hook against the exact snapshot
        env:
          HOOK_REQUEST: ${{ inputs.hook_snapshot }}
          BASEDPYRIGHT_DIAGNOSTIC: ${{ inputs.basedpyright_diagnostic }}
          REVIEW_TIMING_DIAGNOSTIC: ${{ inputs.review_timing_diagnostic }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$HOOK_REQUEST" > "$HOOK_ROOT/request.json"
          diagnostic_args=()
          if [ "$BASEDPYRIGHT_DIAGNOSTIC" = "true" ]; then
            diagnostic_args+=(--basedpyright-diagnostic)
          fi
          if [ "$REVIEW_TIMING_DIAGNOSTIC" = "true" ]; then
            diagnostic_args+=(--review-timing-diagnostic)
          fi
          python controls/scripts/native_hook_transport.py "${diagnostic_args[@]}" \
            --checkout "$GITHUB_WORKSPACE/source" --request "$HOOK_ROOT/request.json" \
            --evidence "$HOOK_ROOT/evidence"
      - name: Preserve exact receipt, real hook logs and review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-hooks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-hooks/evidence/
            ${{ runner.temp }}/native-hooks/capsule.apparmor
            source/.specfact/code-review.json
            source/.specfact/reports/
          if-no-files-found: error
          retention-days: 14
