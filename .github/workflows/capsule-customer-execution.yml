# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: capsule-customer-execution

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - registry/**
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: capsule-customer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  customer:
    name: capsule-${{ github.event_name == 'pull_request' && 'candidate' || 'public' }} (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      MATRIX_PYTHON: ${{ matrix.python }}
      RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
      MODE: ${{ github.event_name == 'pull_request' && 'candidate' || 'public' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout published registry baseline for candidate installation
        if: github.event_name == 'pull_request'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: nold-ai/specfact-cli-modules
          ref: main
          path: .customer-published-registry
          sparse-checkout: registry
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared external corpus native requirements
        run: sudo apt-get update && sudo apt-get install -y libodbc2 bubblewrap
      - name: Prepare fresh customer-owned installation
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          CUSTOMER_ROOT="$RUNNER_TEMP/specfact-customer-$MATRIX_PYTHON"
          echo "CUSTOMER_ROOT=$CUSTOMER_ROOT" >> "$GITHUB_ENV"
          echo "SPECFACT_CODE_REVIEW_CAPSULE_CACHE=$CUSTOMER_ROOT/cache" >> "$GITHUB_ENV"
          mkdir -p "$CUSTOMER_ROOT/home" "$CUSTOMER_ROOT/tmp"
          echo "HOME=$CUSTOMER_ROOT/home" >> "$GITHUB_ENV"
          echo "TMPDIR=$CUSTOMER_ROOT/tmp" >> "$GITHUB_ENV"
          python -m venv "$CUSTOMER_ROOT/venv"
          "$CUSTOMER_ROOT/venv/bin/pip" install --no-cache-dir specfact-cli==0.55.4
          echo "$CUSTOMER_ROOT/venv/bin" >> "$GITHUB_PATH"
      - name: Install official signed module anonymously
        shell: bash
        run: |
          set -euo pipefail
          INSTALLATION_REPOSITORY="$GITHUB_WORKSPACE"
          if [ "$MODE" = "candidate" ]; then
            INSTALLATION_REPOSITORY="$GITHUB_WORKSPACE/.customer-published-registry"
          fi
          EXPECTED_MODULE_VERSION="$(python scripts/capsule_customer_gate.py \
            --repository "$INSTALLATION_REPOSITORY" --evidence "$CUSTOMER_ROOT/installation-evidence" \
            --mode "$MODE" --installation-version)"
          cd "$CUSTOMER_ROOT"
          env -i HOME="$HOME" TMPDIR="$TMPDIR" \
            PATH="$CUSTOMER_ROOT/venv/bin:/usr/bin:/bin" SPECFACT_MODULES_BRANCH=main \
            "$CUSTOMER_ROOT/venv/bin/specfact" module install nold-ai/specfact-code-review --scope user \
            --version "$EXPECTED_MODULE_VERSION" --source marketplace
          python "$GITHUB_WORKSPACE/scripts/capsule_customer_gate.py" \
            --repository "$INSTALLATION_REPOSITORY" --evidence "$CUSTOMER_ROOT/installation-evidence" \
            --mode "$MODE" --verify-installation
          specfact --version > "$CUSTOMER_ROOT/installed-core.txt"
          specfact module list > "$CUSTOMER_ROOT/installed-modules.txt"
          python -m pip freeze > "$CUSTOMER_ROOT/installed-python.txt"
      - name: Prepare candidate source (never public acceptance)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/link_dev_module.py specfact-code-review --shadow-root "$CUSTOMER_ROOT/candidate-modules"
          echo "SPECFACT_MODULES_ROOTS=$CUSTOMER_ROOT/candidate-modules" >> "$GITHUB_ENV"
          echo "SPECFACT_ALLOW_UNSIGNED=1" >> "$GITHUB_ENV"
      - name: Verify denied namespaces fail closed before administrator setup
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN PYTHONPATH
          SPECFACT_CODE_REVIEW_CAPSULE_CACHE="$CUSTOMER_ROOT/denied-cache" \
            python scripts/capsule_customer_gate.py \
              --repository "$GITHUB_WORKSPACE" \
              --evidence "$CUSTOMER_ROOT/denied-evidence" --mode "$MODE" \
              --expect-namespace-denial
      - name: Allow user namespaces for this job's capsule launcher only
        shell: bash
        run: |
          set -euo pipefail
          # Administrator prerequisite only: all installation and analysis runs as the runner user.
          # Keep Ubuntu's global AppArmor namespace restriction enabled.
          sudo install -d -o root -g root -m 0755 /specfact-corpus-offline
          sudo install -o root -g root -m 0555 /usr/bin/bwrap /specfact-corpus-offline/bwrap
          sha256sum /usr/bin/bwrap | cut -d ' ' -f 1 | sudo tee /specfact-corpus-offline/bwrap.sha256 > /dev/null
          sudo chmod 0444 /specfact-corpus-offline/bwrap.sha256
          echo "SPECFACT_CORPUS_OFFLINE_LAUNCHER=/specfact-corpus-offline/bwrap" >> "$GITHUB_ENV"
          profile="$CUSTOMER_ROOT/capsule-userns.apparmor"
          cat > "$profile" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile specfact-customer-capsule "$CUSTOMER_ROOT/cache/**/opt/specfact/bin/bwrap-static" flags=(unconfined) {
            userns,
          }
          profile specfact-customer-commit-review "$CUSTOMER_ROOT/commit-review-cache/**/opt/specfact/bin/bwrap-static" flags=(unconfined) {
            userns,
          }
          profile specfact-customer-offline-network "/specfact-corpus-offline/bwrap" flags=(unconfined) {
            userns,
          }
          profile specfact-customer-capsule-umask "$CUSTOMER_ROOT/cache-077/**/opt/specfact/bin/bwrap-static" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "$profile"
      - name: Record kernel audit boundary privately
        if: github.event_name == 'pull_request' && matrix.python == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          audit_exit=0
          { sudo dmesg --color=never; } > "$CUSTOMER_ROOT/namespace-audit-baseline.private.log" \
            2> "$CUSTOMER_ROOT/namespace-audit-baseline.private.stderr" || audit_exit=$?
          echo "NAMESPACE_AUDIT_BASELINE_CAPTURED=$([ "$audit_exit" -eq 0 ] && echo 1 || echo 0)" >> "$GITHUB_ENV"
      - name: Run deferred candidate commit review without weakening enforcement
        id: deferred_review
        if: github.event_name == 'pull_request' && matrix.python == '3.12'
        shell: bash
        env:
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          unset GITHUB_TOKEN GH_TOKEN PYTHONPATH
          REVIEW_ROOT="$CUSTOMER_ROOT/staged-review"
          REVIEW_BASE="$(git merge-base "$CANDIDATE_HEAD" "$CANDIDATE_BASE")"
          git worktree add --detach "$REVIEW_ROOT" "$CANDIDATE_HEAD"
          git -C "$REVIEW_ROOT" reset --soft "$REVIEW_BASE"
          cd "$REVIEW_ROOT"
          review_paths=()
          while IFS= read -r -d '' path; do
            review_paths+=("$path")
          done < <(git diff --cached --name-only --diff-filter=ACMR -z)
          test "${#review_paths[@]}" -gt 0
          PROJECT_CONFIG="$CUSTOMER_ROOT/commit-review-project.toml"
          printf '%s\n' 'manager = "hatch"' 'environment = "default"' > "$PROJECT_CONFIG"
          # Provisioning is separate from the unchanged 300-second analysis budget.
          # Prepare the same bound base/index snapshots; customer cold cache stays empty.
          preparation_exit=0
          SPECFACT_CODE_REVIEW_CAPSULE_CACHE="$CUSTOMER_ROOT/commit-review-cache" \
            SPECFACT_MODULES_REPO="$GITHUB_WORKSPACE" \
            SPECFACT_CLI_MODULES_REPO="$GITHUB_WORKSPACE" \
            SPECFACT_MODULES_ROOTS="$GITHUB_WORKSPACE/packages" \
            PYTHONPATH="$GITHUB_WORKSPACE/packages/specfact-code-review/src" \
            "$CUSTOMER_ROOT/venv/bin/python" -I -c \
              'import subprocess,sys; sys.exit(subprocess.run(sys.argv[1:],timeout=1800,check=False).returncode)' \
              "$CUSTOMER_ROOT/venv/bin/python" -B -P -c \
              'import sys; from specfact_cli.cli import app; app(args=sys.argv[1:])' \
              code review runtime prepare --scope index --project-config "$PROJECT_CONFIG" --json \
              > "$CUSTOMER_ROOT/commit-review-preparation.private.json" || preparation_exit=$?
          if PREPARATION_COMMAND_SUCCEEDED="$([ "$preparation_exit" -eq 0 ] && echo 1 || echo 0)" \
            PREPARATION_REPORT="$CUSTOMER_ROOT/commit-review-preparation.private.json" \
            "$CUSTOMER_ROOT/venv/bin/python" -I - <<'PY_PREPARATION'
          import json
          import os
          from pathlib import Path

          present = {side: False for side in ("base", "head")}
          supplied = dict(present)
          outcome = "unreadable_report"
          try:
              with Path(os.environ["PREPARATION_REPORT"]).open("rb") as stream:
                  data = stream.read(2 * 1024 * 1024 + 1)
              if len(data) > 2 * 1024 * 1024:
                  outcome = "oversized_report"
              else:
                  result = json.loads(data)
                  if not isinstance(result, dict):
                      outcome = "invalid_report_shape"
                  elif result.get("status") == "NOT_APPLICABLE":
                      no_impact = (result.get("scope") == "index"
                          and result.get("diagnostic") == "no_governed_impact"
                          and result.get("runtimes") == {})
                      outcome = "not_applicable" if no_impact else "invalid_not_applicable"
                  else:
                      runtimes = result.get("runtimes", {})
                      for side in present:
                          value = runtimes.get(side, {}) if isinstance(runtimes, dict) else {}
                          descriptor = value.get("descriptor") if isinstance(value, dict) else None
                          supplied[side] = isinstance(descriptor, str) and bool(descriptor)
                          present[side] = supplied[side] and Path(descriptor).is_file() and not Path(descriptor).is_symlink()
                      outcome = "prepared" if all(present.values()) else "missing_descriptor_files" if all(supplied.values()) else "missing_descriptor_fields"
          except json.JSONDecodeError:
              outcome = "invalid_json"
          except (OSError, ValueError, KeyError):
              outcome = "unreadable_report"
          if outcome in {"prepared", "not_applicable"} and os.environ.get("PREPARATION_COMMAND_SUCCEEDED") != "1":
              outcome = "preparation_command_failed"
          accepted = outcome in {"prepared", "not_applicable"}
          status = "NOT_APPLICABLE" if outcome == "not_applicable" else "PREPARED" if accepted else "INCOMPLETE"
          print(json.dumps({"status": status, "phase": "index_preparation",
              "report_outcome": outcome, "base_descriptor_supplied": supplied["base"], "head_descriptor_supplied": supplied["head"],
              "base_descriptor_present": present["base"], "head_descriptor_present": present["head"]}))
          raise SystemExit(0 if accepted else 1)
          PY_PREPARATION
          then
            preparation_report_exit=0
          else
            preparation_report_exit=$?
          fi
          if [ "$preparation_exit" -ne 0 ]; then
            exit "$preparation_exit"
          fi
          if [ "$preparation_report_exit" -ne 0 ]; then
            exit "$preparation_report_exit"
          fi
          review_exit=0
          SPECFACT_CODE_REVIEW_CAPSULE_CACHE="$CUSTOMER_ROOT/commit-review-cache" \
            SPECFACT_CODE_REVIEW_SUBJECT_ROOT="$REVIEW_ROOT" \
            SPECFACT_CODE_REVIEW_PROJECT_CONFIG="$PROJECT_CONFIG" \
            SPECFACT_CODE_REVIEW_ENFORCEMENT=changed \
            "$CUSTOMER_ROOT/venv/bin/python" "$GITHUB_WORKSPACE/scripts/pre_commit_code_review.py" "${review_paths[@]}" || review_exit=$?
          if [ "$review_exit" -ne 0 ]; then
            # Print bounded codes/public locations; raw reports, receipts and logs stay private.
            REVIEW_PUBLIC_EXIT="$review_exit" "$CUSTOMER_ROOT/venv/bin/python" - <<'PY'
          import ast
          import re
          import json
          import os
          import subprocess
          from pathlib import Path

          report = Path(os.environ.get("REVIEW_PUBLIC_REPORT", ".specfact/code-review.json"))
          if os.environ.get("REVIEW_PUBLIC_EXIT") == "124":
              print(json.dumps({"status": "INCOMPLETE", "phase": "review", "diagnostic": "analysis_timeout"}))
          if not report.is_file() and os.environ.get("REVIEW_PUBLIC_EXIT") != "124":
              print(json.dumps({"status": "INCOMPLETE", "phase": "review", "diagnostic": "review_report_missing"}))
          if report.is_file():
              data = json.loads(report.read_text())
              public_analyzers = {"ruff", "radon", "semgrep-clean", "ai-bloat-ast", "ast-clean-code", "basedpyright", "pylint", "contracts", "semgrep-bugs", "targeted-pytest-coverage"}
              public_codes = {"analyzer_reported_incomplete_execution", "capsule_request_failed", "project_test_selection_ambiguous", "project_runtime_required", "project_pytest_coverage_missing", "analyzer_output_invalid", "timeout", "capsule_acquisition_failed", "native_capsule_artifact_not_admitted"}
              for row in data.get("analyzer_evidence", []):
                  if not isinstance(row, dict) or not isinstance(row.get("id"), str) or row["id"] not in public_analyzers:
                      continue
                  tokens = str(row.get("diagnostic", "")).split(":")[:3]
                  codes = [token for token in tokens if token in public_codes]
                  if codes:
                      print(json.dumps({"analyzer": row["id"], "diagnostic_codes": codes}))
              def _semgrep_error_types(message):
                  if len(message) > 4096 or "details=" not in message:
                      return []
                  try:
                      details = json.loads(message.rsplit("details=", 1)[1])
                  except (ValueError, TypeError, RecursionError):
                      return []
                  if not isinstance(details, list):
                      return []
                  allowed = {
                      "Lexical error", "Syntax error", "Other syntax error", "AST builder error",
                      "Rule parse error", "SemgrepWarning", "SemgrepError", "InvalidRuleSchemaError",
                      "UnknownLanguageError", "Invalid YAML", "Internal matching error",
                      "Semgrep match found", "Too many matches", "Fatal error", "Timeout",
                      "Out of memory", "Fixpoint timeout", "Stack overflow",
                      "Timeout during interfile analysis", "OOM during interfile analysis",
                      "Missing plugin", "Pattern parse error", "Incompatible rule",
                      "PatternParseError", "PartialParsing", "IncompatibleRule", "DependencyResolutionError",
                  }
                  tags = set()
                  for error in details[:3]:
                      if not isinstance(error, dict):
                          continue
                      value = error.get("type")
                      if isinstance(value, list) and value:
                          value = value[0]
                      if isinstance(value, str) and value in allowed:
                          tags.add(value)
                  return sorted(tags)

              test_failure_details = {}
              for analyzer in data.get("analyzer_evidence", []):
                  if not isinstance(analyzer, dict) or analyzer.get("id") != "targeted-pytest-coverage":
                      continue
                  for side in (analyzer.get("head"), analyzer, analyzer.get("base")):
                      execution = side.get("target_execution") if isinstance(side, dict) else None
                      records = execution.get("records", []) if isinstance(execution, dict) else []
                      if not isinstance(records, list):
                          continue
                      for record in records[:20_000]:
                          if not isinstance(record, dict):
                              continue
                          key = tuple(record.get(field) for field in ("nodeid", "outcome", "phase"))
                          detail = record.get("detail")
                          if all(isinstance(value, str) and len(value) <= 4096 for value in key) and isinstance(detail, str) and len(detail) <= 65_536:
                              test_failure_details.setdefault(key, detail)

              def _public_test_failure(nodeid, outcome, phase):
                  detail = test_failure_details.get((nodeid, outcome, phase), "")
                  exception = re.search(r"^E\s+(?:subprocess\.)?(AssertionError|FileNotFoundError|PermissionError|CalledProcessError|RuntimeError|ImportError|ModuleNotFoundError|TypeError|ValueError)(?=:|\s|$)", detail, re.MULTILINE)
                  failure = {"test_failure_class": exception.group(1)} if exception else {}
                  for option in ("-I", "-E", "-S"):
                      if "project_python_option_unsupported:" + option + ";" in detail:
                          failure.update(test_diagnostic="project_python_option_unsupported", python_option=option)
                          break
                  return failure

              source_test_functions = {}
              def _public_test_observation(finding, file):
                  message = finding.get("message")
                  if not isinstance(message, str) or len(message) > 4096:
                      return {}
                  match = re.fullmatch(r"Test (.+) (passed|failed|skipped) during (setup|call|teardown)( with an xfail marker)?\.", message)
                  if match is None:
                      return {}
                  nodeid, outcome, phase, xfail = match.groups()
                  observation = {"test_outcome": outcome, "test_phase": phase, "test_xfail": bool(xfail)}
                  observation.update(_public_test_failure(nodeid, outcome, phase))
                  if not nodeid.startswith(file + "::"):
                      return observation
                  if file not in source_test_functions:
                      functions = set()
                      source = Path(file)
                      try:
                          source.resolve().relative_to(Path.cwd().resolve())
                          if source.suffix == ".py" and not source.is_symlink() and source.stat().st_size <= 2_097_152:
                              tree = ast.parse(source.read_text(encoding="utf-8"))
                              functions = {node.name for node in ast.walk(tree) if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name.startswith("test_")}
                      except (OSError, ValueError, SyntaxError, UnicodeError, RecursionError):
                          pass
                      source_test_functions[file] = functions
                  function = nodeid[len(file) + 2:].split("[", 1)[0].rsplit("::", 1)[-1]
                  if function in source_test_functions[file]:
                      observation["test_function"] = function
                  return observation

              tracked = set(subprocess.check_output(["git", "ls-files", "-z"], text=True).split("\0"))
              emitted = 0
              def _finding_priority(row):
                  category = row.get("category") if isinstance(row, dict) else None
                  return {"tool_error": 0, "testing": 1}.get(category, 2) if isinstance(category, str) else 2

              findings = sorted(data.get("findings", []), key=_finding_priority)
              for finding in findings:
                  if not isinstance(finding, dict):
                      continue
                  file, line, severity = (finding.get(key) for key in ("file", "line", "severity"))
                  if (
                      isinstance(file, str) and file in tracked and not Path(file).is_absolute()
                      and type(line) is int and line > 0 and severity in ("error", "warning", "info")
                  ):
                      location = {"file": file, "line": line, "severity": severity}
                      public_values = {
                          "category": {"clean_code", "security", "type_safety", "contracts", "testing", "style", "architecture", "tool_error", "naming", "kiss", "yagni", "dry", "solid", "ai_bloat"},
                          "tool": {"ruff", "radon", "radon-kiss", "semgrep", "ast", "basedpyright", "pylint", "contract_runner", "crosshair", "pytest"},
                          "rule": {"tool_error", "TEST_OUTCOME_NOT_PASS", "TEST_COVERAGE_POLICY_FAILED", "MISSING_ICONTRACT", "CROSSHAIR_COUNTEREXAMPLE", "CROSSHAIR_INCOMPLETE_EVIDENCE", "kiss.loc.error", "kiss.loc.warning", "kiss.nesting.error", "kiss.nesting.warning", "kiss.parameter-count.error", "kiss.parameter-count.warning", *(f"CC{number}" for number in range(1, 1001))},
                      }
                      for key, allowed in public_values.items():
                          value = finding.get(key)
                          if isinstance(value, str) and value in allowed:
                              location[key] = value
                      if location.get("tool") == "pytest" and location.get("rule") == "TEST_OUTCOME_NOT_PASS":
                          location.update(_public_test_observation(finding, file))
                      if location.get("category") == "tool_error":
                          message = finding.get("message")
                          classes = (
                              ("structured errors", "structured_errors"),
                              ("timeout", "timeout"), ("timed out", "timeout"),
                              ("semgrep process failed", "process_failure"),
                              ("semgrep returned empty stdout", "empty_output"),
                              ("unrecognized crosshair output", "unrecognized_output"),
                          )
                          if isinstance(message, str) and location.get("tool") == "pytest":
                              pytest_codes = {
                                  "project_pytest_request_invalid", "project_pytest_configuration_or_collection_failed",
                                  "project_pytest_collection_error", "project_pytest_root_missing_or_invalid",
                                  "project_pytest_coverage_diagnostic_invalid", "project_pytest_coverage_policy_invalid",
                                  "project_pytest_coverage_candidate_invalid", "project_pytest_installed_coverage_directory_invalid",
                                  "project_pytest_installed_coverage_module_invalid",
                                  "project_pytest_root_outside_snapshot",
                                  "project_pytest_collection_failed", "project_pytest_execution_incomplete",
                                  "project_pytest_unexecuted", "project_pytest_coverage_missing",
                                  "project_pytest_coverage_evidence_unavailable", "project_pytest_coverage_worker_missing",
                                  "project_pytest_coverage_instrumentation_unavailable", "project_pytest_coverage_disabled",
                                  "project_pytest_coverage_suppressed", "project_pytest_coverage_plugin_not_activated",
                                  "project_pytest_coverage_controller_observation_missing",
                                  "project_pytest_installed_coverage_unavailable", "project_pytest_installed_coverage",
                                  "project_pytest_failure_without_observed_test", "project_pytest_internal_error",
                              }
                              prefix = message.split(":", 1)[0].split(";", 1)[0]
                              if prefix in pytest_codes:
                                  location["diagnostic_code"] = prefix
                              elif message.startswith("[Errno 2] "):
                                  location["diagnostic_code"] = "file_missing"
                              elif message.startswith("[Errno 13] "):
                                  location["diagnostic_code"] = "permission_denied"
                          if isinstance(message, str):
                              for marker, classification in classes:
                                  if marker in message.lower():
                                      location["failure_class"] = classification
                                      if classification == "structured_errors":
                                          tags = _semgrep_error_types(message)
                                          if tags:
                                              location["semgrep_error_types"] = tags
                                      break
                      print(json.dumps({"finding_location": location}))
                      emitted += 1
                      if emitted == 200:
                          break
          PY
            "$CUSTOMER_ROOT/venv/bin/python" -I - <<'PY_CANDIDATE_FAILURE'
          import json
          from pathlib import Path

          def unique_candidate_json_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError("duplicate private JSON field")
                  value[key] = item
              return value

          report = Path(".specfact/code-review.json")
          if report.is_file():
              data = {}
              try:
                  with report.open("rb") as stream:
                      payload = stream.read(32 * 1024 * 1024 + 1)
                  if len(payload) > 32 * 1024 * 1024:
                      raise ValueError("private diagnostic bound exceeded")
                  value = json.loads(payload, object_pairs_hook=unique_candidate_json_object)
                  if not isinstance(value, dict):
                      raise ValueError("private report shape invalid")
                  data = value
                  if len(payload) > 2 * 1024 * 1024:
                      print(json.dumps({"analyzer": "contracts", "diagnostic_class": "candidate_report_unavailable"}))
              except (OSError, ValueError, RecursionError):
                  print(json.dumps({"analyzer": "contracts", "diagnostic_class": "candidate_report_unavailable"}))
              allowed = ("ai-bloat-ast", "ast-clean-code", "basedpyright", "contracts", "pylint", "radon", "ruff", "semgrep-clean", "semgrep-bugs", "targeted-pytest-coverage")
              known = ("analyzer_reported_incomplete_execution", "namespace_unavailable", "capsule_materialization_failed", "snapshot_member_incomplete", "project_runtime_prepare_failed", "project_test_selection_ambiguous", "local_pytest_inventory_failed")
              rows = data.get("analyzer_evidence", [])
              for row in rows[:10] if isinstance(rows, list) else []:
                  if not isinstance(row, dict) or row.get("id") not in allowed:
                      continue
                  incomplete_sides = [side for side in ("base", "head")
                      if isinstance(row.get(side), dict) and (row[side].get("execution_state") == "error" or row[side].get("evidence_outcome") == "UNKNOWN")]
                  if incomplete_sides:
                      print(json.dumps({"analyzer": row["id"], "incomplete_snapshot_sides": incomplete_sides}))
                  tokens = str(row.get("diagnostic", "")).split(":")[:3]
                  codes = [token for token in tokens if token in known]
                  if codes:
                      print(json.dumps({"analyzer": row["id"], "diagnostic_codes": codes}))
              classes = {
                  "CrossHair timed out before mandatory evidence completed.": "crosshair_timeout_observed",
                  "CrossHair process error:": "crosshair_process_error_observed",
                  "Unrecognized CrossHair output:": "crosshair_unrecognized_output_observed",
                  "Unable to execute CrossHair:": "crosshair_execute_error_observed",
              }
              exceptions = {"ModuleNotFoundError": "module_not_found_observed",
                  "ImportError": "import_error_observed", "SyntaxError": "syntax_error_observed",
                  "PermissionError": "permission_error_observed", "TypeError": "type_error_observed",
                  "FileNotFoundError": "file_not_found_observed", "ValueError": "value_error_observed",
                  "wrong parameter order": "wrong_parameter_order_observed"}
              observations = {}
              findings = data.get("findings", [])
              for finding in findings[:10000] if isinstance(findings, list) else []:
                  if not isinstance(finding, dict) or finding.get("category") != "tool_error" or finding.get("tool") != "crosshair":
                      continue
                  message = finding.get("message", "")
                  if not isinstance(message, str):
                      continue
                  code = next((code for prefix, code in classes.items() if message.startswith(prefix)), "unclassified_crosshair_error_observed")
                  observations.setdefault(code, set()).update(code for marker, code in exceptions.items() if marker in message)
              for code, observed in sorted(observations.items()):
                  row = {"analyzer": "contracts", "diagnostic_class": code, "exception_observations": sorted(observed)}
                  print(json.dumps(row))
          PY_CANDIDATE_FAILURE
          fi
          exit "$review_exit"
      - name: Profile failed candidate review privately
        if: failure() && steps.deferred_review.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          unset GITHUB_TOKEN GH_TOKEN PYTHONPATH
          REVIEW_ROOT="$CUSTOMER_ROOT/staged-review"
          PROJECT_CONFIG="$CUSTOMER_ROOT/commit-review-project.toml"
          if [ ! -d "$REVIEW_ROOT" ] || [ ! -f "$PROJECT_CONFIG" ]; then
            echo '{"status":"DIAGNOSTIC_UNAVAILABLE"}'
            exit 1
          fi
          # Separate pinned profiler; authenticated reviewer and its deadline stay unchanged.
          "$CUSTOMER_ROOT/venv/bin/python" -m venv "$CUSTOMER_ROOT/profile-venv"
          printf '%s\n' 'py-spy==0.4.2 --hash=sha256:aeb0323409199c785f730645e9f4bb7a7b9ca2c481f2c331a55642b5d13fa52f' \
            > "$CUSTOMER_ROOT/profile-requirements.txt"
          "$CUSTOMER_ROOT/profile-venv/bin/python" -m pip install \
            --only-binary=:all: --no-deps --require-hashes \
            -r "$CUSTOMER_ROOT/profile-requirements.txt" \
            > "$CUSTOMER_ROOT/profile-install.private.log" 2>&1
          cd "$REVIEW_ROOT"
          review_paths=()
          while IFS= read -r -d '' path; do
            review_paths+=("$path")
          done < <(git diff --cached --name-only --diff-filter=ACMR -z)
          test "${#review_paths[@]}" -gt 0
          profile_exit=0
          SPECFACT_CODE_REVIEW_CAPSULE_CACHE="$CUSTOMER_ROOT/commit-review-cache" \
            SPECFACT_CODE_REVIEW_SUBJECT_ROOT="$REVIEW_ROOT" \
            SPECFACT_CODE_REVIEW_PROJECT_CONFIG="$PROJECT_CONFIG" \
            SPECFACT_CODE_REVIEW_ENFORCEMENT=changed \
            timeout --signal=INT --kill-after=5s 280s \
            "$CUSTOMER_ROOT/profile-venv/bin/py-spy" record \
            --rate 10 --idle --subprocesses --format speedscope \
            --output "$CUSTOMER_ROOT/commit-review-profile.private.json" -- \
            "$CUSTOMER_ROOT/venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/pre_commit_code_review.py" "${review_paths[@]}" \
            > "$CUSTOMER_ROOT/commit-review-profile.private.stdout" \
            2> "$CUSTOMER_ROOT/commit-review-profile.private.stderr" || profile_exit=$?
          # The replay cannot replace the failed required review. Raw stacks stay runner-private.
          if [ ! -f "$CUSTOMER_ROOT/commit-review-profile.private.json" ]; then
            printf '{"status":"DIAGNOSTIC_UNAVAILABLE","exit":%s}\n' "$profile_exit"
            exit 1
          fi
          "$CUSTOMER_ROOT/venv/bin/python" "$GITHUB_WORKSPACE/scripts/capsule_profile_summary.py" \
            --profile "$CUSTOMER_ROOT/commit-review-profile.private.json" --repository "$REVIEW_ROOT"
      - name: Collect namespace audit evidence privately
        if: failure() && steps.deferred_review.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          audit_exit=0
          { sudo dmesg --color=never; } > "$CUSTOMER_ROOT/namespace-audit.private.log" \
            2> "$CUSTOMER_ROOT/namespace-audit.private.stderr" || audit_exit=$?
          NAMESPACE_AUDIT="$CUSTOMER_ROOT/namespace-audit.private.log" \
            NAMESPACE_AUDIT_BASELINE="$CUSTOMER_ROOT/namespace-audit-baseline.private.log" \
            NAMESPACE_AUDIT_CAPTURED="$([ "$audit_exit" -eq 0 ] && echo 1 || echo 0)" \
            EXPECTED_LAUNCHER_PROFILE=specfact-customer-commit-review \
            "$CUSTOMER_ROOT/venv/bin/python" -I - <<'PY_NAMESPACE'
          import json
          import os
          import re
          from pathlib import Path

          logs = {}
          try:
              for name in ("NAMESPACE_AUDIT_BASELINE", "NAMESPACE_AUDIT"):
                  with Path(os.environ[name]).open("rb") as stream:
                      logs[name] = stream.read(16 * 1024 * 1024 + 1)
                  if len(logs[name]) > 16 * 1024 * 1024:
                      raise ValueError("private audit bound exceeded")
              before, after = logs["NAMESPACE_AUDIT_BASELINE"], logs["NAMESPACE_AUDIT"]
              boundary = os.environ.get("NAMESPACE_AUDIT_BASELINE_CAPTURED") == "1" and os.environ["NAMESPACE_AUDIT_CAPTURED"] == "1" and after.startswith(before)
              text = after[len(before):][-8192:].decode("utf-8", errors="replace") if boundary else ""
          except (OSError, ValueError, KeyError):
              boundary, text = False, ""
          records = [line for line in text.splitlines() if 'apparmor="DENIED"' in line and ('comm="bwrap-static"' in line or re.search(r'comm="[0-9]{1,10}"', line) is not None)]
          expected = 'profile="' + os.environ["EXPECTED_LAUNCHER_PROFILE"] + '"'
          print(json.dumps({"phase": "namespace_audit",
              "audit_captured": os.environ["NAMESPACE_AUDIT_CAPTURED"] == "1",
              "audit_boundary_available": boundary,
              "apparmor_denial_audit_observed": bool(records),
              "launcher_name_audit_observed": any('comm="bwrap-static"' in line for line in records),
              "numeric_descriptor_name_audit_observed": any(re.search(r'comm="[0-9]{1,10}"', line) is not None for line in records),
              "expected_profile_audit_observed": any(expected in line for line in records),
              "unconfined_profile_audit_observed": any('profile="unconfined"' in line for line in records),
              "net_admin_denial_observed": any('capname="net_admin"' in line for line in records),
              "userns_denial_observed": any('operation="userns_create"' in line for line in records)}))
          PY_NAMESPACE
      - name: Exercise cold and warm fixtures and modules repository
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN PYTHONPATH
          python scripts/capsule_customer_gate.py \
            --repository "$GITHUB_WORKSPACE" \
            --evidence "$CUSTOMER_ROOT/evidence" --mode "$MODE"
      - name: Validate pinned external Python corpus with automatic runtimes
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN PYTHONPATH
          python scripts/external_capsule_corpus.py --workspace "$CUSTOMER_ROOT/external"
      - name: Upload reports and exact installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capsule-${{ env.MODE }}-cp${{ matrix.python }}-${{ github.run_attempt }}
          path: |
            ${{ env.CUSTOMER_ROOT }}/evidence/
            ${{ env.CUSTOMER_ROOT }}/external/evidence/
            ${{ env.CUSTOMER_ROOT }}/denied-evidence/
            ${{ env.CUSTOMER_ROOT }}/installation-evidence/
            ${{ env.CUSTOMER_ROOT }}/installed-*.txt
            ${{ env.CUSTOMER_ROOT }}/capsule-userns.apparmor
          if-no-files-found: error
          retention-days: 14

  independent-review:
    name: independent signed capsule review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
      CANDIDATE_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install trusted reviewer in its own ordinary-user environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          TRUSTED_ROOT="$RUNNER_TEMP/specfact-independent-review"
          mkdir -m 0700 "$TRUSTED_ROOT"
          mkdir -m 0700 "$TRUSTED_ROOT/home" "$TRUSTED_ROOT/tmp"
          echo "TRUSTED_ROOT=$TRUSTED_ROOT" >> "$GITHUB_ENV"
          cd "$TRUSTED_ROOT"
          python -I -m venv "$TRUSTED_ROOT/venv"
          "$TRUSTED_ROOT/venv/bin/python" -I -m pip install --no-cache-dir specfact-cli==0.55.4
          env -i HOME="$TRUSTED_ROOT/home" TMPDIR="$TRUSTED_ROOT/tmp" \
            PATH="$TRUSTED_ROOT/venv/bin:/usr/bin:/bin" SPECFACT_MODULES_BRANCH=main \
            "$TRUSTED_ROOT/venv/bin/python" -I -m specfact_cli.cli \
            module install nold-ai/specfact-code-review --scope user --version 0.51.2 --source marketplace
      - name: Capture immutable candidate subject without executing its host code
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_BASE="$(git merge-base "$CANDIDATE_HEAD" "$CANDIDATE_BASE")"
          git -c core.hooksPath=/dev/null worktree add --detach "$TRUSTED_ROOT/subject" "$CANDIDATE_HEAD"
          git -C "$TRUSTED_ROOT/subject" -c core.hooksPath=/dev/null reset --soft "$REVIEW_BASE"
          printf '%s\n' 'manager = "hatch"' 'environment = "default"' > "$TRUSTED_ROOT/project.toml"
      - name: Allow namespaces only for the trusted capsule launcher
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          cat > "$TRUSTED_ROOT/capsule.apparmor" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile specfact-independent-capsule "$TRUSTED_ROOT/cache/**/opt/specfact/bin/bwrap-static" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "$TRUSTED_ROOT/capsule.apparmor"
      - name: Prepare and review through the authenticated installed controller
        id: independent_review
        shell: bash
        run: |
          set -euo pipefail
          cd "$TRUSTED_ROOT"
          cat > "$TRUSTED_ROOT/reviewer.py" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          from specfact_cli.cli import app
          from specfact_cli.registry import CommandRegistry

          # Register and load the installed reviewer before entering the subject.
          # This fresh job has never executed candidate-controlled host programs.
          CommandRegistry.get_module_typer("code")
          from specfact_code_review.run.portable_snapshot import discover_snapshot
          from specfact_code_review.run.runtime_builder import prepare_runtime
          from specfact_code_review.run.runtime_interpreter import select_environment
          from specfact_code_review.run.runner import (
              _capsule_environment_id, _prepare_capsule_runtime, _cleanup_capsule_runtime,
          )
          from specfact_code_review.run.scope import (
              ScopeRequest, resolve_scope, cleanup_scope_resolution,
          )

          os.chdir(sys.argv[1])
          if sys.argv[2] != "prepare-index":
              app(args=sys.argv[2:])
              raise SystemExit(0)
          resolution = resolve_scope(ScopeRequest(
              repository=Path.cwd(), scope="index", portable_project_runtime=True,
          ))
          try:
              if (resolution.status == "NOT_APPLICABLE" and resolution.reason == "no_governed_impact"
                  and not resolution.selected_paths and resolution.ci_exit_code == 0):
                  raise SystemExit(0)
              if resolution.status != "PASS" or resolution.base_snapshot is None or resolution.head_snapshot is None:
                  reason = resolution.reason or "missing_snapshots"
                  public_codes = {
                      "policy_parse_failure", "git_resolution_failed", "unsafe_governed_input",
                      "candidate_policy_change", "candidate_project_runtime_source_lock_change",
                      "no_governed_impact", "no_reviewable_files", "missing_snapshots",
                  }
                  diagnostic = reason if reason in public_codes else "unstructured_reason"
                  (Path(sys.argv[3]).parent / "status.public.json").write_text(json.dumps({
                      "status": "INCOMPLETE", "phase": "trusted_index_preparation", "diagnostic": diagnostic,
                  }))
                  raise RuntimeError("trusted_index_preparation_incomplete")
              for snapshot in (resolution.base_snapshot, resolution.head_snapshot):
                  plan = discover_snapshot(snapshot.root, config_path=Path(sys.argv[3]), source_snapshot=snapshot)
                  selected = select_environment(plan, current=_capsule_environment_id())
                  runtime, reason = _prepare_capsule_runtime(environment_id=selected)
                  if runtime is None:
                      raise RuntimeError("trusted_runtime_preparation_incomplete:" + reason)
                  try:
                      prepare_runtime(plan, runtime=runtime)
                  finally:
                      _cleanup_capsule_runtime(runtime)
          finally:
              cleanup_scope_resolution(resolution)
          PY
          trusted_env=(env -i HOME="$TRUSTED_ROOT/home" TMPDIR="$TRUSTED_ROOT/tmp"
            PATH="$TRUSTED_ROOT/venv/bin:/usr/bin:/bin" SPECFACT_MODULES_BRANCH=main
            SPECFACT_CODE_REVIEW_CAPSULE_CACHE="$TRUSTED_ROOT/cache")
          if ! "${trusted_env[@]}" "$TRUSTED_ROOT/venv/bin/python" -I -c \
            'import subprocess,sys; sys.exit(subprocess.run(sys.argv[1:],timeout=1800,check=False).returncode)' \
            "$TRUSTED_ROOT/venv/bin/python" -I "$TRUSTED_ROOT/reviewer.py" \
            "$TRUSTED_ROOT/subject" prepare-index "$TRUSTED_ROOT/project.toml" \
            > "$TRUSTED_ROOT/preparation.private.log" 2>&1; then
            echo "Independent signed reviewer preparation failed; no acceptance."
            PREPARATION_LOG="$TRUSTED_ROOT/preparation.private.log" \
              "$TRUSTED_ROOT/venv/bin/python" -I - <<'PY_FAILURE'
          import json
          import os
          from pathlib import Path

          try:
              with Path(os.environ["PREPARATION_LOG"]).open("rb") as stream:
                  stream.seek(0, 2)
                  stream.seek(max(0, stream.tell() - 8192))
                  text = stream.read(8192).decode("utf-8", errors="replace")
          except OSError:
              text = ""
          markers = {"namespace_unavailable": "capsule_namespace_unavailable",
              "project_test_selection_ambiguous": "test_selection_ambiguous",
              "project_runtime_prepare_failed": "project_runtime_preparation_failed"}
          code = next((code for marker, code in markers.items() if marker in text), "unclassified_preparation_failure")
          print(json.dumps({"status": "INCOMPLETE", "phase": "trusted_index_preparation", "diagnostic": code}))
          PY_FAILURE
            if [ -f "$TRUSTED_ROOT/status.public.json" ]; then
              cat "$TRUSTED_ROOT/status.public.json"
            fi
            exit 1
          fi
          review_exit=0
          touch "$TRUSTED_ROOT/review-attempted"
          "${trusted_env[@]}" "$TRUSTED_ROOT/venv/bin/python" -I -c \
            'import subprocess,sys
          try:
              sys.exit(subprocess.run(sys.argv[1:],timeout=300,check=False).returncode)
          except subprocess.TimeoutExpired:
              sys.exit(124)' \
            "$TRUSTED_ROOT/venv/bin/python" -I "$TRUSTED_ROOT/reviewer.py" \
            "$TRUSTED_ROOT/subject" code review run --scope index --enforcement changed --bug-hunt \
            --project-config "$TRUSTED_ROOT/project.toml" --json --out "$TRUSTED_ROOT/review.private.json" \
            > "$TRUSTED_ROOT/review.private.log" 2>&1 || review_exit=$?
          if [ "$review_exit" -ne 0 ]; then
            cd "$TRUSTED_ROOT/subject"
            "${trusted_env[@]}" REVIEW_PUBLIC_REPORT="$TRUSTED_ROOT/review.private.json" REVIEW_PUBLIC_EXIT="$review_exit" REVIEW_PUBLIC_PROGRESS="$TRUSTED_ROOT/review.private.log" "$TRUSTED_ROOT/venv/bin/python" -I - <<'PY'
          import ast
          import re
          import json
          import os
          import subprocess
          from pathlib import Path

          report = Path(os.environ.get("REVIEW_PUBLIC_REPORT", ".specfact/code-review.json"))
          if os.environ.get("REVIEW_PUBLIC_EXIT") == "124":
              timeout_status = {"status": "INCOMPLETE", "phase": "review", "diagnostic": "analysis_timeout"}
              progress_path = os.environ.get("REVIEW_PUBLIC_PROGRESS")
              if progress_path:
                  try:
                      with Path(progress_path).open("rb") as progress:
                          progress.seek(0, 2)
                          progress.seek(max(0, progress.tell() - 65_536))
                          tail = progress.read(65_536).decode("utf-8", errors="replace")
                  except OSError:
                      tail = ""
                  progress_analyzers = {"ruff", "radon", "semgrep-clean", "ai-bloat-ast", "ast-clean-code", "basedpyright", "pylint", "contracts", "semgrep-bugs", "targeted-pytest-coverage"}
                  markers = {f"Checking capsule analyzer {name}...": name for name in progress_analyzers}
                  for line in reversed(tail.splitlines()):
                      if line.strip() in markers:
                          timeout_status["analyzer"] = markers[line.strip()]
                          break
              print(json.dumps(timeout_status))
          if not report.is_file() and os.environ.get("REVIEW_PUBLIC_EXIT") != "124":
              print(json.dumps({"status": "INCOMPLETE", "phase": "review", "diagnostic": "review_report_missing"}))
          if report.is_file():
              data = json.loads(report.read_text())
              public_analyzers = {"ruff", "radon", "semgrep-clean", "ai-bloat-ast", "ast-clean-code", "basedpyright", "pylint", "contracts", "semgrep-bugs", "targeted-pytest-coverage"}
              public_codes = {"analyzer_reported_incomplete_execution", "capsule_request_failed", "project_test_selection_ambiguous", "project_runtime_required", "project_pytest_coverage_missing", "analyzer_output_invalid", "timeout", "capsule_acquisition_failed", "native_capsule_artifact_not_admitted"}
              for row in data.get("analyzer_evidence", []):
                  if not isinstance(row, dict) or not isinstance(row.get("id"), str) or row["id"] not in public_analyzers:
                      continue
                  tokens = str(row.get("diagnostic", "")).split(":")[:3]
                  codes = [token for token in tokens if token in public_codes]
                  if codes:
                      print(json.dumps({"analyzer": row["id"], "diagnostic_codes": codes}))
              def _semgrep_error_types(message):
                  if len(message) > 4096 or "details=" not in message:
                      return []
                  try:
                      details = json.loads(message.rsplit("details=", 1)[1])
                  except (ValueError, TypeError, RecursionError):
                      return []
                  if not isinstance(details, list):
                      return []
                  allowed = {
                      "Lexical error", "Syntax error", "Other syntax error", "AST builder error",
                      "Rule parse error", "SemgrepWarning", "SemgrepError", "InvalidRuleSchemaError",
                      "UnknownLanguageError", "Invalid YAML", "Internal matching error",
                      "Semgrep match found", "Too many matches", "Fatal error", "Timeout",
                      "Out of memory", "Fixpoint timeout", "Stack overflow",
                      "Timeout during interfile analysis", "OOM during interfile analysis",
                      "Missing plugin", "Pattern parse error", "Incompatible rule",
                      "PatternParseError", "PartialParsing", "IncompatibleRule", "DependencyResolutionError",
                  }
                  tags = set()
                  for error in details[:3]:
                      if not isinstance(error, dict):
                          continue
                      value = error.get("type")
                      if isinstance(value, list) and value:
                          value = value[0]
                      if isinstance(value, str) and value in allowed:
                          tags.add(value)
                  return sorted(tags)

              test_failure_details = {}
              for analyzer in data.get("analyzer_evidence", []):
                  if not isinstance(analyzer, dict) or analyzer.get("id") != "targeted-pytest-coverage":
                      continue
                  for side in (analyzer.get("head"), analyzer, analyzer.get("base")):
                      execution = side.get("target_execution") if isinstance(side, dict) else None
                      records = execution.get("records", []) if isinstance(execution, dict) else []
                      if not isinstance(records, list):
                          continue
                      for record in records[:20_000]:
                          if not isinstance(record, dict):
                              continue
                          key = tuple(record.get(field) for field in ("nodeid", "outcome", "phase"))
                          detail = record.get("detail")
                          if all(isinstance(value, str) and len(value) <= 4096 for value in key) and isinstance(detail, str) and len(detail) <= 65_536:
                              test_failure_details.setdefault(key, detail)

              def _public_test_failure(nodeid, outcome, phase):
                  detail = test_failure_details.get((nodeid, outcome, phase), "")
                  exception = re.search(r"^E\s+(?:subprocess\.)?(AssertionError|FileNotFoundError|PermissionError|CalledProcessError|RuntimeError|ImportError|ModuleNotFoundError|TypeError|ValueError)(?=:|\s|$)", detail, re.MULTILINE)
                  failure = {"test_failure_class": exception.group(1)} if exception else {}
                  for option in ("-I", "-E", "-S"):
                      if "project_python_option_unsupported:" + option + ";" in detail:
                          failure.update(test_diagnostic="project_python_option_unsupported", python_option=option)
                          break
                  return failure

              source_test_functions = {}
              def _public_test_observation(finding, file):
                  message = finding.get("message")
                  if not isinstance(message, str) or len(message) > 4096:
                      return {}
                  match = re.fullmatch(r"Test (.+) (passed|failed|skipped) during (setup|call|teardown)( with an xfail marker)?\.", message)
                  if match is None:
                      return {}
                  nodeid, outcome, phase, xfail = match.groups()
                  observation = {"test_outcome": outcome, "test_phase": phase, "test_xfail": bool(xfail)}
                  observation.update(_public_test_failure(nodeid, outcome, phase))
                  if not nodeid.startswith(file + "::"):
                      return observation
                  if file not in source_test_functions:
                      functions = set()
                      source = Path(file)
                      try:
                          source.resolve().relative_to(Path.cwd().resolve())
                          if source.suffix == ".py" and not source.is_symlink() and source.stat().st_size <= 2_097_152:
                              tree = ast.parse(source.read_text(encoding="utf-8"))
                              functions = {node.name for node in ast.walk(tree) if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name.startswith("test_")}
                      except (OSError, ValueError, SyntaxError, UnicodeError, RecursionError):
                          pass
                      source_test_functions[file] = functions
                  function = nodeid[len(file) + 2:].split("[", 1)[0].rsplit("::", 1)[-1]
                  if function in source_test_functions[file]:
                      observation["test_function"] = function
                  return observation

              tracked = set(subprocess.check_output(["git", "ls-files", "-z"], text=True).split("\0"))
              emitted = 0
              def _finding_priority(row):
                  category = row.get("category") if isinstance(row, dict) else None
                  return {"tool_error": 0, "testing": 1}.get(category, 2) if isinstance(category, str) else 2

              findings = sorted(data.get("findings", []), key=_finding_priority)
              for finding in findings:
                  if not isinstance(finding, dict):
                      continue
                  file, line, severity = (finding.get(key) for key in ("file", "line", "severity"))
                  if (
                      isinstance(file, str) and file in tracked and not Path(file).is_absolute()
                      and type(line) is int and line > 0 and severity in ("error", "warning", "info")
                  ):
                      location = {"file": file, "line": line, "severity": severity}
                      public_values = {
                          "category": {"clean_code", "security", "type_safety", "contracts", "testing", "style", "architecture", "tool_error", "naming", "kiss", "yagni", "dry", "solid", "ai_bloat"},
                          "tool": {"ruff", "radon", "radon-kiss", "semgrep", "ast", "basedpyright", "pylint", "contract_runner", "crosshair", "pytest"},
                          "rule": {"tool_error", "TEST_OUTCOME_NOT_PASS", "TEST_COVERAGE_POLICY_FAILED", "MISSING_ICONTRACT", "CROSSHAIR_COUNTEREXAMPLE", "CROSSHAIR_INCOMPLETE_EVIDENCE", "kiss.loc.error", "kiss.loc.warning", "kiss.nesting.error", "kiss.nesting.warning", "kiss.parameter-count.error", "kiss.parameter-count.warning", *(f"CC{number}" for number in range(1, 1001))},
                      }
                      for key, allowed in public_values.items():
                          value = finding.get(key)
                          if isinstance(value, str) and value in allowed:
                              location[key] = value
                      if location.get("tool") == "pytest" and location.get("rule") == "TEST_OUTCOME_NOT_PASS":
                          location.update(_public_test_observation(finding, file))
                      if location.get("category") == "tool_error":
                          message = finding.get("message")
                          classes = (
                              ("structured errors", "structured_errors"),
                              ("timeout", "timeout"), ("timed out", "timeout"),
                              ("semgrep process failed", "process_failure"),
                              ("semgrep returned empty stdout", "empty_output"),
                              ("unrecognized crosshair output", "unrecognized_output"),
                          )
                          if isinstance(message, str) and location.get("tool") == "pytest":
                              pytest_codes = {
                                  "project_pytest_request_invalid", "project_pytest_configuration_or_collection_failed",
                                  "project_pytest_collection_error", "project_pytest_root_missing_or_invalid",
                                  "project_pytest_coverage_diagnostic_invalid", "project_pytest_coverage_policy_invalid",
                                  "project_pytest_coverage_candidate_invalid", "project_pytest_installed_coverage_directory_invalid",
                                  "project_pytest_installed_coverage_module_invalid",
                                  "project_pytest_root_outside_snapshot",
                                  "project_pytest_collection_failed", "project_pytest_execution_incomplete",
                                  "project_pytest_unexecuted", "project_pytest_coverage_missing",
                                  "project_pytest_coverage_evidence_unavailable", "project_pytest_coverage_worker_missing",
                                  "project_pytest_coverage_instrumentation_unavailable", "project_pytest_coverage_disabled",
                                  "project_pytest_coverage_suppressed", "project_pytest_coverage_plugin_not_activated",
                                  "project_pytest_coverage_controller_observation_missing",
                                  "project_pytest_installed_coverage_unavailable", "project_pytest_installed_coverage",
                                  "project_pytest_failure_without_observed_test", "project_pytest_internal_error",
                              }
                              prefix = message.split(":", 1)[0].split(";", 1)[0]
                              if prefix in pytest_codes:
                                  location["diagnostic_code"] = prefix
                              elif message.startswith("[Errno 2] "):
                                  location["diagnostic_code"] = "file_missing"
                              elif message.startswith("[Errno 13] "):
                                  location["diagnostic_code"] = "permission_denied"
                          if isinstance(message, str):
                              for marker, classification in classes:
                                  if marker in message.lower():
                                      location["failure_class"] = classification
                                      if classification == "structured_errors":
                                          tags = _semgrep_error_types(message)
                                          if tags:
                                              location["semgrep_error_types"] = tags
                                      break
                      print(json.dumps({"finding_location": location}))
                      emitted += 1
                      if emitted == 200:
                          break
          PY
          fi
          exit "$review_exit"
      - name: Project independent review failure privately
        if: failure() && steps.independent_review.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          test -f "$TRUSTED_ROOT/review-attempted" || exit 0
          REVIEW_REPORT="$TRUSTED_ROOT/review.private.json" REVIEW_LOG="$TRUSTED_ROOT/review.private.log" \
            "$TRUSTED_ROOT/venv/bin/python" -I - <<'PY_REVIEW_FAILURE'
          import json
          import os
          from pathlib import Path

          def unique_json_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError("duplicate JSON field")
                  value[key] = item
              return value

          def complete_private_report(data):
              value = json.loads(data, object_pairs_hook=unique_json_object)
              if not isinstance(value, dict):
                  return {}
              if not isinstance(value.get("findings"), list) or not isinstance(value.get("analyzer_evidence"), list):
                  return {}
              return value

          def crosshair_failure_observations(findings):
              markers = {
                  "CrossHair timed out before mandatory evidence completed.": "crosshair_timeout_observed",
                  "CrossHair process error:": "crosshair_process_error_observed",
                  "Unrecognized CrossHair output:": "crosshair_unrecognized_output_observed",
                  "Unable to execute CrossHair:": "crosshair_execute_error_observed",
                  "ModuleNotFoundError": "module_not_found_observed",
                  "ImportError": "import_error_observed", "SyntaxError": "syntax_error_observed",
                  "PermissionError": "permission_error_observed", "TypeError": "type_error_observed",
                  "FileNotFoundError": "file_not_found_observed", "ValueError": "value_error_observed",
                  "wrong parameter order": "wrong_parameter_order_observed",
              }
              observed = set()
              for finding in findings[:10000]:
                  if not isinstance(finding, dict) or finding.get("category") != "tool_error" or finding.get("tool") != "crosshair":
                      continue
                  message = finding.get("message", "")
                  if isinstance(message, str):
                      observed.update(code for marker, code in markers.items() if marker in message)
              return sorted(observed)

          def incomplete_sides(members):
              observed = {}
              for name, group in members:
                  row = group[0]
                  for side in ("base", "head"):
                      node = row.get(side)
                      if isinstance(node, dict) and (node.get("execution_state") == "error" or node.get("evidence_outcome") == "UNKNOWN"):
                          observed.setdefault(name, set()).add(side)
              return {name: sorted(sides) for name, sides in sorted(observed.items())}

          report, header = {}, {}
          outcome = "unreadable_report"
          diagnostic_bound = 32 * 1024 * 1024
          try:
              with Path(os.environ["REVIEW_REPORT"]).open("rb") as stream:
                  data = stream.read(diagnostic_bound + 1)
              if len(data) > 2 * 1024 * 1024:
                  outcome = "oversized_report"
                  if len(data) <= diagnostic_bound:
                      header = complete_private_report(data)
              else:
                  report = complete_private_report(data)
                  outcome = "structured_report" if report else "invalid_report_shape"
          except FileNotFoundError:
              outcome = "missing_report"
          except json.JSONDecodeError:
              if outcome != "oversized_report":
                  outcome = "invalid_json"
          except (OSError, ValueError, RecursionError):
              pass
          evidence_source = report if outcome == "structured_report" else header
          rows = [row for row in evidence_source.get("analyzer_evidence", [])[:10] if isinstance(row, dict)]
          nodes = rows + [row[side] for row in rows for side in ("base", "head") if isinstance(row.get(side), dict)]
          diagnostics = [node.get("diagnostic", "") for node in nodes if isinstance(node.get("diagnostic", ""), str)]
          if outcome != "structured_report":
              try:
                  with Path(os.environ["REVIEW_LOG"]).open("rb") as stream:
                      stream.seek(0, 2)
                      stream.seek(max(0, stream.tell() - 8192))
                      diagnostics.append(stream.read(8192).decode("utf-8", errors="replace"))
              except OSError:
                  pass
          findings = report.get("findings", [])
          diagnostics += [finding["message"] for finding in findings if isinstance(finding, dict) and finding.get("category") == "tool_error" and isinstance(finding.get("message"), str)]
          allowed = ("ai-bloat-ast", "ast-clean-code", "basedpyright", "contracts", "pylint", "radon", "ruff", "semgrep-clean", "semgrep-bugs", "targeted-pytest-coverage")
          members = [(row.get("id"), [row] + [row[side] for side in ("base", "head") if isinstance(row.get(side), dict)]) for row in rows if row.get("id") in allowed]
          errors = sorted({name for name, group in members if any(node.get("execution_state") == "error" for node in group)})
          unknowns = sorted({name for name, group in members if any(node.get("evidence_outcome") == "UNKNOWN" for node in group)})
          markers = {"namespace_unavailable": "namespace_unavailable",
              "capsule_materialization_failed": "capsule_materialization_failed",
              "analyzer_reported_incomplete_execution": "analyzer_reported_incomplete_execution",
              "project_runtime_prepare_failed": "project_runtime_prepare_failed",
              "local_pytest_inventory_failed": "local_pytest_inventory_failed",
              "project_test_selection_ambiguous": "project_test_selection_ambiguous",
              "TimeoutExpired": "timeout_marker_observed"}
          codes = [code for marker, code in markers.items() if any(marker in text for text in diagnostics)]
          assurance = report.get("assurance_status")
          verdict = report.get("overall_verdict")
          projected = {"phase": "independent_review", "report_outcome": outcome,
              "assurance_status": assurance if assurance in ("PASS", "FAIL", "UNKNOWN", "NOT_APPLICABLE") else "UNAVAILABLE",
              "overall_verdict": verdict if verdict in ("PASS", "PASS_WITH_ADVISORY", "FAIL") else "UNAVAILABLE",
              "findings_present": bool(findings),
              "tool_error_present": any(isinstance(finding, dict) and finding.get("category") == "tool_error" for finding in findings),
              "execution_error_present": any(node.get("execution_state") == "error" for node in nodes),
              "unknown_evidence_present": evidence_source.get("has_unknown_required_evidence") is True or any(node.get("evidence_outcome") == "UNKNOWN" for node in nodes),
              "error_analyzers": errors, "unknown_analyzers": unknowns,
              "diagnostic_observations": codes or ["unclassified"]}
          if outcome == "oversized_report":
              projected["report_header_observed"] = bool(header)
              projected["error_analyzer_sides"] = incomplete_sides(members)
              projected["crosshair_failure_observations"] = crosshair_failure_observations(header.get("findings", []))
          print(json.dumps(projected))
          PY_REVIEW_FAILURE
