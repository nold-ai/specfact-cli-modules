              def _finding_priority(row):
                  category = row.get("category") if isinstance(row, dict) else None
                  return {"tool_error": 0, "testing": 1}.get(category, 2) if isinstance(category, str) else 2

              findings = sorted(data.get("findings", []), key=_finding_priority)
              for finding in findings:
                  if not isinstance(finding, dict):
                      continue
                  file, line, severity = (finding.get(key) for key in ("file", "line", "severity"))
                  if (
                      isinstance(file, str) and file in tracked and not Path(file).is_absolute()
                      and type(line) is int and line > 0 and severity in ("error", "warning", "info")
                  ):
                      location = {"file": file, "line": line, "severity": severity}
                      public_values = {
                          "category": {"clean_code", "security", "type_safety", "contracts", "testing", "style", "architecture", "tool_error", "naming", "kiss", "yagni", "dry", "solid", "ai_bloat"},
                          "tool": {"ruff", "radon", "radon-kiss", "semgrep", "ast", "basedpyright", "pylint", "contract_runner", "crosshair", "pytest"},
                          "rule": {"tool_error", "TEST_OUTCOME_NOT_PASS", "TEST_COVERAGE_POLICY_FAILED", "MISSING_ICONTRACT", "CROSSHAIR_COUNTEREXAMPLE", "CROSSHAIR_INCOMPLETE_EVIDENCE", "kiss.loc.error", "kiss.loc.warning", "kiss.nesting.error", "kiss.nesting.warning", "kiss.parameter-count.error", "kiss.parameter-count.warning", *(f"CC{number}" for number in range(1, 1001))},
                      }
                      for key, allowed in public_values.items():
                          value = finding.get(key)
                          if isinstance(value, str) and value in allowed:
                              location[key] = value
                      if location.get("tool") == "pytest" and location.get("rule") == "TEST_OUTCOME_NOT_PASS":
                          location.update(_public_test_observation(finding, file))
                      if location.get("category") == "tool_error":
                          message = finding.get("message")
                          classes = (
                              ("structured errors", "structured_errors"),
                              ("timeout", "timeout"), ("timed out", "timeout"),
                              ("semgrep process failed", "process_failure"),
                              ("semgrep returned empty stdout", "empty_output"),
                              ("unrecognized crosshair output", "unrecognized_output"),
                          )
                          if isinstance(message, str) and location.get("tool") == "pytest":
                              pytest_codes = {
                                  "project_pytest_request_invalid", "project_pytest_configuration_or_collection_failed",
                                  "project_pytest_collection_error", "project_pytest_root_missing_or_invalid",
                                  "project_pytest_coverage_diagnostic_invalid", "project_pytest_coverage_policy_invalid",
                                  "project_pytest_coverage_candidate_invalid", "project_pytest_installed_coverage_directory_invalid",
                                  "project_pytest_installed_coverage_module_invalid",
                                  "project_pytest_root_outside_snapshot",
                                  "project_pytest_collection_failed", "project_pytest_execution_incomplete",
                                  "project_pytest_unexecuted", "project_pytest_coverage_missing",
                                  "project_pytest_coverage_evidence_unavailable", "project_pytest_coverage_worker_missing",
                                  "project_pytest_coverage_instrumentation_unavailable", "project_pytest_coverage_disabled",
                                  "project_pytest_coverage_suppressed", "project_pytest_coverage_plugin_not_activated",
                                  "project_pytest_coverage_controller_observation_missing",
                                  "project_pytest_installed_coverage_unavailable", "project_pytest_installed_coverage",
                                  "project_pytest_failure_without_observed_test", "project_pytest_internal_error",
                              }
                              prefix = message.split(":", 1)[0].split(";", 1)[0]
                              if prefix in pytest_codes:
                                  location["diagnostic_code"] = prefix
                              elif message.startswith("[Errno 2] "):
                                  location["diagnostic_code"] = "file_missing"
                              elif message.startswith("[Errno 13] "):
                                  location["diagnostic_code"] = "permission_denied"
                          if isinstance(message, str):
                              for marker, classification in classes:
                                  if marker in message.lower():
                                      location["failure_class"] = classification
                                      if classification == "structured_errors":
                                          tags = _semgrep_error_types(message)
                                          if tags:
                                              location["semgrep_error_types"] = tags
                                      break
                      print(json.dumps({"finding_location": location}))
                      emitted += 1
                      if emitted == 200:
                          break
          PY
          fi
          exit "$review_exit"
      - name: Publish installed controller source observation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${TRUSTED_ROOT:-}" && -x "$TRUSTED_ROOT/venv/bin/python" ]] && \
            projected=$("$TRUSTED_ROOT/venv/bin/python" -I - 2>/dev/null <<'PY_CONTROLLER_SOURCE'
          import json
          import os
          import re
          import stat
          import sys
          from pathlib import Path


          def _unique_receipt_keys(pairs):
              receipt = {}
              for key, value in pairs:
                  if key in receipt:
                      raise ValueError("duplicate_receipt_key")
                  receipt[key] = value
              return receipt


          def _read_source_receipt(path):
              descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(descriptor, "rb") as stream:
                  info = os.fstat(stream.fileno())
                  if not stat.S_ISREG(info.st_mode) or info.st_size > 4096:
                      raise ValueError("receipt_unavailable")
                  content = stream.read(4097)
              if len(content) > 4096:
                  raise ValueError("receipt_oversized")
              return json.loads(content.decode("utf-8"), object_pairs_hook=_unique_receipt_keys)


          def _project_source_receipt(invocation):
              unavailable = {"phase": "installed_controller_source", "invocation": invocation,
                             "status": "unavailable"}
              try:
                  path = Path(os.environ["TRUSTED_ROOT"]) / f"controller-source-{invocation}.private.json"
                  receipt = _read_source_receipt(path)
                  if not isinstance(receipt, dict):
                      return unavailable
                  if receipt == unavailable:
                      return unavailable
                  labels = {"phase": "installed_controller_source", "invocation": invocation,
                            "status": "observed", "identity_kind": "authenticated_source_and_loaded_origins"}
                  digests = ("runner_sha256", "sandbox_sha256")
                  if set(receipt) != set(labels) | set(digests):
                      return unavailable
                  if any(receipt[key] != value for key, value in labels.items()):
                      return unavailable
                  if any(not isinstance(receipt[key], str) or re.fullmatch(r"[0-9a-f]{64}", receipt[key]) is None
                         for key in digests):
                      return unavailable
                  return labels | {key: receipt[key] for key in digests}
              except Exception:
                  return unavailable


          records = [_project_source_receipt(invocation) for invocation in ("preparation", "review")]
          output = "\n".join(json.dumps(record, separators=(",", ":")) for record in records)
          sys.stdout.write(output + "\n")
          PY_CONTROLLER_SOURCE
          ); then
            printf '%s\n' "$projected"
          else
            printf '%s\n' \
              '{"phase":"installed_controller_source","invocation":"preparation","status":"unavailable"}' \
              '{"phase":"installed_controller_source","invocation":"review","status":"unavailable"}'
          fi
      - name: Project independent review failure privately
        if: failure() && steps.independent_review.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          test -f "$TRUSTED_ROOT/review-attempted" || exit 0
          REVIEW_REPORT="$TRUSTED_ROOT/review.private.json" REVIEW_LOG="$TRUSTED_ROOT/review.private.log" \
            "$TRUSTED_ROOT/venv/bin/python" -I - <<'PY_REVIEW_FAILURE'
          import json
          import os
          from pathlib import Path

          _SNAPSHOT_REASONS = {
              "analyzer_reported_incomplete_execution", "analyzer_output_invalid",
              "capsule_request_failed", "linux_bubblewrap_identity_missing",
              "namespace_unavailable", "sandbox_filesystem_error", "analyzer_process_error",
              "sandbox_launch_failed", "reserved_import_catalog_unavailable",
              "reserved_import_collision", "bubblewrap_identity_mismatch", "trace_helper_failed",
              "pre_namespace_observation_unsupported", "pre_namespace_observation_requires_single_thread",
              "pre_namespace_exec_stop_missing", "pre_namespace_observation_failed",
              "pre_namespace_executable_missing", "pre_namespace_executable_ambiguous",
              "pre_namespace_host_object", "unclassified",
          }


          def snapshot_diagnostic_observations(evidence):
              rows = evidence.get("analyzer_evidence")
              if not isinstance(rows, list) or len(rows) > 10:
                  return []
              contracts = [row for row in rows if isinstance(row, dict) and row.get("id") == "contracts"]
              if len(contracts) != 1:
                  return []
              observations = []
              for side in ("base", "head"):
                  node = contracts[0].get(side)
                  if not isinstance(node, dict) or not (
                      node.get("execution_state") == "error" or node.get("evidence_outcome") == "UNKNOWN"
                  ):
                      continue
                  diagnostic = node.get("diagnostic")
                  reason = "unclassified"
                  if isinstance(diagnostic, str) and len(diagnostic) <= 4096:
                      token = diagnostic.split(":", 1)[0]
                      if token in _SNAPSHOT_REASONS:
                          reason = token
                  observations.append({"analyzer": "contracts", "side": side, "reason": reason})
              return observations

          _SNAPSHOT_PREFIX_LIMIT = max(map(len, _SNAPSHOT_REASONS)) + 1


          def _snapshot_length_bucket(diagnostic):
              length = len(diagnostic)
              if length == 0:
                  return "empty"
              if length <= 4096:
                  return "within_bound"
              return "over_bound"


          def _snapshot_recognized_leading_token(diagnostic):
              prefix = diagnostic[:_SNAPSHOT_PREFIX_LIMIT]
              if ":" not in prefix and len(diagnostic) >= _SNAPSHOT_PREFIX_LIMIT:
                  return False
              return prefix.split(":", 1)[0] in _SNAPSHOT_REASONS


          def _snapshot_diagnostic_fact(side, node):
              fact = {
                  "analyzer": "contracts",
                  "side": side,
                  "shape": "missing" if "diagnostic" not in node else "non_string",
                  "length_bucket": "not_string",
                  "recognized_leading_token": False,
              }
              diagnostic = node.get("diagnostic")
              if not isinstance(diagnostic, str):
                  return fact
              fact["shape"] = "string"
              fact["length_bucket"] = _snapshot_length_bucket(diagnostic)
              fact["recognized_leading_token"] = _snapshot_recognized_leading_token(diagnostic)
              return fact


          def snapshot_diagnostic_facts(evidence, observations):
              selected = [item for item in observations if item["reason"] == "unclassified"]
              if not selected:
                  return []
              contracts = next(row for row in evidence["analyzer_evidence"] if isinstance(row, dict) and row.get("id") == "contracts")
              return [_snapshot_diagnostic_fact(item["side"], contracts[item["side"]]) for item in selected]


          def _snapshot_producer_category(node):
              diagnostic = node.get("diagnostic")
              if not isinstance(diagnostic, str) or not diagnostic or len(diagnostic) > 4096:
                  return "unavailable"
              families = {
                  "project_analyzer_dependency_incompatible": "project_analyzer_dependency_incompatible",
                  "project_runtime_required": "project_runtime_required",
              }
              return families.get(diagnostic.split(":", 1)[0], "other")


          def snapshot_producer_categories(evidence, diagnostic_observations):
              selected = [item for item in diagnostic_observations if item["reason"] == "unclassified"]
              if not selected:
                  return []
              contracts = next(
                  row for row in evidence["analyzer_evidence"]
                  if isinstance(row, dict) and row.get("id") == "contracts"
              )
              category_rows = []
              for item in selected:
                  category = _snapshot_producer_category(contracts[item["side"]])
                  if category in ("project_analyzer_dependency_incompatible", "project_runtime_required"):
                      category_rows.append({"analyzer": "contracts", "side": item["side"], "category": category})
              return category_rows


          def unique_json_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError("duplicate JSON field")
                  value[key] = item
              return value

          def complete_private_report(data):
              value = json.loads(data, object_pairs_hook=unique_json_object)
              if not isinstance(value, dict):
                  return {}
              if not isinstance(value.get("findings"), list) or not isinstance(value.get("analyzer_evidence"), list):
                  return {}
              return value

          def crosshair_failure_observations(findings):
              markers = {
                  "CrossHair timed out before mandatory evidence completed.": "crosshair_timeout_observed",
                  "CrossHair process error:": "crosshair_process_error_observed",
                  "Unrecognized CrossHair output:": "crosshair_unrecognized_output_observed",
                  "Unable to execute CrossHair:": "crosshair_execute_error_observed",
                  "ModuleNotFoundError": "module_not_found_observed",
                  "ImportError": "import_error_observed", "SyntaxError": "syntax_error_observed",
                  "PermissionError": "permission_error_observed", "TypeError": "type_error_observed",
                  "FileNotFoundError": "file_not_found_observed", "ValueError": "value_error_observed",
                  "wrong parameter order": "wrong_parameter_order_observed",
              }
              observed = set()
              for finding in findings[:10000]:
                  if not isinstance(finding, dict) or finding.get("category") != "tool_error" or finding.get("tool") != "crosshair":
                      continue
                  message = finding.get("message", "")
                  if isinstance(message, str):
                      observed.update(code for marker, code in markers.items() if marker in message)
              return sorted(observed)

          def incomplete_sides(members):
              observed = {}
              for name, group in members:
                  row = group[0]
                  for side in ("base", "head"):
                      node = row.get(side)
                      if isinstance(node, dict) and (node.get("execution_state") == "error" or node.get("evidence_outcome") == "UNKNOWN"):
                          observed.setdefault(name, set()).add(side)
              return {name: sorted(sides) for name, sides in sorted(observed.items())}

          import hashlib
          import re
          import stat

          _COMPATIBILITY_MEMBERS = ("contracts", "pylint")
          _COMPATIBILITY_PREDICATES = ("pinned_version_string_inequality", "active_requirement_rejects_target")
          _COMPATIBILITY_NAMES = {
              "contracts_entry": "crosshair-tool",
              "contracts_pinned_transitive": "z3-solver",
              "pylint_entry": "pylint",
              "pylint_pinned_transitive": "astroid",
          }
          _COMPATIBILITY_CATEGORY_ORDER = (*_COMPATIBILITY_NAMES, "other")


          def compatibility_protocol_root():
              value = os.environ.get("TRUSTED_ROOT")
              if not value:
                  return None
              root = Path(value)
              try:
                  if not root.is_absolute() or root.is_symlink() or not root.is_dir():
                      return None
                  root = root.resolve(strict=True)
                  for variable, filename in (("REVIEW_REPORT", "review.private.json"), ("REVIEW_LOG", "review.private.log")):
                      if Path(os.environ[variable]).resolve() != root / filename:
                          return None
              except (OSError, ValueError, KeyError):
                  return None
              return root


          def _compatibility_file_identity(info):
              return (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns, info.st_ctime_ns, info.st_mode, info.st_nlink)


          def _compatibility_private_receipt(root):

              if stat.S_IMODE(root.stat().st_mode) != 0o700:
                  raise ValueError("compatibility_directory_unavailable")
              path = root / "compatibility.private.json"
              descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(descriptor, "rb") as receipt_stream:
                  before = os.fstat(receipt_stream.fileno())
                  if not stat.S_ISREG(before.st_mode) or stat.S_IMODE(before.st_mode) != 0o600 or before.st_nlink != 1:
                      raise ValueError("compatibility_receipt_not_private_regular")
                  if before.st_size > 64 * 1024:
                      raise ValueError("compatibility_receipt_overflow")
                  content = receipt_stream.read(64 * 1024 + 1)
                  after = os.fstat(receipt_stream.fileno())
              identities = {_compatibility_file_identity(info) for info in (before, after, path.lstat())}
              if len(identities) != 1 or len(content) != before.st_size:
                  raise ValueError("compatibility_receipt_changed")
              value = json.loads(content.decode("utf-8"), object_pairs_hook=unique_json_object)
              _compatibility_exact_object(value, {"schema", "sides"})
              if value["schema"] != "compatibility-observation-v1" or not isinstance(value["sides"], list):
                  raise ValueError("compatibility_receipt_schema")
              if len(value["sides"]) != 2:
                  raise ValueError("compatibility_pair_missing")
              return value["sides"]


          def _compatibility_exact_object(value, keys):
              if not isinstance(value, dict) or set(value) != keys:
                  raise ValueError("compatibility_object_fields")


          def _compatibility_digest(value):

              return "sha256:" + hashlib.sha256(json.dumps(value, sort_keys=True, separators=(",", ":")).encode()).hexdigest()


          def _compatibility_valid_binding(binding, side):

              _compatibility_exact_object(
                  binding,
                  {
                      "side",
                      "descriptor_identity",
                      "project_identity",
                      "environment_id",
                      "worker_identity",
                      "source_roots",
                  },
              )
              if binding["side"] != side:
                  raise ValueError("compatibility_side_mismatch")
              for key in ("descriptor_identity", "project_identity", "worker_identity"):
                  if not isinstance(binding[key], str) or re.fullmatch(r"sha256:[0-9a-f]{64}", binding[key]) is None:
                      raise ValueError("compatibility_identity_invalid")
              if not isinstance(binding["environment_id"], str) or not binding["environment_id"].startswith("linux-"):
                  raise ValueError("compatibility_environment_invalid")
              roots = binding["source_roots"]
              if not isinstance(roots, list) or any(not isinstance(item, str) for item in roots):
                  raise ValueError("compatibility_roots_invalid")
              return roots


          def _compatibility_bound_runtime(binding, side, evidence):
              roots = _compatibility_valid_binding(binding, side)
              runtime = evidence["scope_evidence"]["project_runtime"][side]
              expected = {
                  "status": "PASS",
                  "schema": "project-runtime-layer-v2",
                  "identity": binding["descriptor_identity"],
                  "project_identity": binding["project_identity"],
                  "environment_id": binding["environment_id"],
                  "authority": "local_build",
                  "protected_pr_eligible": False,
                  "source_roots": roots,
              }
              if not isinstance(runtime, dict) or any(runtime.get(key) != value for key, value in expected.items()):
                  raise ValueError("compatibility_report_binding_mismatch")
              if runtime.get("protected_pr_eligible") is not False:
                  raise ValueError("compatibility_report_authority_mismatch")


          def _compatibility_bound_conflicts(observation, side, evidence):
              conflicts = observation["native_conflicts"]
              if not isinstance(conflicts, dict) or not conflicts or not set(conflicts) <= set(_COMPATIBILITY_MEMBERS):
                  raise ValueError("compatibility_conflicts_uncovered")
              if observation["conflict_digest"] != _compatibility_digest(conflicts):
                  raise ValueError("compatibility_conflict_digest_mismatch")
              analyzer_rows = evidence["analyzer_evidence"]
              if not isinstance(analyzer_rows, list) or len(analyzer_rows) > 10:
                  raise ValueError("compatibility_analyzer_rows_unavailable")
              for member, diagnostic in conflicts.items():
                  _compatibility_member_diagnostic(analyzer_rows, member, side, diagnostic)
              return conflicts


          def _compatibility_member_diagnostic(analyzer_rows, member, side, diagnostic):
              if not isinstance(diagnostic, str) or len(diagnostic) > 4096:
                  raise ValueError("compatibility_diagnostic_invalid")
              matching = [row for row in analyzer_rows if isinstance(row, dict) and row.get("id") == member]
              if len(matching) != 1:
                  raise ValueError("compatibility_analyzer_ambiguous")
              _compatibility_bound_diagnostic(matching[0].get(side), diagnostic)


          def _compatibility_bound_diagnostic(node, diagnostic):
              if not isinstance(node, dict) or not (
                  node.get("execution_state") == "error" or node.get("evidence_outcome") == "UNKNOWN"
              ):
                  raise ValueError("compatibility_analyzer_ineligible")
              if node.get("diagnostic") != diagnostic:
                  raise ValueError("compatibility_report_diagnostic_mismatch")


          def _compatibility_witness_record(witness, side):

              _compatibility_exact_object(witness, {"member", "predicate", "category", "native_reason"})
              member, predicate, category = (witness[key] for key in ("member", "predicate", "category"))
              if member not in _COMPATIBILITY_MEMBERS or predicate not in _COMPATIBILITY_PREDICATES:
                  raise ValueError("compatibility_witness_unknown")
              if category not in _COMPATIBILITY_CATEGORY_ORDER:
                  raise ValueError("compatibility_category_unknown")
              if category != "other" and not category.startswith(member + "_"):
                  raise ValueError("compatibility_category_member_mismatch")
              _compatibility_witness_reason(witness["native_reason"], predicate, category)
              return {"side": side, "analyzer": member, "predicate": predicate, "category": category}


          def _compatibility_witness_reason(reason, predicate, category):
              if not isinstance(reason, str) or len(reason) > 4096:
                  raise ValueError("compatibility_reason_invalid")
              match = re.fullmatch(r"([a-z0-9]+(?:[.-][a-z0-9]+)*): target=(.+), (.+)", reason)
              if match is None:
                  raise ValueError("compatibility_reason_format")
              name, _, suffix = match.groups()
              expected = next((key for key, value in _COMPATIBILITY_NAMES.items() if value == name), "other")
              if category != expected:
                  raise ValueError("compatibility_reason_category_mismatch")
              _compatibility_witness_predicate(predicate, category, suffix)


          def _compatibility_witness_predicate(predicate, category, suffix):
              if predicate == "pinned_version_string_inequality":
                  if category == "other" or not suffix.startswith("sealed entry=") or not suffix.removeprefix("sealed entry="):
                      raise ValueError("compatibility_pinned_reason_invalid")
              elif not suffix.startswith("required=") or " by " not in suffix:
                  raise ValueError("compatibility_requirement_reason_invalid")


          def _compatibility_bound_witnesses(observation, side, conflicts):
              witnesses = observation["witnesses"]
              if not isinstance(witnesses, list) or not witnesses:
                  raise ValueError("compatibility_witnesses_missing")
              records, reasons = [], {}
              for witness in witnesses:
                  records.append(_compatibility_witness_record(witness, side))
                  reasons.setdefault(witness["member"], set()).add(witness["native_reason"])
              reconstructed = {
                  member: "project_analyzer_dependency_incompatible:" + "; ".join(sorted(values))
                  for member, values in reasons.items()
              }
              if reconstructed != conflicts:
                  raise ValueError("compatibility_witness_map_mismatch")
              return records


          def _compatibility_subset_set(observation, records):
              if not isinstance(observation["signed_reference_matches"], bool):
                  raise ValueError("compatibility_reference_flag_invalid")
              subsets = observation["clearing_subsets"]
              if not isinstance(subsets, list) or len(subsets) > 15:
                  raise ValueError("compatibility_subsets_invalid")
              witnessed = {record["category"] for record in records}
              result = set()
              for subset in subsets:
                  result.add(_compatibility_valid_subset(subset, witnessed))
              if len(result) != len(subsets) or (not observation["signed_reference_matches"] and result):
                  raise ValueError("compatibility_subsets_unbound")
              return result


          def _compatibility_valid_subset(subset, witnessed):
              if not isinstance(subset, list) or not 1 <= len(subset) <= 4:
                  raise ValueError("compatibility_subset_invalid")
              if any(category not in _COMPATIBILITY_NAMES for category in subset):
                  raise ValueError("compatibility_subset_unknown")
              ordered = [category for category in _COMPATIBILITY_NAMES if category in subset]
              if subset != ordered or ("other" not in witnessed and not set(subset) <= witnessed):
                  raise ValueError("compatibility_subset_unwitnessed")
              return tuple(subset)


          def _compatibility_reference_comparison(observations, subsets, records):
              status, substitution_categories = "unavailable", []
              if all(row["signed_reference_matches"] for row in observations):
                  status = "not_proven"
                  common = subsets[0] & subsets[1]
                  if common and all(row["category"] != "other" for row in records):
                      minimum = min(map(len, common))
                      selected = [subset for subset in common if len(subset) == minimum]
                      status = "ambiguous"
                      if len(selected) == 1:
                          status, substitution_categories = "native_compatibility_clear", list(selected[0])
              return {"status": status, "substitution_categories": substitution_categories}


          def _compatibility_record_order(record):
              return (
                  ("base", "head").index(record["side"]),
                  _COMPATIBILITY_MEMBERS.index(record["analyzer"]),
                  _COMPATIBILITY_PREDICATES.index(record["predicate"]),
                  _COMPATIBILITY_CATEGORY_ORDER.index(record["category"]),
              )


          def bound_compatibility_proof(root, evidence):
              try:
                  observations = _compatibility_private_receipt(root)
                  records, subsets = [], []
                  for side, observation in zip(("base", "head"), observations, strict=True):
                      _compatibility_exact_object(
                          observation,
                          {
                              "status",
                              "binding",
                              "native_conflicts",
                              "conflict_digest",
                              "witnesses",
                              "signed_reference_matches",
                              "clearing_subsets",
                          },
                      )
                      if observation["status"] != "observed":
                          raise ValueError("compatibility_observation_unavailable")
                      _compatibility_bound_runtime(observation["binding"], side, evidence)
                      conflicts = _compatibility_bound_conflicts(observation, side, evidence)
                      side_records = _compatibility_bound_witnesses(observation, side, conflicts)
                      subsets.append(_compatibility_subset_set(observation, side_records))
                      records.extend(side_records)
                  records = sorted({tuple(row.items()): row for row in records}.values(), key=_compatibility_record_order)
                  if len(records) > 20:
                      raise ValueError("compatibility_records_overflow")
                  return {
                      "status": "observed",
                      "records": records,
                      "reference_comparison": _compatibility_reference_comparison(observations, subsets, records),
                  }
              except (OSError, ValueError, TypeError, KeyError, AttributeError, RecursionError):
                  return {"status": "unavailable"}
          report, header = {}, {}
          outcome = "unreadable_report"
          diagnostic_bound = 32 * 1024 * 1024
          try:
              with Path(os.environ["REVIEW_REPORT"]).open("rb") as stream:
                  data = stream.read(diagnostic_bound + 1)
              if len(data) > 2 * 1024 * 1024:
                  outcome = "oversized_report"
                  if len(data) <= diagnostic_bound:
                      header = complete_private_report(data)
              else:
                  report = complete_private_report(data)
                  outcome = "structured_report" if report else "invalid_report_shape"
          except FileNotFoundError:
              outcome = "missing_report"
          except json.JSONDecodeError:
              if outcome != "oversized_report":
                  outcome = "invalid_json"
          except (OSError, ValueError, RecursionError):
              pass
          evidence_source = report if outcome == "structured_report" else header
          rows = [row for row in evidence_source.get("analyzer_evidence", [])[:10] if isinstance(row, dict)]
          nodes = rows + [row[side] for row in rows for side in ("base", "head") if isinstance(row.get(side), dict)]
          diagnostics = [node.get("diagnostic", "") for node in nodes if isinstance(node.get("diagnostic", ""), str)]
          if outcome != "structured_report":
              try:
                  with Path(os.environ["REVIEW_LOG"]).open("rb") as stream:
                      stream.seek(0, 2)
                      stream.seek(max(0, stream.tell() - 8192))
                      diagnostics.append(stream.read(8192).decode("utf-8", errors="replace"))
              except OSError:
                  pass
          findings = report.get("findings", [])
          diagnostics += [finding["message"] for finding in findings if isinstance(finding, dict) and finding.get("category") == "tool_error" and isinstance(finding.get("message"), str)]
          allowed = ("ai-bloat-ast", "ast-clean-code", "basedpyright", "contracts", "pylint", "radon", "ruff", "semgrep-clean", "semgrep-bugs", "targeted-pytest-coverage")
          members = [(row.get("id"), [row] + [row[side] for side in ("base", "head") if isinstance(row.get(side), dict)]) for row in rows if row.get("id") in allowed]
          errors = sorted({name for name, group in members if any(node.get("execution_state") == "error" for node in group)})
          unknowns = sorted({name for name, group in members if any(node.get("evidence_outcome") == "UNKNOWN" for node in group)})
          markers = {"namespace_unavailable": "namespace_unavailable",
              "capsule_materialization_failed": "capsule_materialization_failed",
              "analyzer_reported_incomplete_execution": "analyzer_reported_incomplete_execution",
              "project_runtime_prepare_failed": "project_runtime_prepare_failed",
              "local_pytest_inventory_failed": "local_pytest_inventory_failed",
              "project_test_selection_ambiguous": "project_test_selection_ambiguous",
              "TimeoutExpired": "timeout_marker_observed"}
          codes = [code for marker, code in markers.items() if any(marker in text for text in diagnostics)]
          assurance = report.get("assurance_status")
          verdict = report.get("overall_verdict")
          projected = {"phase": "independent_review", "report_outcome": outcome,
              "assurance_status": assurance if assurance in ("PASS", "FAIL", "UNKNOWN", "NOT_APPLICABLE") else "UNAVAILABLE",
              "overall_verdict": verdict if verdict in ("PASS", "PASS_WITH_ADVISORY", "FAIL") else "UNAVAILABLE",
              "findings_present": bool(findings),
              "tool_error_present": any(isinstance(finding, dict) and finding.get("category") == "tool_error" for finding in findings),
              "execution_error_present": any(node.get("execution_state") == "error" for node in nodes),
              "unknown_evidence_present": evidence_source.get("has_unknown_required_evidence") is True or any(node.get("evidence_outcome") == "UNKNOWN" for node in nodes),
              "error_analyzers": errors, "unknown_analyzers": unknowns,
              "diagnostic_observations": codes or ["unclassified"]}
          if outcome == "oversized_report":
              projected["report_header_observed"] = bool(header)
          if outcome in ("structured_report", "oversized_report"):
              projected["error_analyzer_sides"] = incomplete_sides(members)
              projected["crosshair_failure_observations"] = crosshair_failure_observations(evidence_source.get("findings", []))
          snapshot_observations = snapshot_diagnostic_observations(evidence_source)
          if snapshot_observations:
              projected["snapshot_diagnostic_observations"] = snapshot_observations
          snapshot_facts = snapshot_diagnostic_facts(evidence_source, snapshot_observations)
          if snapshot_facts:
              projected["snapshot_diagnostic_facts"] = snapshot_facts
          categories = snapshot_producer_categories(evidence_source, snapshot_observations)
          if categories:
              projected["snapshot_producer_categories"] = categories
          compatibility_root = compatibility_protocol_root()
          if compatibility_root is not None:
              projected["compatibility_proof"] = bound_compatibility_proof(compatibility_root, evidence_source)
          print(json.dumps(projected))
          PY_REVIEW_FAILURE
