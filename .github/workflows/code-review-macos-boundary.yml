# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: macOS native boundary fixtures

on:
  pull_request:
    paths:
      - .github/workflows/code-review-macos-boundary.yml
      - scripts/macos_managed_boundary/**
      - scripts/check_macos_boundary_ci_receipts.py
      - packages/specfact-code-review/native/macos-arm64/**
      - packages/specfact-code-review/src/specfact_code_review/run/**
      - tests/unit/test_macos_managed_*.py
      - tests/unit/test_macos_control_*.py
      - tests/unit/test_macos_boundary_ci_receipts.py
      - tests/unit/test_macos_native_broker_wait.py
      - tests/unit/test_macos_native_file_budget.py
      - tests/unit/specfact_code_review/run/test_native_*.py
      - tests/unit/specfact_code_review/run/test_runner_native.py
      - openspec/changes/code-review-native-platform-execution/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-boundary:
    name: boundary (${{ matrix.runner }}, ARM64)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # Official ARM64 labels and image OS/builds accessed 2026-10-03.
        # Sources and macOS 14 retirement are recorded in NATIVE_BOUNDARY_CI.md.
        # Labels float: reject image drift rather than silently widening evidence.
        include:
          - runner: macos-14
            os-version: "14.8.9"
            os-build: "23J631"
          - runner: macos-15
            os-version: "15.7.9"
            os-build: "24G830"
          - runner: macos-26
            os-version: "26.6.2"
            os-build: "25G83"
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_RUNNER: ${{ matrix.runner }}
      EXPECTED_OS_VERSION: ${{ matrix.os-version }}
      EXPECTED_OS_BUILD: ${{ matrix.os-build }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout PR merge tree without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select stdlib helper Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          architecture: arm64
      - name: Assert exact native platform and ordinary-user GUI launchd domain
        id: platform
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          import re
          import subprocess
          import sys
          from pathlib import Path

          def read(args):
              return subprocess.run(
                  args, check=True, capture_output=True, text=True, timeout=10
              ).stdout.strip()

          try:
              os.umask(0o077)
              assert sys.version_info[:2] == (3, 13)
              assert platform.system() == "Darwin"
              assert os.environ["RUNNER_ARCH"] == "ARM64"
              assert platform.machine() == read(["/usr/bin/uname", "-m"]) == "arm64"
              assert read(["/usr/sbin/sysctl", "-n", "hw.optional.arm64"]) == "1"
              translated = subprocess.run(
                  ["/usr/sbin/sysctl", "-in", "sysctl.proc_translated"],
                  capture_output=True, text=True, timeout=10,
              )
              assert translated.returncode in (0, 1)
              assert translated.stdout.strip() in ("", "0")
              assert os.getuid() != 0
              version = read(["/usr/bin/sw_vers", "-productVersion"])
              build = read(["/usr/bin/sw_vers", "-buildVersion"])
              assert version == os.environ["EXPECTED_OS_VERSION"]
              assert build == os.environ["EXPECTED_OS_BUILD"]
              assert build == read(["/usr/sbin/sysctl", "-n", "kern.osversion"])
              assert Path(read(["/usr/bin/xcrun", "--find", "clang"])).is_file()
              assert Path("/usr/bin/codesign").is_file()
              # No sudo, synthetic GUI session, skip or weaker launchd fallback.
              read(["/bin/launchctl", "print", f"gui/{os.getuid()}"])
              image = os.environ.get("ImageVersion", "")
              assert re.fullmatch(r"[0-9.]+", image)
              root = Path(os.environ["RUNNER_TEMP"]) / "specfact-macos-boundary"
              root.mkdir(mode=0o700, exist_ok=False)
              context = {
                  "runner": os.environ["EXPECTED_RUNNER"],
                  "architecture": "arm64", "os_version": version, "os_build": build,
                  "image_version": image, "python": platform.python_version(),
                  "gui_launchd_available": True,
              }
              (root / "platform.json").write_text(json.dumps(context))
              print(json.dumps(context, sort_keys=True))
          except Exception:
              message = "Native platform/tool/GUI launchd preflight failed; no acceptance."
              print(message)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
                  summary.write(message + "\n")
              raise SystemExit(1)
          PY
      - name: Prove release broker cleans up controller loss during WAIT
        env:
          SPECFACT_NATIVE_CONTROL: "1"
        run: |
          python -B tests/unit/test_macos_native_broker_wait.py --self-test
      - name: Prove failed bootstrap cannot run the target
        env:
          SPECFACT_NATIVE_CONTROL: "1"
        run: |
          python -B tests/unit/test_macos_native_broker_wait.py --failure-self-test
      - name: Prove task and thread exception-port changes are denied
        env:
          SPECFACT_NATIVE_CONTROL: "1"
        run: |
          python -B tests/unit/test_macos_native_broker_wait.py --exception-self-test
      - name: Prove failed spawn flag setup cannot launch a worker
        env:
          SPECFACT_NATIVE_CONTROL: "1"
        run: |
          python -B tests/unit/test_macos_native_spawn_flags.py --self-test
      - name: Prove file writes use the independent file budget
        env:
          SPECFACT_NATIVE_CONTROL: "1"
        run: |
          python -B tests/unit/test_macos_native_file_budget.py --self-test
      - name: Run startup then control at 100 repetitions each
        # One foreground process runs both suites serially; no retries.
        run: |
          python -B scripts/check_macos_boundary_ci_receipts.py
