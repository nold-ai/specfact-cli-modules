name: Module signing key preflight

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ["ci/codebase-0.42.1.signing-payload.txt"]

permissions:
  contents: read

jobs:
  verify-replacement-key:
    if: github.event_name == 'workflow_dispatch' && github.ref_protected && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: module-signing
    steps:
      - name: Check out protected source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Verify replacement key pair
        shell: bash
        env:
          MODULE_PRIVATE_KEY: ${{ secrets.MODULE_SIGNING_PRIVATE_KEY_V2 }}
          MODULE_KEY_PASSPHRASE: ${{ secrets.MODULE_SIGNING_PRIVATE_KEY_PASSPHRASE_V2 }}
          EXPECTED_PUBLIC_KEY_SHA256: ${{ vars.MODULE_SIGNING_PUBLIC_KEY_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "${MODULE_PRIVATE_KEY:-}" || -z "${MODULE_KEY_PASSPHRASE:-}" ]]; then
            echo "::error::Replacement signing secrets are missing."
            exit 1
          fi
          if [[ ! "${EXPECTED_PUBLIC_KEY_SHA256:-}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::The module signing environment must pin the replacement public key."
            exit 1
          fi

          pem=${MODULE_PRIVATE_KEY%$'\n'}
          begin=$'-----BEGIN ENCRYPTED PRIVATE KEY-----\n'
          end=$'\n-----END ENCRYPTED PRIVATE KEY-----'
          encoded=${pem#"$begin"}
          encoded=${encoded%"$end"}
          if [[ "$pem" != "$begin"*"$end" || ! "$encoded" =~ ^[A-Za-z0-9+/=[:space:]]+$ ]]; then
            echo "::error::Use a single encrypted PKCS#8 private key PEM."
            exit 1
          fi

          public_key=ci/module-signing-public-next.pem
          public_fingerprint=$(openssl pkey -pubin -in "$public_key" -outform DER | sha256sum)
          if [[ "${public_fingerprint%% *}" != "$EXPECTED_PUBLIC_KEY_SHA256" ]]; then
            echo "::error::The tracked key does not match the signing environment fingerprint."
            exit 1
          fi

          umask 077
          scratch=$(mktemp -d "${RUNNER_TEMP:?}/module-signing-proof.XXXXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          printf 'SpecFact module-signing preflight %s\n' "$GITHUB_SHA" > "$scratch/challenge"
          openssl pkeyutl -sign -rawin \
            -inkey <(printf '%s\n' "$MODULE_PRIVATE_KEY") -passin fd:3 \
            -in "$scratch/challenge" -out "$scratch/signature" \
            3< <(printf '%s\n' "$MODULE_KEY_PASSPHRASE")
          openssl pkeyutl -verify -rawin -pubin -inkey "$public_key" \
            -in "$scratch/challenge" -sigfile "$scratch/signature"

  sign-codebase-candidate:
    name: Sign Codebase 0.42.1
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: module-signing
    steps:
      - name: Check out protected source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Sign and verify the approved payload
        shell: bash
        env:
          MODULE_PRIVATE_KEY: ${{ secrets.MODULE_SIGNING_PRIVATE_KEY_V2 }}
          MODULE_KEY_PASSPHRASE: ${{ secrets.MODULE_SIGNING_PRIVATE_KEY_PASSPHRASE_V2 }}
          EXPECTED_PUBLIC_KEY_SHA256: ${{ vars.MODULE_SIGNING_PUBLIC_KEY_SHA256 }}
        run: |
          set -euo pipefail
          expected_payload=a826c75ef57409191711f1af03dd13877d56d48769ba3a2e29d1929e16ce9909
          expected_key=68ebe68cd4394c5319b85fe5b021460f3bae411dbfad795782657d0fe005d053
          public_key=ci/module-signing-public-next.pem
          actual_key=$(openssl pkey -pubin -in "$public_key" -outform DER | sha256sum)
          if [[ "$EXPECTED_PUBLIC_KEY_SHA256" != "$expected_key" || "${actual_key%% *}" != "$expected_key" ]]; then
            echo "::error::The replacement key fingerprint does not match the reviewed key." >&2
            exit 1
          fi

          umask 077
          scratch=$(mktemp -d "${RUNNER_TEMP:?}/codebase-signature.XXXXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          python3 - "$scratch/payload" <<'PYTHON'
          from pathlib import Path
          from sys import argv

          payload = Path("ci/codebase-0.42.1.signing-payload.txt").read_bytes()
          Path(argv[1]).write_bytes(payload.removesuffix(b"\n"))
          PYTHON
          actual_payload=$(sha256sum "$scratch/payload")
          if [[ "${actual_payload%% *}" != "$expected_payload" ]]; then
            echo "::error::The Codebase payload checksum does not match the reviewed candidate." >&2
            exit 1
          fi

          pem=${MODULE_PRIVATE_KEY%$'\n'}
          begin=$'-----BEGIN ENCRYPTED PRIVATE KEY-----\n'
          end=$'\n-----END ENCRYPTED PRIVATE KEY-----'
          encoded=${pem#"$begin"}
          encoded=${encoded%"$end"}
          if [[ -z "$MODULE_KEY_PASSPHRASE" || "$pem" != "$begin"*"$end" || ! "$encoded" =~ ^[A-Za-z0-9+/=[:space:]]+$ ]]; then
            echo "::error::An encrypted PKCS#8 private key and passphrase are required." >&2
            exit 1
          fi
          openssl pkeyutl -sign -rawin \
            -inkey <(printf '%s\n' "$pem") -passin fd:3 \
            -in "$scratch/payload" -out "$scratch/signature" \
            3< <(printf '%s\n' "$MODULE_KEY_PASSPHRASE")
          if ! openssl pkeyutl -verify -rawin -pubin -inkey "$public_key" \
            -in "$scratch/payload" -sigfile "$scratch/signature" >/dev/null; then
            echo "::error::The replacement key did not verify the detached signature." >&2
            exit 1
          fi

          signature=$(openssl base64 -A -in "$scratch/signature")
          {
            printf '## Codebase 0.42.1 detached signature\n\n'
            printf 'Payload SHA-256: %s\n\n' "$expected_payload"
            printf '~~~text\n%s\n~~~\n' "$signature"
          } >> "$GITHUB_STEP_SUMMARY"
