name: sign-modules

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: Branch to compare against for version checks
        type: choice
        options: [dev, main]
        default: dev
  push:
    branches: [dev, main]
    paths:
      - "packages/**"
      - "registry/**"
      - "ci/module-signing-public-next.pem"
      - "ci/official-module-release-cutoff.json"
      - "scripts/sign-modules.py"
      - "scripts/verify-modules-signature.py"
      - ".github/workflows/sign-modules.yml"
      - ".github/workflows/sign-modules-on-approval.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "packages/**"
      - "registry/**"
      - "ci/module-signing-public-next.pem"
      - "ci/official-module-release-cutoff.json"
      - "scripts/sign-modules.py"
      - "scripts/verify-modules-signature.py"
      - ".github/workflows/sign-modules.yml"
      - ".github/workflows/native-pr-review.yml"
      - ".github/workflows/sign-modules-on-approval.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify Module Signatures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verifier dependencies
        run: python -m pip install pyyaml cryptography cffi

      - name: Verify checksums, signatures and versions
        env:
          BASE_BRANCH: ${{ github.base_ref || inputs.base_branch }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          args=(--public-key-file ci/module-signing-public-next.pem --payload-from-filesystem --enforce-version-bump)
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            base="$BEFORE_SHA"
            if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]]; then
              base=HEAD~1
            fi
            args+=(--require-signature)
          else
            base="refs/remotes/origin/$BASE_BRANCH"
          fi
          python scripts/verify-modules-signature.py "${args[@]}" --version-check-base "$base"

  reproducibility:
    name: Assert signing reproducibility
    if: github.event_name == 'push' && github.ref_protected && github.ref == 'refs/heads/main'
    needs: [verify]
    runs-on: ubuntu-latest
    environment: module-signing
    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verifier dependencies
        run: python -m pip install pyyaml cryptography cffi

      - name: Reproduce replacement signatures
        env:
          MODULE_PRIVATE_KEY: ${{ secrets.MODULE_SIGNING_PRIVATE_KEY_V2 }}
          MODULE_KEY_PASSPHRASE: ${{ secrets.MODULE_SIGNING_PRIVATE_KEY_PASSPHRASE_V2 }}
          EXPECTED_PUBLIC_KEY_SHA256: ${{ vars.MODULE_SIGNING_PUBLIC_KEY_SHA256 }}
        run: |
          python - <<'PYTHON'
          import base64
          import hashlib
          import os
          import runpy
          from pathlib import Path

          import yaml
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          pem = os.environ["MODULE_PRIVATE_KEY"].strip()
          passphrase = os.environ["MODULE_KEY_PASSPHRASE"]
          if not pem.startswith("-----BEGIN ENCRYPTED PRIVATE KEY-----\n") or not passphrase:
              raise SystemExit("An encrypted replacement signing key and passphrase are required.")
          key = serialization.load_pem_private_key(pem.encode(), password=passphrase.encode())
          if not isinstance(key, Ed25519PrivateKey):
              raise SystemExit("The replacement signing key must be Ed25519.")
          public_der = key.public_key().public_bytes(
              serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo,
          )
          tracked_key = serialization.load_pem_public_key(Path("ci/module-signing-public-next.pem").read_bytes())
          tracked_der = tracked_key.public_bytes(
              serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo,
          )
          if public_der != tracked_der or hashlib.sha256(public_der).hexdigest() != os.environ["EXPECTED_PUBLIC_KEY_SHA256"]:
              raise SystemExit("The replacement signing key does not match the pinned public key.")

          verifier = runpy.run_path("scripts/verify-modules-signature.py", run_name="specfact_module_signature_verifier")
          for manifest in sorted(Path("packages").glob("*/module-package.yaml")):
              data = yaml.safe_load(manifest.read_bytes())
              if verifier["_matches_published_cutoff"](manifest, data):
                  print(f"Verified immutable cutoff tree: {manifest}")
                  continue
              payload = verifier["_module_payload"](manifest.parent, payload_from_filesystem=True)
              recorded_signature = base64.b64decode(data["integrity"]["signature"], validate=True)
              if key.sign(payload) != recorded_signature:
                  raise SystemExit(f"Replacement signature is not reproducible: {manifest}")
              print(f"Reproduced replacement signature: {manifest}")
          PYTHON
