name: Sign two reviewed Project payloads once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-source-manifest:
    if: github.repository == 'nold-ai/specfact-cli-modules' && github.ref == 'refs/heads/codex/532-525-project-resign' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: module-signing
    steps:
      - name: Check out the frozen signing branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Sign the exact two Project source payloads
        shell: bash
        env:
          MODULE_PRIVATE_KEY: ${{ secrets.MODULE_SIGNING_PRIVATE_KEY_V2 }}
          MODULE_KEY_PASSPHRASE: ${{ secrets.MODULE_SIGNING_PRIVATE_KEY_PASSPHRASE_V2 }}
          EXPECTED_PUBLIC_KEY_SHA256: ${{ vars.MODULE_SIGNING_PUBLIC_KEY_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          public_key=ci/module-signing-public-next.pem
          expected=68ebe68cd4394c5319b85fe5b021460f3bae411dbfad795782657d0fe005d053
          [[ "${EXPECTED_PUBLIC_KEY_SHA256:-}" == "$expected" ]]
          fingerprint=$(openssl pkey -pubin -in "$public_key" -outform DER | sha256sum)
          [[ "${fingerprint%% *}" == "$expected" ]]
          [[ "${MODULE_PRIVATE_KEY:-}" == '-----BEGIN ENCRYPTED PRIVATE KEY-----'* && -n "${MODULE_KEY_PASSPHRASE:-}" ]]
          scratch=$(mktemp -d "${RUNNER_TEMP:?}/manifest-sign.XXXXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          while read -r label digest; do
            payload="ci/532-525-project-signing/$label.payload"
            payload_digest=$(sha256sum "$payload")
            [[ "${payload_digest%% *}" == "$digest" ]]
            openssl pkeyutl -sign -rawin \
              -inkey <(printf '%s\n' "$MODULE_PRIVATE_KEY") -passin fd:3 \
              -in "$payload" -out "$scratch/$label.signature" \
              3< <(printf '%s\n' "$MODULE_KEY_PASSPHRASE")
            openssl pkeyutl -verify -rawin -pubin -inkey "$public_key" -in "$payload" -sigfile "$scratch/$label.signature"
          done <<'EXPECTED_PAYLOADS'
          project-0.41.32 116a3292f022ee22a3a423ed88612a46de62c4942c9243e9aacdec868ec56a14
          project-0.41.33 ee872954d1ec447c95b636c4be7a114738ddba8da3d8989305d97e0a43236f81
          EXPECTED_PAYLOADS
          for label in project-0.41.32 project-0.41.33; do
            printf 'SOURCE_SIGNATURE %s %s\n' "$label" "$(openssl base64 -A -in "$scratch/$label.signature")"
          done
