name: One-use direct Semgrep input diagnostic
on:
  push:
    branches:
      - codex/pr510-semgrep-once-25
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/semgrep-input-diagnostic.yml
      - scripts/semgrep_input_diagnostic.py
      - tests/host/proof_independent_review_diagnostic.py
permissions:
  contents: read
jobs:
  diagnostic:
    if: >-
      github.event_name == 'push' &&
      github.event.created == true && github.event.deleted == false &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.event.after == github.sha && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Admit the single reviewed tooling child before provisioning
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/semgrep_input_diagnostic.py --phase admit \
            --root "$RUNNER_TEMP/semgrep-once-25" --repository "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 3
        with:
          python-version: "3.12"
      - name: Bounded authenticated setup and four private direct scans
        shell: bash
        run: |
          set -euo pipefail
          python -I scripts/semgrep_input_diagnostic.py --phase setup \
            --root "$RUNNER_TEMP/semgrep-once-25" --repository "$GITHUB_WORKSPACE"
      - name: Retain only bounded public diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semgrep-once-25-public
          path: |
            ${{ runner.temp }}/semgrep-once-25/evidence/public.json
            ${{ runner.temp }}/semgrep-once-25/evidence/*-failure.public.json
          if-no-files-found: ignore
          retention-days: 14

  linux-host-proof:
    if: github.event_name == 'pull_request' && github.head_ref != 'codex/pr510-semgrep-once-25'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_CORE: d579970565530c3fd7b98bad4de90cf874c2a99d
      SPECFACT_CLI_REPO: ${{ github.workspace }}/.paired-core
      PYTHONPATH: ${{ github.workspace }}/packages/specfact-project/src:${{ github.workspace }}/packages/specfact-requirements/src
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        timeout-minutes: 2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        timeout-minutes: 2
        with:
          repository: nold-ai/specfact-cli
          ref: d579970565530c3fd7b98bad4de90cf874c2a99d
          path: .paired-core
          persist-credentials: false
      - name: Assert and retain exact source identities
        env:
          PROOF_DIR: ${{ runner.temp }}/semgrep-host-proof
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_DIR"
          { git rev-parse HEAD; git -C "$SPECFACT_CLI_REPO" rev-parse HEAD; } > "$PROOF_DIR/identities.txt"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C "$SPECFACT_CLI_REPO" rev-parse HEAD)" = "$EXPECTED_CORE"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 2
        with:
          python-version: "3.12"
      - name: Install Hatch
        timeout-minutes: 2
        run: python -m pip install hatch
      - name: Bootstrap Hatch serially
        timeout-minutes: 4
        run: hatch env create
      - name: Bind the pinned paired core dependency
        timeout-minutes: 3
        run: hatch run python tools/ensure_core_dependency.py
      - name: Run mandatory ordinary host owners
        env:
          PROOF_DIR: ${{ runner.temp }}/semgrep-host-proof
        timeout-minutes: 11
        shell: bash
        run: |
          set -euo pipefail
          timeout 600 hatch run python -m pytest tests/host/proof_capsule_deferred_review_ci.py tests/host/proof_independent_review_diagnostic.py -n0 --junitxml="$PROOF_DIR/junit.xml" 2>&1 | tee "$PROOF_DIR/pytest.log"
      - name: Require every real Linux lifecycle proof
        env:
          PROOF_DIR: ${{ runner.temp }}/semgrep-host-proof
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PYPROOF'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          expected = {
              "test_linux30_bounded_capture_lifecycle": 4,
              "test_linux30_preexec_hang_and_cleanup_failure_preserve_primary": 1,
              "test_linux30_pre_namespace_authentication_precedes_child_execution": 1,
              "test_linux30_descendant_holding_pipe_is_observed_and_reaped": 1,
              "test_linux31_outermost_handoff_reaps_real_child_and_descendant": 5,
          }
          directory = Path(os.environ["PROOF_DIR"])
          cases = list(ET.parse(directory / "junit.xml").iter("testcase"))
          counts = {}
          for name, count in expected.items():
              selected = [case for case in cases if case.get("name", "").split("[", 1)[0] == name]
              assert len(selected) == count, f"Missing lifecycle case: {name}"
              assert len({case.get("name") for case in selected}) == count, f"Duplicate lifecycle case: {name}"
              assert all(not any(case.find(tag) is not None for tag in ("skipped", "failure", "error")) for case in selected), f"Incomplete lifecycle proof: {name}"
              counts[name] = count
          (directory / "lifecycle-counts.json").write_text(json.dumps(counts, sort_keys=True) + "\n")
          print(json.dumps(counts, sort_keys=True))
          PYPROOF
      - name: Retain exact-head host proof evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semgrep-host-proof-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/semgrep-host-proof/
          if-no-files-found: warn
          retention-days: 14
