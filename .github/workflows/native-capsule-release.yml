# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Native capsule build and protected staging

on:
  pull_request:
    paths:
      - scripts/native_release/**
      - scripts/native_analyzer_inputs/**
      - scripts/macos_managed_boundary/**
      - scripts/*macos*native*.py
      - scripts/build_macos_managed_*.py
      - packages/specfact-code-review/**
      - .github/workflows/native-capsule-release.yml
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Upload reviewed signed candidate blobs after separate human environment approval
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}/packages/specfact-code-review/src:${{ github.workspace }}
  PYTHONDONTWRITEBYTECODE: "1"
  SOURCE_SHA: ${{ github.sha }}

jobs:
  tools:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          architecture: arm64
      - run: python -m pip install specfact-cli==0.55.4 cryptography==50.0.2
      - name: Reproduce managed uv and Git without signing secrets
        run: bash scripts/native_release/prepare-ci.sh tools "$RUNNER_TEMP/inputs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-managed-tools
          path: |
            ${{ runner.temp }}/inputs/managed-uv
            ${{ runner.temp }}/inputs/managed-git
          if-no-files-found: error
          retention-days: 7

  build:
    needs: tools
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: cp311
            python: "3.11"
          - abi: cp312
            python: "3.12"
          - abi: cp313
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          architecture: arm64
      - run: python -m pip install specfact-cli==0.55.4 cryptography==50.0.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-managed-tools
          path: ${{ runner.temp }}/tools
      - name: Restore the fixed immutable modes after artifact transport
        run: |
          chmod 0555 "$RUNNER_TEMP/tools/managed-uv/bin/uv" "$RUNNER_TEMP/tools/managed-git/bin/git"
          chmod -R a-w "$RUNNER_TEMP/tools/managed-uv" "$RUNNER_TEMP/tools/managed-git"
      - name: Prepare hash-pinned CPython, analyzers, Node and Z3
        env:
          ABI: ${{ matrix.abi }}
        run: bash scripts/native_release/prepare-ci.sh "$ABI" "$RUNNER_TEMP/inputs"
      - name: Build exact unsigned archive with the narrow ad-hoc loader profile
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          SPECFACT_MANAGED_UV_ARTIFACT: ${{ runner.temp }}/tools/managed-uv
          SPECFACT_MANAGED_GIT_ARTIFACT: ${{ runner.temp }}/tools/managed-git
        run: |
          python -m scripts.native_release.build --work "$RUNNER_TEMP/build" \
            --venv "$RUNNER_TEMP/inputs/venv" --version "$PYTHON_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: darwin-arm64-${{ matrix.abi }}
          path: ${{ runner.temp }}/build/darwin-arm64-${{ matrix.abi }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  execute:
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-26]
        python: ["3.11", "3.12", "3.13"]
        include:
          - python: "3.11"
            abi: cp311
          - python: "3.12"
            abi: cp312
          - python: "3.13"
            abi: cp313
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          architecture: arm64
      - run: python -m pip install specfact-cli==0.55.4 cryptography==50.0.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: darwin-arm64-${{ matrix.abi }}
          path: ${{ runner.temp }}/archive
      - name: Execute exact archive, real extensions, all analyzers and offline reuse
        env:
          PLATFORM_LABEL: ${{ matrix.runner }}
        run: |
          python -m scripts.native_release.acceptance --mode candidate \
            --artifact "$RUNNER_TEMP/archive" --work "$RUNNER_TEMP/acceptance" --runner "$PLATFORM_LABEL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: receipt-${{ matrix.runner }}-${{ matrix.abi }}
          path: ${{ runner.temp }}/acceptance/receipt.json
          if-no-files-found: error
          retention-days: 7

  sign-and-stage:
    needs: execute
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Configure main-only deployment plus required human reviewers before enabling.
    # Use dedicated environment secrets, never repository-level publisher secrets.
    environment: native-capsule-signing
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: python -m pip install specfact-cli==0.55.4 cryptography==50.0.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: darwin-arm64-*
          path: ${{ runner.temp }}/archives
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: receipt-*
          path: ${{ runner.temp }}/receipts
      - name: Verify required independent review and protected deployment policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.native_release.environment --name native-capsule-signing
      - name: Collect exact nine-cell acceptance matrix without a private key
        run: python -m scripts.native_release.cli collect --receipts "$RUNNER_TEMP/receipts" --output "$RUNNER_TEMP/matrix.json"
      - name: Data-only protected signing; do not execute candidate payloads
        env:
          SPECFACT_NATIVE_CAPSULE_PRIVATE_SIGN_KEY: ${{ secrets.SPECFACT_NATIVE_CAPSULE_PRIVATE_SIGN_KEY }}
          SPECFACT_NATIVE_CAPSULE_PRIVATE_SIGN_KEY_PASSPHRASE: ${{ secrets.SPECFACT_NATIVE_CAPSULE_PRIVATE_SIGN_KEY_PASSPHRASE }}
        run: |
          python -m scripts.native_release.cli sign --artifacts "$RUNNER_TEMP/archives" \
            --receipts "$RUNNER_TEMP/matrix.json" --output "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-signed-release-staging
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish-candidate:
    needs: sign-and-stage
    if: github.event_name == 'workflow_dispatch' && inputs.publish_candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: native-capsule-publication
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: python -m pip install specfact-cli==0.55.4 cryptography==50.0.2
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6
        with:
          version: 1.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-signed-release-staging
          path: ${{ runner.temp }}/release
      - name: Verify independent publication approval and protected deployment policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.native_release.environment --name native-capsule-publication
      - name: Authenticate the human-approved uploader without signing authority
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Upload immutable blobs and require anonymous exact-byte acquisition
        run: python -m scripts.native_release.publish --release "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-published-catalog-staging
          path: |
            ${{ runner.temp }}/release/module
            ${{ runner.temp }}/release/anonymous-publication-verified.txt
          if-no-files-found: error
          retention-days: 7
