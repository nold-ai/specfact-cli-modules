# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# yamllint disable rule:line-length rule:truthy
name: Docs Review

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "**/*.md"
      - "**/*.mdc"
      - "docs/**"
      - "packages/**"
      - "packages/*/resources/**"
      - "registry/**"
      - "requirements-docs-ci.txt"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "scripts/pre-commit-quality-checks.sh"
      - "scripts/check-core-documentation-accountability.py"
      - "scripts/check-docs-commands.py"
      - "scripts/check-prompt-commands.py"
      - "scripts/check-command-contract.py"
      - "scripts/generate-command-overview.py"
      - "docs/reference/commands.generated.*"
      - "llms.txt"
      - "scripts/docs_site_validation.py"
      - "tests/unit/test_check_docs_commands_script.py"
      - "tests/unit/test_check_prompt_commands_script.py"
      - "tests/unit/test_core_documentation_accountability.py"
      - "tests/unit/test_pre_commit_quality_parity.py"
      - "tests/unit/docs/test_docs_review.py"
      - "tests/unit/docs/test_code_review_docs_parity.py"
      - "tests/unit/docs/test_llms_overview_freshness.py"
      - ".github/workflows/docs-review.yml"
  push:
    branches: [main, dev]
    paths:
      - "**/*.md"
      - "**/*.mdc"
      - "docs/**"
      - "packages/**"
      - "packages/*/resources/**"
      - "registry/**"
      - "requirements-docs-ci.txt"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "scripts/pre-commit-quality-checks.sh"
      - "scripts/check-core-documentation-accountability.py"
      - "scripts/check-docs-commands.py"
      - "scripts/check-prompt-commands.py"
      - "scripts/check-command-contract.py"
      - "scripts/generate-command-overview.py"
      - "docs/reference/commands.generated.*"
      - "llms.txt"
      - "scripts/docs_site_validation.py"
      - "tests/unit/test_check_docs_commands_script.py"
      - "tests/unit/test_check_prompt_commands_script.py"
      - "tests/unit/test_core_documentation_accountability.py"
      - "tests/unit/test_pre_commit_quality_parity.py"
      - "tests/unit/docs/test_docs_review.py"
      - "tests/unit/docs/test_code_review_docs_parity.py"
      - "tests/unit/docs/test_llms_overview_freshness.py"
      - ".github/workflows/docs-review.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-review:
    name: Docs Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve paired core command sources ref
        id: core-ref
        shell: bash
        env:
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
          FALLBACK_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          candidate="${CANDIDATE_REF}"
          if [ -n "$candidate" ] && git ls-remote --exit-code --heads https://github.com/nold-ai/specfact-cli.git "$candidate" >/dev/null 2>&1; then
            echo "ref=$candidate" >> "$GITHUB_OUTPUT"
          else
            fallback="${FALLBACK_REF:-dev}"
            case "$fallback" in
              main|dev) ;;
              *) fallback="dev" ;;
            esac
            echo "ref=$fallback" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout paired core command sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: nold-ai/specfact-cli
          path: specfact-cli
          ref: ${{ steps.core-ref.outputs.ref }}
          persist-credentials: false

      - name: Export paired core source path
        run: echo "SPECFACT_CLI_REPO=${GITHUB_WORKSPACE}/specfact-cli" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install docs review dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install hatch
          python -m pip install -e "${SPECFACT_CLI_REPO}"
          hatch run python -m pip install -e "${SPECFACT_CLI_REPO}"
          python -m pip install -r requirements-docs-ci.txt

      - name: Run docs review suite
        run: |
          mkdir -p logs/docs-review
          DOCS_REVIEW_LOG="logs/docs-review/docs-review_$(date -u +%Y%m%d_%H%M%S).log"
          python -m pytest \
            tests/unit/docs/test_docs_review.py \
            tests/unit/docs/test_code_review_docs_parity.py \
            tests/unit/test_core_documentation_accountability.py \
            tests/unit/test_pre_commit_quality_parity.py \
            tests/unit/docs/test_llms_overview_freshness.py \
            -q 2>&1 | tee "$DOCS_REVIEW_LOG"
          exit "${PIPESTATUS[0]:-$?}"

      - name: Validate docs commands and cross-site links
        run: |
          mkdir -p logs/docs-review
          DOCS_COMMAND_LOG="logs/docs-review/docs-command-validation_$(date -u +%Y%m%d_%H%M%S).log"
          python scripts/check-docs-commands.py 2>&1 | tee "$DOCS_COMMAND_LOG"
          exit "${PIPESTATUS[0]:-$?}"

      - name: Validate prompt commands
        run: |
          mkdir -p logs/docs-review
          PROMPT_COMMAND_LOG="logs/docs-review/prompt-command-validation_$(date -u +%Y%m%d_%H%M%S).log"
          python scripts/check-prompt-commands.py 2>&1 | tee "$PROMPT_COMMAND_LOG"
          exit "${PIPESTATUS[0]:-$?}"

      - name: Validate generated command overview
        run: |
          hatch run check-command-overview
          hatch run check-command-contract
          exit "${PIPESTATUS[0]:-$?}"

      - name: Validate core documentation accountability
        run: hatch run check-core-documentation-accountability

      - name: Upload docs review logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-review-logs
          path: logs/docs-review/
          if-no-files-found: ignore
